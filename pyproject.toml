[project]
name = "max-float"
version = "0.1.0"
description = "A river permit lottery planner: knowledge graph + MCP server + LLM chatbot."
readme = "README.md"
authors = [
    { name = "Genevieve Andersen" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
max-float = "max_float:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
