[project]
name = "max-float"
version = "0.1.0"
description = "Pick the river permit launch dates your group should apply for."
readme = "README.md"
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-files = ["LICENSE.md"]
authors = [
    { name = "Genevieve Roberts" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.123",
    "fastapi>=0.162.0",
    "matplotlib>=3.11.2",
    "neo4j>=6.4.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "seaborn>=0.13.2",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "pandas>=3.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
