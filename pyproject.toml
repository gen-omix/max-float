[project]
name = "max-float"
version = "0.1.0"
description = "Pick the river permit launch dates your group should apply for."
readme = "README.md"
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-files = ["LICENSE.md"]
authors = [
    { name = "Genevieve Roberts" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.123",
    "neo4j>=6.4.1",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
