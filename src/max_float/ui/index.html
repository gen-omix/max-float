          </section>
          <section class="panel sample" id="sample" hidden>
            <h2>Draft dates</h2>
            <div class="drafts" id="drafts"></div>
            <h3 id="sample-title"></h3>
            <div id="sample-years"></div>
            <div class="preview" id="preview" hidden></div>
          </section>
        </div>
      </main>
    </div>
  </div>
</div>
<div class="next" id="next" hidden><button type="button" class="primary" id="done">Done</button><button type="button" class="primary" id="lock">Lock in</button></div>
<div class="cover" id="cover" role="dialog" aria-modal="true" aria-labelledby="cover-title" hidden></div>
<div class="busy" id="busy" role="status" hidden><span class="spinner"></span>Updating dates…</div>
<script>
// The settings on screen: the party's before it has a name, then the tab's.
const state = { flow: [], temperature: [], priority: null, rivers: {}, away: new Set(), awayBy: null, minimum: null };
const empty = { launches: [], odds: [], widened: {}, unavailable: [] };
let scales = {}, rivers = [], latest = 0, plan = empty;
// The party, once there is one, as the API gives it, and the tab that's open:
// "team" or an applicant's name.
const KEY = /^[a-z]+(-[a-z]+){3}$/;
const partyKey = KEY.test(location.pathname.slice(1)) ? location.pathname.slice(1) : "";
let team = null, tab = "team", loading = false;
// Who this browser is in each team, by team name, so a team's link opens on
// their own tab. Only a convenience: anyone can open any tab.
const ME = "max-float-me";
function whoAmI(key) {
  try {
    const found = JSON.parse(localStorage.getItem(ME) ?? "{}")[key];
    return typeof found === "string" ? found : null;
  } catch { return null; }
}
function iAm(key, name) {
  try {
    const found = JSON.parse(localStorage.getItem(ME) ?? "{}");
    localStorage.setItem(ME, JSON.stringify({ ...(found && typeof found === "object" ? found : {}), [key]: name }));
  } catch { /* the page works without it */ }
}
// The plans this browser has opened, latest first, so their links can be offered
// again. Only a convenience: the address is what opens a plan.
const PLANS = "max-float-plans";
function remembered() {
  try {
    const found = JSON.parse(localStorage.getItem(PLANS) ?? "[]");
    return Array.isArray(found) ? found.filter((key) => typeof key === "string" && KEY.test(key)) : [];
  } catch { return []; }
}
function remember(key) {
  try { localStorage.setItem(PLANS, JSON.stringify([key, ...remembered().filter((other) => other !== key)].slice(0, 10))); } catch { /* no storage */ }
}
function forget(key) {
  try { localStorage.setItem(PLANS, JSON.stringify(remembered().filter((other) => other !== key))); } catch { /* no storage */ }
}
const planLink = (key) => el("a", { href: `/${key}` }, `${location.host}/${key}`);
const TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const mode = () => (team ? (tab === "team" ? "team" : "applicant") : "solo");
// An applicant's tab sets their preferences and days. The Team tab sets the
// rivers, trip lengths and minimum. Before the party has a name, one tab sets all.
// Once the team's dates are locked in, nothing can be changed until it unlocks.
const isLocked = () => Boolean(team?.locked);
const prefsEditable = () => mode() !== "team" && !isLocked();
const teamEditable = () => mode() !== "applicant" && !isLocked();
// Each tab's colors: the ink of its tab's stripe and edge, and the tint of its
// sheet. Applicants take theirs in the order they joined.
const TEAM_COLORS = { ink: "#8a8a84", tint: "#e6e4dc" };
const PEOPLE_COLORS = [
  { ink: "#2a78d6", tint: "#e2ecf9" },
  { ink: "#1baf7a", tint: "#ddf3ea" },
  { ink: "#6250d6", tint: "#e8e5f9" },
  { ink: "#eb6834", tint: "#fbe9e0" },
  { ink: "#e87ba4", tint: "#fae6ee" },
  { ink: "#eda100", tint: "#faf0d5" },
];
const colorsOf = (id) => {
  if (id === "team" || !team) return TEAM_COLORS;
  const index = Object.keys(team.applicants).indexOf(id);
  return PEOPLE_COLORS[Math.max(0, index) % PEOPLE_COLORS.length];
};
// Padlocks, open for planning and closed for locked in.
const PADLOCK = {
  open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.9-.9"/></svg>',
  closed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
};
// Each river's launch dates. A day with none for a chosen river is shaded off.
const launchDates = {};
const syncs = [];
// What a priority weighs, in the order its rows show them.
const PARTS = [
  { name: "odds", label: "Better historical permit odds", color: "#1baf7a" },
  { name: "flow", label: "Better historical flow", color: "#2a78d6" },
  { name: "temperature", label: "Better historical temperatures", color: "#eb6834" },
];
const SERIES = { recommended: "#2a78d6", random: "#eb6834" };
// Each river keeps its color whichever rivers are chosen, in the order of `rivers`.
const COLORS = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#9c2f7e", "#8a8a84", "#8a5a2b"];
const JSON_HEADERS = { "content-type": "application/json" };

function el(tag, attributes = {}, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attributes)) {
    if (name === "class") node.className = value;
    else if (name in node) node[name] = value;
    else node.setAttribute(name, value);
  }
  node.append(...children);
  return node;
}

const same = (a, b) => a.every((value, step) => value === b[step]);
// Each scale's color.
const DOTS = { flow: "#2a78d6", temperature: "#eb6834" };
const percent = (odds) => `${(odds * 100).toFixed(1)}%`;
const chosen = () => rivers.filter((river) => state.rivers[river.name].on);
const partyUrl = (rest = "") => `/api/party/${partyKey}${rest}`;
const applicantUrl = (name) => partyUrl(`/applicants/${encodeURIComponent(name)}`);

// Something changed that the shown launches don't reflect yet. With a party,
// it's stored on the tab and saved, and the plan is worked out again, soon after.
let autoTimer = null;
function edited() {
  document.getElementById("out").classList.add("stale");
  store();
  sync();
  clearTimeout(autoTimer);
  if (team) autoTimer = setTimeout(replan, 800);
}

// A set of ratings: a row for each category on a scale, or for odds, flow and
// temperature, each with a button for each rating and a bar of the row's share of
// the set. Rows start blank. On a scale, No leaves out every launch typically in
// that category, so at least one row needs more. Arrow keys move along a row.
// `get` and `set` take one rating, or null, for each row. The Team tab shows the
// team's shares, from `shared`, in place of anyone's ratings. `added` gives any
// categories widening added, `bounds` each row's range, and `strips` each flow
// category's season strip, where there are any. With `keepOne`, a scale can't be
// set to all No.
function ratingSet(kind, title, names, { get, set, shared = () => null, added = () => [], bounds = () => null, strips = () => null, editable = prefsEditable, keepOne = false }) {
  const isScale = kind !== "priority";
  const labels = isScale ? scales.ratings : scales.priorityRatings;
  const grid = el("div", { class: "grid" }, el("span"), ...labels.map((label) => el("span", { class: "head" }, label)), el("span"));
  const error = el("p", { class: "error", hidden: true }, "Rate at least one above No.");
  function rate(step, value) {
    if (!editable()) return;
    const next = [...get()];
    if (next[step] === value) return;
    next[step] = value;
    if (keepOne && isScale && next.every((one) => one === 0)) return;
    set(next);
    edited();
  }
  const rows = names.map((name, step) => {
    const range = el("span", { class: "range" }), strip = el("span", { class: "strip", hidden: true });
    const buttons = labels.map((label, value) => {
      const button = el("button", { type: "button", class: `rate${value === 0 ? " no" : ""}`, role: "radio", "aria-label": `${name}: ${label}`, title: label });
      button.addEventListener("click", () => rate(step, value));
      return button;
    });
    const bar = el("span");
    const row = el("span", { class: "row", role: "radiogroup", "aria-label": name },
      el("span", { class: "name" }, name, range, strip), ...buttons, el("span", { class: "bar" }, bar));
    row.style.setProperty("--scale", isScale ? DOTS[kind] : PARTS[step].color);
    row.addEventListener("keydown", (event) => {
      const change = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[event.key];
      if (!change) return;
      event.preventDefault();
      const value = Math.max(0, Math.min(labels.length - 1, (get()[step] ?? (change > 0 ? -1 : 1)) + change));
      rate(step, value);
      buttons[value].focus();
    });
    grid.append(row);
    return { row, buttons, bar, range, strip, step };
  });
  const fieldset = el("fieldset", { class: "ratings" }, el("legend", {}, title), grid, error);
  syncs.push(() => {
    const shown = mode() === "team";
    const ratings = shown ? null : get();
    const shares = shown ? shared() : sharesOf(ratings, isScale);
    const widened = added(), ranged = bounds(), striped = strips();
    for (const { row, buttons, bar, range, strip, step } of rows) {
      const value = ratings?.[step] ?? null, share = shares?.[step] ?? 0;
      row.classList.toggle("blank", !shown && value === null);
      row.classList.toggle("no-share", shown ? share === 0 : value === 0);
      row.classList.toggle("added", widened.includes(step));
      buttons.forEach((button, rating) => {
        button.setAttribute("aria-checked", value === rating);
        button.disabled = !editable();
        button.tabIndex = rating === (value ?? 0) ? 0 : -1;
      });
      bar.style.width = `${share * 100}%`;
      bar.parentElement.title = `${Math.round(share * 100)}% of ${title.toLowerCase()}`;
      range.textContent = ranged?.[step] ?? "";
      range.hidden = !ranged;
      strip.hidden = !striped;
      if (striped) {
        const runs = striped.runs[step];
        const at = (node, left) => { node.style.left = `${left * 100}%`; return node; };
        const track = el("span", { class: "track" },
          ...runs.map((run) => { const mark = at(el("span"), run.left); mark.style.width = `${run.width * 100}%`; return mark; }),
          ...striped.months.slice(1).map((month) => at(el("i"), month.left)));
        const months = el("span", { class: "months", "aria-hidden": "true" }, ...striped.months.map((month) => at(el("span"), month.left + 0.01)).map((node, index) => { node.textContent = striped.months[index].label; return node; }));
        strip.replaceChildren(track, months);
        strip.title = runs.length ? `Typically ${names[step]}: ${runs.map((run) => run.label).join(", ")}` : `Never typically ${names[step]}`;
      }
    }
    error.hidden = shown || !isScale || ratings.some((one) => one !== 0);
  });
  return fieldset;
}

// Each row's share of a set: its rating over the set's total, with a blank row
// counting 0. A priority rated all Not shares equally; a scale rated all No has
// no shares, as it leaves out every launch.
function sharesOf(ratings, isScale) {
  const total = ratings.reduce((sum, rating) => sum + (rating ?? 0), 0);
  if (total) return ratings.map((rating) => (rating ?? 0) / total);
  const rated = ratings.every((rating) => rating !== null);
  return ratings.map(() => (!isScale && rated ? 1 / ratings.length : 0));
}

// Whether a set is rated: every row, and on a scale at least one above No.
const ratedSet = (ratings, isScale = true) => ratings.every((rating) => rating !== null) && (!isScale || ratings.some((rating) => rating > 0));
const priorityList = (priority) => PARTS.map(({ name }) => priority[name]);
const priorityOf = (list) => Object.fromEntries(PARTS.map(({ name }, index) => [name, list[index]]));
// Whether the open tab's preferences for all rivers are rated.
const ratedAll = () => ratedSet(state.flow) && ratedSet(state.temperature) && ratedSet(priorityList(state.priority), false);
// Preferences not rated yet, as a new applicant's start.
const blankPreferences = () => ({
  flow: scales.flow.map(() => null),
  temperature: scales.temperature.map(() => null),
  priority: priorityOf(PARTS.map(() => null)),
});

// A river's flow strips: when in its season it's typically in each category, and
// where each month starts, for the labels under them.
function seasonStrips(river) {
  const first = Date.parse(river.season_start), span = Date.parse(river.season_end) - first + DAY;
  const months = [];
  for (let day = new Date(first); day.getTime() <= first + span - DAY; day.setUTCMonth(day.getUTCMonth() + 1, 1)) {
    months.push({ left: Math.max(0, (day.getTime() - first) / span), label: day.toLocaleString("en-US", { month: "short", timeZone: "UTC" }) });
  }
  // A month that starts too near the end to fit its label is left unlabeled.
  return { runs: scales.flow.map((_, step) => seasonRuns(river, step)), months: months.filter((month) => month.left < 0.88) };
}

// When in its season a river is typically in one flow category: each run of its
// launch dates in that category, placed along the season from 0 to 1.
const DAY = 86400000;
function seasonRuns(river, step) {
  const first = Date.parse(river.season_start), span = Date.parse(river.season_end) - first + DAY;
  const runs = [];
  river.launches.forEach((date, index) => {
    if (river.flow_typical[index] !== step) return;
    const last = runs.at(-1);
    if (last && Date.parse(date) - Date.parse(last.to) <= DAY) last.to = date;
    else runs.push({ from: date, to: date });
  });
  return runs.map(({ from, to }) => ({
    left: (Date.parse(from) - first) / span,
    width: (Date.parse(to) - Date.parse(from) + DAY) / span,
    label: from === to ? dateName(from) : `${dateName(from)} – ${dateName(to)}`,
  }));
}

// Each category's range on a scale, from where each category after the first
// starts, with its unit after each. Temperatures are whole degrees,
// "60–69°F", and flows run to the next category's start, in thousands from
// 1,000 cfs, "1.5k–5k".
function ranges(starts, whole, unit = "") {
  const number = (value) => (value >= 1000 ? `${+(value / 1000).toFixed(1)}k` : String(value));
  const end = (index) => number(whole ? starts[index + 1] - 1 : starts[index + 1]);
  return [`< ${number(starts[0])}${unit}`, ...starts.slice(0, -1).map((start, index) => `${number(start)}–${end(index)}${unit}`), `${number(starts.at(-1))}${unit}+`];
}

const SVG = "http://www.w3.org/2000/svg";

function svg(tag, attributes = {}, ...children) {
  const node = document.createElementNS(SVG, tag);
  for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
  node.append(...children);
  return node;
}

// How many of a river's applicants must be free for a launch: one unless set higher.
function minimumControl() {
  const input = el("input", { type: "number", min: 1 });
  input.setAttribute("aria-label", "Applicants who must be free");
  const total = el("span");
  const people = () => Object.keys(team?.applicants ?? {}).length;
  input.addEventListener("change", () => {
    const count = people();
    const value = Math.min(count, Math.max(1, Number(input.value) || 1));
    input.value = value;
    state.minimum = value === 1 ? null : value;
    edited();
  });
  const line = el("p", { class: "minimum" }, "Launch only when at least ", input, " of ", total, " can go");
  syncs.push(() => {
    const count = people();
    line.hidden = mode() !== "team" || count < 2;
    input.disabled = !teamEditable();
    input.max = count;
    input.value = Math.min(state.minimum ?? 1, Math.max(count, 1));
    total.textContent = String(count);
  });
  return line;
}

// The preferences for every river, titled by whose they are, with what to do
// beside each part while it can be set.
function preferencesPanel() {
  const words = el("span"), title = el("h2", {}, el("span", { class: "step", "aria-hidden": "true" }, "2"), words);
  const sub = el("p", { class: "sub" }), splits = el("div");
  // Flow categories differ by river in cfs, so their ranges show only while one
  // river is in view, with when in its season it's typically in each.
  const one = () => (chosen().length === 1 ? chosen()[0] : null);
  const root = document.getElementById("preferences");
  root.append(
    title, sub,
    ratingSet("flow", "Flow", scales.flow, {
      get: () => state.flow, set: (next) => { state.flow = next; },
      shared: () => team?.preferences?.flow ?? null,
      bounds: () => (one() ? ranges(one().flow_starts, false) : null),
      strips: () => (one() ? seasonStrips(one()) : null),
    }),
    ratingSet("temperature", "Temperature", scales.temperature, {
      get: () => state.temperature, set: (next) => { state.temperature = next; },
      shared: () => team?.preferences?.temperature ?? null,
      bounds: () => ranges(scales.temperatureStarts, true, "°F"),
    }),
    ratingSet("priority", "Priority", PARTS.map(({ label }) => label), {
      get: () => priorityList(state.priority), set: (next) => { state.priority = priorityOf(next); },
      shared: () => (team?.preferences ? priorityList(team.preferences.priority) : null),
    }),
    splits,
    minimumControl(),
  );
  splitControls(splits);
  syncs.push(() => {
    const own = mode() !== "team";
    words.replaceChildren(...(own ? [named(tab, "'s"), " default ideal conditions"] : ["The team's default ideal conditions"]));
    // What the box is for: every river, as flow differs by river, unless only
    // one is chosen, when its flows are that river's.
    const on = chosen();
    sub.replaceChildren(...(!own
      ? ["Averaged from everyone who has rated theirs. Each river's own are below."]
      : on.length === 1
        ? [named(tab), ` has chosen only the ${on[0].name}, so these flows are its own, in cfs. With more rivers, these apply to all of them, and each river can be rated on its own below.`]
        : on.length
          ? ["These apply to all of ", named(tab, "'s"), " rivers. Flow in cfs differs by river, so each river's ranges are in its own preferences below, where it can be rated on its own."]
          : ["These apply to all of ", named(tab, "'s"), " rivers."]));
    root.classList.toggle("unrated", mode() === "applicant" && !isLocked() && !ratedAll());
    if (ratedAll()) root.classList.remove("missing");
  });
}

// A ? that opens a short definition on hover or focus, or on a tap.
function info(id, text) {
  const tip = el("span", { role: "tooltip", id }, text);
  const button = el("button", { type: "button", "aria-describedby": id, "aria-label": "What's this?" }, "?");
  const root = el("span", { class: "info" }, button, tip);
  button.addEventListener("click", () => root.classList.toggle("open"));
  button.addEventListener("blur", () => root.classList.remove("open"));
  return root;
}

// Rivers an applicant chose that share a lottery, each group in river order.
function sharedGroups() {
  const by = new Map();
  for (const river of chosen()) by.set(river.lottery, [...(by.get(river.lottery) ?? []), river]);
  return [...by.values()].filter((group) => group.length > 1);
}
// Whether every choice of a shared application is given to one of its rivers.
const placedAll = (group) => {
  const slots = group.flatMap((river) => state.rivers[river.name].slots ?? []);
  return slots.length === group[0].choices && new Set(slots).size === slots.length;
};
const splitAll = () => sharedGroups().every(placedAll);

// For rivers an applicant chose that share one application, a checkbox for each
// of its choices on each river's row: each choice goes to one river, so
// checking one clears the others in its column.
function splitControls(root) {
  let drawn = "";
  syncs.push(() => {
    const groups = mode() === "applicant" ? sharedGroups() : [];
    const now = JSON.stringify(groups.map((group) => group.map((river) => river.name)));
    if (now !== drawn) {
      drawn = now;
      root.replaceChildren(...groups.map((group) => {
        const names = group.map((river) => river.name), count = group[0].choices;
        const together = names.length === 2 ? `The ${names[0]} and the ${names[1]}` : `The ${names.slice(0, -1).join(", the ")} and the ${names.at(-1)}`;
        const grid = el("div", { class: "grid" }, el("span"), ...Array.from({ length: count }, (_, slot) => el("span", { class: "head" }, String(slot + 1))));
        grid.style.setProperty("--choices", count);
        for (const river of group) {
          const swatch = el("span", { class: "swatch" });
          swatch.style.background = colorOf(river.name);
          grid.append(el("span", { class: "name" }, swatch, river.name));
          for (let slot = 0; slot < count; slot += 1) {
            const box = el("input", { type: "checkbox", "aria-label": `${river.name}, choice ${slot + 1}` });
            box.dataset.river = river.name;
            box.dataset.slot = slot;
            box.style.setProperty("--river", colorOf(river.name));
            box.addEventListener("change", () => {
              for (const other of group) {
                const slots = new Set(state.rivers[other.name].slots ?? []);
                if (other.name === river.name && box.checked) slots.add(slot); else slots.delete(slot);
                state.rivers[other.name].slots = [...slots].sort((a, b) => a - b);
              }
              edited();
            });
            grid.append(box);
          }
        }
        return el("fieldset", { class: "split" },
          el("legend", {}, `${names.join(" and ")} share one application`,
            info(`split-${group[0].lottery}`, `${together} share one lottery application with ${count} choices. Check which river each of ${tab}'s ${count} choices is for, and max-float picks the best dates on each.`)),
          grid);
      }));
    }
    for (const box of root.querySelectorAll("input")) {
      box.checked = (state.rivers[box.dataset.river].slots ?? []).includes(Number(box.dataset.slot));
      box.disabled = !prefsEditable();
    }
    root.querySelectorAll(".split").forEach((fieldset, index) => { if (placedAll(groups[index])) fieldset.classList.remove("missing"); });
  });
}

// Done before every choice of a shared application has a river: mark it, and go
// there.
function unsplit() {
  const root = document.querySelector("#preferences .split:not(:has(input:checked))") ?? document.querySelector("#preferences .split");
  const groups = sharedGroups();
  document.querySelectorAll("#preferences .split").forEach((fieldset, index) => fieldset.classList.toggle("missing", !placedAll(groups[index])));
  (document.querySelector("#preferences .split.missing") ?? root)?.scrollIntoView({ behavior: "smooth", block: "center" });
}

function hasOwn(river) {
  return river.flow !== null || river.temperature !== null || river.priority !== null || river.days !== null;
}
// Whether the team's preferences for a river differ from its general ones.
function teamOwns(name) {
  const found = team?.preferences?.rivers?.[name];
  return Boolean(found && (found.flow || found.temperature || found.priority));
}

function riverRow(river) {
  const own = () => state.rivers[river.name];
  // A river's own ratings start from the applicant's for all rivers, so they can
  // be set once those are all rated. The Team tab shows the team's for it.
  const editable = () => prefsEditable() && ratedAll();
  const shared = () => team?.preferences?.rivers?.[river.name] ?? null;
  const days = el("input", { type: "number", min: 1, max: river.max_trip_days, value: river.max_trip_days });
  days.setAttribute("aria-label", `${river.name} trip length in days`);
  // Clicking the field mustn't open or close the river.
  days.addEventListener("click", (event) => event.preventDefault());
  const length = el("span"), trip = el("span", { class: "trip" }, days, length);
  days.addEventListener("change", () => {
    if (!teamEditable()) return;
    const value = Math.min(river.max_trip_days, Math.max(1, Number(days.value) || river.max_trip_days));
    days.value = value;
    own().days = value === river.max_trip_days ? null : value;
    settle();
    edited();
  });
  const details = el("details", { class: "river" },
    el("summary", {}, river.name, trip),
    el("div", { class: "own" },
      ratingSet("flow", "Flow (cfs)", scales.flow, {
        get: () => own().flow ?? state.flow,
        set: (next) => { own().flow = same(next, state.flow) ? null : next; settle(); },
        shared: () => shared()?.flow ?? team?.preferences?.flow ?? null,
        added: () => plan.widened[river.name]?.flow ?? [],
        bounds: () => ranges(river.flow_starts, false),
        strips: () => seasonStrips(river),
        editable, keepOne: true,
      }),
      ratingSet("temperature", "Temperature", scales.temperature, {
        get: () => own().temperature ?? state.temperature,
        set: (next) => { own().temperature = same(next, state.temperature) ? null : next; settle(); },
        shared: () => shared()?.temperature ?? team?.preferences?.temperature ?? null,
        added: () => plan.widened[river.name]?.temperature ?? [],
        bounds: () => ranges(scales.temperatureStarts, true, "°F"),
        editable, keepOne: true,
      }),
      ratingSet("priority", "Priority", PARTS.map(({ label }) => label), {
        get: () => priorityList(own().priority ?? state.priority),
        set: (next) => { own().priority = same(next, priorityList(state.priority)) ? null : priorityOf(next); settle(); },
        shared: () => { const found = shared()?.priority ?? team?.preferences?.priority; return found ? priorityList(found) : null; },
        editable,
      }),
    ));
  details.style.setProperty("--river", colorOf(river.name));
  // A river with preferences of its own, or widened, stays open. Once it's neither,
  // it closes again.
  let held = false;
  function settle() {
    const now = hasOwn(own()) || Boolean(plan.widened[river.name]) || (mode() === "team" && teamOwns(river.name));
    if (now) details.open = true;
    else if (held) details.open = false;
    held = now;
  }
  details.addEventListener("toggle", () => {
    if (!details.open && (hasOwn(own()) || plan.widened[river.name] || (mode() === "team" && teamOwns(river.name)))) details.open = true;
  });
  syncs.push(settle);
  syncs.push(() => {
    details.hidden = !own().on;
    const tripDays = own().days ?? river.max_trip_days;
    days.value = tripDays;
    days.hidden = !teamEditable();
    length.textContent = teamEditable() ? "days" : `${tripDays} days`;
  });
  return details;
}

// The rivers to apply for, at the top of the tab: a button for each, in its river's
// color once chosen. Each applicant chooses their own. The Team tab shows the
// rivers any of them chose, and can't change which.
function chooser() {
  const root = document.getElementById("choose");
  const title = document.getElementById("choose-title");
  const options = rivers.map((river) => {
    const others = el("span", { class: "others" }), mates = el("span", { class: "mates" });
    const button = el("button", { type: "button", class: "option" }, river.name, mates, others);
    const color = colorOf(river.name);
    button.style.setProperty("--river", color);
    button.style.setProperty("--river-ink", inkOn(color));
    button.addEventListener("click", () => {
      const on = !state.rivers[river.name].on;
      state.rivers[river.name].on = on;
      // Choices split between rivers sharing its lottery start again.
      for (const other of rivers) if (other.lottery === river.lottery) state.rivers[other.name].slots = null;
      edited();
    });
    return { button, river, others, mates };
  });
  document.getElementById("options").append(...options.map(({ button }) => button));
  root.addEventListener("animationend", () => root.classList.remove("shake"));
  syncs.push(() => {
    const on = chosen(), shared = mode() === "team", who = team ? tab : "you";
    const none = on.length === 0 && prefsEditable();
    title.replaceChildren(...(shared
      ? [on.length ? "Rivers the team will apply for:" : "No one has selected rivers yet. Each applicant selects their own on their tab."]
      : none ? ["Start here: select which rivers ", named(who), " will apply for"]
      : ["Select which rivers ", named(who), " will apply for:"]));
    document.getElementById("choose-need").replaceChildren(...(none
      ? ["No rivers selected yet. max-float only plans for the rivers ", named(who), " selects, so nothing can be planned until you pick at least one."] : []));
    root.classList.toggle("none", none);
    if (on.length) { root.classList.remove("wrong"); document.getElementById("choose-error").hidden = true; }
    for (const { button, river, others, mates } of options) {
      // A dot for each teammate who chose the river, and how many other teams
      // have locked in for it.
      const choosing = Object.entries(team?.applicants ?? {})
        .filter(([name, person]) => name !== tab && river.name in person.rivers).map(([name]) => name);
      mates.replaceChildren(...choosing.map((name) => {
        const dot = el("span");
        dot.style.setProperty("--mate", colorsOf(name).ink);
        return dot;
      }));
      const locked = team?.locked_parties?.[river.name] ?? 0;
      others.innerHTML = locked ? `${PADLOCK.closed}${locked}` : "";
      const said = [
        ...(choosing.length ? [`chosen by ${listOf(choosing)}`] : []),
        ...(locked ? [`${locked} other team${locked === 1 ? "" : "s"} locked in`] : []),
      ];
      button.title = said.join(", ");
      button.setAttribute("aria-label", [river.name, ...said].join(", "));
      const pressed = state.rivers[river.name].on;
      button.hidden = shared && !pressed;
      button.disabled = !prefsEditable();
      button.setAttribute("aria-pressed", pressed);
    }
    document.getElementById("rivers-panel").hidden = on.length === 0;
  });
}

// Done before every row is rated: mark the rows still blank, and go to the first.
function unrated() {
  const root = document.getElementById("preferences");
  root.classList.add("missing");
  (root.querySelector(".ratings .blank") ?? root).scrollIntoView({ behavior: "smooth", block: "center" });
  root.querySelector(".ratings .blank .rate")?.focus({ preventScroll: true });
}

// Done with no rivers chosen: say so where the rivers are chosen, and go there.
function noRivers(text = "Select at least one river to apply for.") {
  const root = document.getElementById("choose"), error = document.getElementById("choose-error");
  error.textContent = text;
  error.hidden = false;
  root.classList.add("wrong");
  root.classList.remove("shake");
  void root.offsetWidth;  // so the shake plays again
  root.classList.add("shake");
  root.scrollIntoView({ behavior: "smooth", block: "center" });
  document.querySelector("#options .option")?.focus({ preventScroll: true });
}


// On the Team tab: who is done with their rivers, preferences and dates, and who
// isn't yet. A person opens their tab.
function people() {
  const root = document.getElementById("people");
  let drawn = "";
  syncs.push(() => {
    root.hidden = mode() !== "team" || Object.keys(team.applicants).length === 0;
    if (root.hidden) { drawn = ""; return; }
    const names = Object.keys(team.applicants);
    const done = names.filter((name) => team.applicants[name].done);
    document.getElementById("people-title").textContent = `Applicants done: ${done.length} of ${names.length}`;
    // Drawn again only when something on it changes, so a question asked from
    // it stays open.
    const now = JSON.stringify([names, done, isLocked()]);
    if (now === drawn) return;
    drawn = now;
    document.getElementById("people-list").replaceChildren(...names.map((name) => {
      const finished = done.includes(name), colors = colorsOf(name);
      const state = el("span", { class: "state" });
      if (finished) state.innerHTML = `<span class="check">${CHECK}</span>`;
      state.append(finished ? "done" : "not done yet");
      const node = el("button", { type: "button", class: `person${finished ? " done" : ""}` }, el("span", { class: "dot" }), el("strong", {}, name), state);
      node.style.setProperty("--person", colors.ink);
      node.style.setProperty("--person-tint", colors.tint);
      node.addEventListener("click", () => show(name));
      const item = el("span", { class: "person-item" }, node);
      if (!isLocked()) {
        const remove = el("button", { type: "button", class: "remove", "aria-label": `Delete ${name}'s tab`, title: `Delete ${name}'s tab` }, "×");
        ask(remove, `Delete ${name}'s tab, with their settings and dates?`, "Delete", () => removeTab(name));
        item.append(remove);
      }
      return item;
    }));
  });
}

function colorOf(riverName) {
  return COLORS[rivers.findIndex((river) => river.name === riverName) % COLORS.length];
}

// Ink or white, whichever is easier to read on a color.
function inkOn(color) {
  const channel = (start) => {
    const value = parseInt(color.slice(start, start + 2), 16) / 255;
    return value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4;
  };
  const light = 0.2126 * channel(1) + 0.7152 * channel(3) + 0.0722 * channel(5);
  return (light + 0.05) ** 2 > 1.05 * 0.05 ? "#0b0b0b" : "#ffffff";
}

function chip(river) {
  const node = el("span", { class: "chip" }, river.code);
  const color = colorOf(river.name);
  node.style.background = color;
  node.style.color = inkOn(color);
  return node;
}

// The calendar of unavailable dates. An applicant's tab marks their own. The Team
// tab shows everyone's, with how many are away on a day not everyone is.
function calendar() {
  const starts = rivers.map((river) => river.season_start), ends = rivers.map((river) => river.season_end);
  const first = starts.reduce((a, b) => (a < b ? a : b)), last = ends.reduce((a, b) => (a > b ? a : b));
  const year = Number(first.slice(0, 4));
  const root = document.getElementById("calendar");
  const cells = [], months = [];
  // Marking days: a click or tap marks or clears one. With a mouse, dragging
  // across days marks or clears them all, as the first did, and a shift-click
  // marks or clears every day from the last one clicked.
  let anchor = null, marking = null, pressed = null;
  const mark = (date, away) => { away ? state.away.add(date) : state.away.delete(date); };
  const span = (from, to, away) => {
    const [a, b] = from < to ? [from, to] : [to, from];
    for (const { date } of cells) if (date >= a && date <= b) mark(date, away);
  };
  window.addEventListener("pointerup", () => {
    if (marking !== null) { marking = null; edited(); }
    setTimeout(() => { pressed = null; });  // after the click this press makes
  });
  for (let month = Number(first.slice(5, 7)); month <= Number(last.slice(5, 7)); month += 1) {
    const grid = el("div", { class: "grid" });
    for (const name of ["M", "T", "W", "T", "F", "S", "S"]) grid.append(el("div", { class: "weekday" }, name));
    const pad = (new Date(Date.UTC(year, month - 1, 1)).getUTCDay() + 6) % 7;
    for (let i = 0; i < pad; i += 1) grid.append(el("div"));
    const count = new Date(Date.UTC(year, month, 0)).getUTCDate();
    const dateOf = (day) => `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    for (let day = 1; day <= count; day += 1) {
      const date = dateOf(day);
      const button = el("button", { type: "button", class: "day" }, String(day));
      button.addEventListener("pointerdown", (event) => {
        if (!prefsEditable() || event.pointerType !== "mouse" || event.button !== 0) return;
        event.preventDefault();
        pressed = date;
        if (event.shiftKey && anchor) span(anchor.date, date, anchor.away);
        else {
          marking = !state.away.has(date);
          mark(date, marking);
          anchor = { date, away: marking };
        }
        if (event.shiftKey) edited(); else sync();
      });
      button.addEventListener("pointerenter", () => {
        if (marking === null) { showDay(date); return; }
        mark(date, marking);
        sync();
      });
      button.addEventListener("focus", () => showDay(date));
      button.addEventListener("click", (event) => {
        if (pressed === date) return;  // the press already marked it
        showDay(date);
        if (!prefsEditable()) return;  // the Team tab, or locked in
        if (event.shiftKey && anchor) span(anchor.date, date, anchor.away);
        else {
          const away = !state.away.has(date);
          mark(date, away);
          anchor = { date, away };
        }
        edited();
      });
      cells.push({ button, date, day });
      grid.append(button);
    }
    const title = new Date(Date.UTC(year, month - 1, 1)).toLocaleString("en-US", { month: "long", year: "numeric", timeZone: "UTC" });
    const node = el("div", { class: "month" }, el("h3", {}, title), grid);
    months.push({ node, from: dateOf(1), to: dateOf(count) });
    root.append(node);
  }
  syncs.push(() => {
    const byDate = {};
    for (const launch of together(plan.launches)) (byDate[launch.date] ??= []).push(launch);
    const on = chosen();
    // Only the months in the chosen rivers' seasons, or every month before any
    // river is chosen.
    const from = on.length ? on.map((river) => river.season_start).sort()[0] : first;
    const to = on.length ? on.map((river) => river.season_end).sort().at(-1) : last;
    for (const month of months) month.node.hidden = month.to < from || month.from > to;
    const people = mode() === "team" ? Object.keys(team.applicants).length : 1;
    for (const { button, date, day } of cells) {
      const names = state.awayBy?.[date] ?? [];
      const away = state.away.has(date);
      const everyone = away && (mode() !== "team" || names.length === people);
      const found = (byDate[date] ?? []).sort((a, b) => b.party_odds - a.party_odds);
      button.className = "day";
      if (everyone) button.classList.add("away");
      else if (away) button.classList.add("some");
      else if (!on.some((river) => launchDates[river.name].has(date))) button.classList.add("off");
      button.replaceChildren(String(day));
      if (away && mode() === "team") button.append(el("span", { class: "count" }, `${names.length}/${people}`));
      if (!everyone) {
        for (const launch of found) {
          const node = chip({ name: launch.river, code: launch.code });
          node.insertAdjacentHTML("afterbegin", isLocked() ? PADLOCK.closed : PADLOCK.open);
          if (launch.locked_parties) node.append(el("span", { class: "others" }, String(launch.locked_parties)));
          // A tap on a launch tells about it without marking the day.
          node.addEventListener("click", (event) => { event.stopPropagation(); showDay(date); });
          button.append(node);
        }
      }
      button.setAttribute("aria-pressed", away);
      const who = names.length ? [`away: ${names.join(", ")}`] : [];
      button.setAttribute("aria-label", [date, away ? "unavailable" : null, ...who, ...aboutDay(date)].filter(Boolean).join(", "));
    }
    if (shownDay) showDay(shownDay);
  });
}

// What the plan has on a day: for each launch, its river, each applicant's choice
// for it, its odds, its typical conditions, and how many other teams locked in.
function aboutDay(date) {
  const rows = plan.launches.filter((launch) => launch.date === date);
  return [...new Set(rows.map((launch) => launch.river))].map((river) => {
    const mine = rows.filter((launch) => launch.river === river), one = mine[0];
    const choices = [...new Set(mine.map((launch) => launch.choice))];
    const choice = mode() === "team" && mine.length > 1
      ? (choices.length === 1 ? `choice ${choices[0]} for ${listOf(mine.map((launch) => launch.applicant))}` : mine.map((launch) => `${launch.applicant}'s choice ${launch.choice}`).join(", "))
      : `choice ${one.choice}`;
    const others = one.locked_parties ? `, ${one.locked_parties} other team${one.locked_parties === 1 ? "" : "s"} locked in` : "";
    return `${river}: ${choice}, ${percent(shownOdds(one))} odds, typically ${one.flow_typical} flow and ${one.temperature_typical}${others}`;
  });
}

// The day last pointed at, focused or tapped, told about under the calendar.
let shownDay = null;
function showDay(date) {
  shownDay = date;
  const root = document.getElementById("day-info");
  const lines = aboutDay(date);
  root.replaceChildren(...(lines.length ? [el("strong", {}, new Date(`${date}T00:00:00Z`).toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" })), lines.join("; ")] : []));
}

function key() {
  const root = document.getElementById("key");
  const shade = (kind, label) => {
    const text = el("span");
    const node = el("span", { class: "shade" }, el("span", { class: `day ${kind}`, "aria-hidden": "true" }), text);
    text.textContent = label;
    return { node, text };
  };
  const season = shade("", "In season"), off = shade("off", "Out of season"), some = shade("some", "Some away"), away = shade("away", "Away");
  const items = rivers.map((river) => ({ river, node: el("span", { class: "river" }, chip(river), river.name) }));
  const label = el("strong", { class: "draft" });
  root.append(season.node, off.node, some.node, away.node, label, ...items.map(({ node }) => node));
  syncs.push(() => {
    away.text.textContent = mode() === "team" ? "Everyone away" : "Away";
    some.node.hidden = mode() !== "team";
    label.innerHTML = isLocked() ? PADLOCK.closed : PADLOCK.open;
    label.append(isLocked() ? "Recommended" : "Draft launch dates");
    const shown = new Set(plan.launches.map((launch) => launch.river));
    for (const { river, node } of items) node.hidden = !shown.has(river.name);
    label.hidden = shown.size === 0;
  });
}

const dateName = (date) => new Date(`${date}T00:00:00Z`).toLocaleString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });

// The plan's launches, once each, with everyone applying for each.
function together(launches) {
  const found = new Map();
  for (const launch of launches) {
    const id = `${launch.river} ${launch.date}`;
    if (!found.has(id)) found.set(id, { ...launch, applicants: [] });
    if (launch.applicant) found.get(id).applicants.push(launch.applicant);
  }
  return [...found.values()];
}

// The Team tab shows the party's odds of winning a launch, and an applicant's
// tab the odds of their own application for it.
const shownOdds = (launch) => (mode() === "team" ? launch.party_odds : launch.odds);

// A launch's past years, like a forecast: a column for each year with the trip's
// lowest low to its mean high on one scale, its mean flow on another, and the categories those were.
const shown = new Set();
const cfs = (value) => (value >= 10000 ? `${(value / 1000).toFixed(0)}k` : value >= 1000 ? `${(value / 1000).toFixed(1)}k` : String(Math.round(value)));
// Odds as the page shows them in a launch's past years, to a tenth of a percent
// under 10%.
const shortPercent = (odds) => `${odds * 100 >= 10 ? Math.round(odds * 100) : (odds * 100).toFixed(1)}%`;
const SHADES = { high: "#d6453d", low: "#2a78d6", between: "#c9c7bf", odds: "#1baf7a", common: "#8a8a84" };

function years(history) {
  const highs = history.map((year) => year.high_f).filter((value) => value !== null);
  const lows = history.map((year) => year.low_f ?? year.high_f).filter((value) => value !== null);
  const top = Math.max(...highs, ...lows), bottom = Math.min(...highs, ...lows);
  const most = Math.max(...history.map((year) => year.flow_cfs ?? 0));
  const best = Math.max(...history.flatMap((year) => [year.odds ?? 0, year.common_odds ?? 0]));
  // Each track keeps a line of text above and below its marks.
  const place = (value, height) => 16 + (1 - (value - bottom) / Math.max(top - bottom, 1)) * (height - 40);
  const none = () => el("span", { class: "value none" }, "—");
  const dot = (color, at) => { const node = el("span", { class: "dot" }); node.style.cssText = `top: ${at}px; background: ${color};`; return node; };
  const key = (color, label) => { const swatch = el("span", { class: "swatch" }); swatch.style.background = color; return el("span", { class: "key-item" }, swatch, label); };
  const captions = el("div", { class: "year captions" }, el("strong"),
    el("div", { class: "track" }, "High and low (°F)"), el("span", { class: "category" }),
    el("div", { class: "track flow" }, "Flow (cfs)"), el("span", { class: "category" }),
    el("div", { class: "track odds" }, "Odds"), el("span", { class: "category odds-key" }, key(SHADES.odds, "This date"), key(SHADES.common, "Most common date")));
  return el("div", { class: "years" }, captions, ...history.map((year) => {
    const temperature = el("div", { class: "track" });
    if (year.high_f === null) temperature.append(none());
    else {
      // The mean high as a red dot, the lowest low as a blue one, gray between.
      const high = place(year.high_f, 92), low = place(year.low_f ?? year.high_f, 92);
      const bar = el("span", { class: "bar" });
      bar.style.cssText = `top: ${high + 5}px; height: ${Math.max(low - high, 0)}px; background: ${SHADES.between};`;
      const above = el("span", { class: "value" }, `${Math.round(year.high_f)}°`);
      above.style.top = `${high - 15}px`;
      temperature.append(above, bar, dot(SHADES.high, high));
      if (year.low_f !== null) {
        const below = el("span", { class: "value" }, `${Math.round(year.low_f)}°`);
        below.style.top = `${low + 12}px`;
        temperature.append(dot(SHADES.low, low), below);
      }
    }
    // The launch's odds that year, and the odds on the river's most applied-for
    // launch, on one scale.
    const odds = el("div", { class: "track odds" });
    const level = (value) => 18 + (1 - value / (best || 1)) * 46;
    if (year.odds === null && year.common_odds === null) odds.append(none());
    else {
      if (year.common_odds !== null) odds.append(dot(SHADES.common, level(year.common_odds)));
      if (year.odds !== null) {
        const above = el("span", { class: "value" }, shortPercent(year.odds));
        above.style.top = `${level(year.odds) - 15}px`;
        odds.append(above, dot(SHADES.odds, level(year.odds)));
      }
    }
    const times = year.odds !== null && year.common_odds ? year.odds / year.common_odds : null;
    const flow = el("div", { class: "track flow" });
    if (year.flow_cfs === null) flow.append(none());
    else {
      const height = most ? (year.flow_cfs / most) * 58 : 0;
      const bar = el("span", { class: "bar" });
      bar.style.cssText = `height: ${height}px; background: ${DOTS.flow};`;
      const above = el("span", { class: "value" }, cfs(year.flow_cfs));
      above.style.bottom = `${Math.max(height, 2) + 2}px`;
      flow.append(above, bar);
    }
    const column = el("div", { class: "year" }, el("strong", {}, String(year.year)),
      temperature, el("span", { class: "category" }, year.temperature ?? ""),
      flow, el("span", { class: "category" }, year.flow ?? ""),
      odds, el("span", { class: "category" }, times === null ? "" : `${times >= 10 ? Math.round(times) : times.toFixed(1)}×`));
    const oddsSaid = year.odds === null ? "no odds" : `odds ${shortPercent(year.odds)}${year.common_odds === null ? "" : `, most common date ${shortPercent(year.common_odds)}`}`;
    column.setAttribute("aria-label", `${year.year}: ${year.high_f === null ? "no temperature" : `high ${Math.round(year.high_f)}°F${year.low_f === null ? "" : `, low ${Math.round(year.low_f)}°F`}, ${year.temperature}`}; ${year.flow_cfs === null ? "no flow" : `${Math.round(year.flow_cfs)} cfs, ${year.flow}`}; ${oddsSaid}`);
    column.title = year.common_odds === null ? "" : `${year.year}: this date ${year.odds === null ? "—" : shortPercent(year.odds)}, most common date ${shortPercent(year.common_odds)}`;
    return column;
  }));
}

// Once locked in: each applicant's applications, a lottery at a time, in the
// order they're entered, as the lottery asks for them. An applicant's tab has
// their own, and the Team tab everyone's. A row opens its launch's past years.
const byChoice = (a, b) => a.choice - b.choice || a.date.localeCompare(b.date);
function lotteries(launches) {
  const found = new Map();
  for (const launch of launches) {
    if (!found.has(launch.lottery)) found.set(launch.lottery, []);
    found.get(launch.lottery).push(launch);
  }
  return [...found.values()].map((group) => group.sort(byChoice));
}
const riversOf = (group) => [...new Set(group.map((launch) => launch.river))];
function applicantsOf(launches) {
  const found = new Map();
  for (const launch of launches) {
    if (!found.has(launch.applicant)) found.set(launch.applicant, []);
    found.get(launch.applicant).push(launch);
  }
  return found;
}

// A locked-in date, with a closed padlock.
function dateCell(launch) {
  const cell = el("td", { class: "date" });
  cell.innerHTML = PADLOCK.closed;
  cell.append(`${launch.weekday.slice(0, 3)} ${dateName(launch.date)}`);
  return cell;
}

// A table of applications, a row each, that opens a launch's past years. On the
// Team tab each row names its applicant, and `apart` says who on the river isn't
// applying for a row's launch, which marks where plans diverge.
function lotteryTable(group, withApplicant = false, apart = () => []) {
  const names = riversOf(group), several = names.length > 1;
  const widened = group.some((launch) => launch.widened);
  const rows = group.flatMap((launch) => {
    const id = `${launch.applicant} ${launch.river} ${launch.date}`;
    const columns = (several ? 6 : 5) + (withApplicant ? 1 : 0);
    const missing = apart(launch);
    const past = el("tr", { class: "past", hidden: !shown.has(id) }, el("td", { colSpan: columns }, years(launch.history)));
    const row = el("tr", { class: `launch${missing.length ? " apart" : ""}`, tabIndex: 0, role: "button", "aria-expanded": shown.has(id) },
      ...(withApplicant ? [el("td", { class: "applicant" }, named(launch.applicant))] : []),
      el("td", { class: "choice" }, String(launch.choice)),
      dateCell(launch),
      ...(several ? [el("td", {}, launch.river)] : []),
      el("td", { class: "number" }, percent(launch.odds)),
      el("td", {}, launch.flow_typical),
      el("td", {}, launch.temperature_typical));
    row.style.setProperty("--river", colorOf(launch.river));
    if (missing.length) row.title = `${listOf(missing)} ${missing.length === 1 ? "isn't" : "aren't"} applying for this date`;
    const toggle = () => {
      shown.has(id) ? shown.delete(id) : shown.add(id);
      past.hidden = !shown.has(id);
      row.setAttribute("aria-expanded", shown.has(id));
    };
    row.addEventListener("click", toggle);
    row.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); toggle(); } });
    return [row, past];
  });
  const swatches = names.map((name) => {
    const swatch = el("span", { class: "swatch" });
    swatch.style.background = colorOf(name);
    return swatch;
  });
  return el("div", { class: `river-launches${widened ? " widened" : ""}` },
    el("h3", {}, ...swatches, `${names.join(" and ")}${widened ? " (widened)" : ""}`),
    el("table", {},
      el("thead", {}, el("tr", {}, ...(withApplicant ? [el("th", {}, "Applicant")] : []), el("th", {}, "Choice"), el("th", {}, "Date"), ...(several ? [el("th", {}, "River")] : []),
        el("th", { class: "number" }, "Odds"), el("th", {}, "Typical flow"), el("th", {}, "Typical temperature"))),
      el("tbody", {}, ...rows)));
}

function results() {
  const teamTab = mode() === "team";
  document.getElementById("listed-title").replaceChildren(...(teamTab ? ["Team optimized applications"] : [named(tab, "'s"), " applications"]));
  if (!teamTab) {
    document.getElementById("results").replaceChildren(...lotteries(plan.launches).map((group) => lotteryTable(group)));
  } else {
    // A row for each application, by river, then applicant in the team's order,
    // then choice, so a date someone on the river isn't applying for stands out.
    const order = Object.keys(team.applicants);
    const byRiver = new Map();
    for (const launch of plan.launches) byRiver.set(launch.river, [...(byRiver.get(launch.river) ?? []), launch]);
    document.getElementById("results").replaceChildren(...[...byRiver].map(([river, launches]) => {
      const sorted = [...launches].sort((a, b) => order.indexOf(a.applicant) - order.indexOf(b.applicant) || byChoice(a, b));
      const everyone = [...new Set(sorted.map((launch) => launch.applicant))];
      const apart = (launch) => {
        const on = new Set(sorted.filter((one) => one.date === launch.date).map((one) => one.applicant));
        return everyone.filter((name) => !on.has(name));
      };
      return lotteryTable(sorted, true, apart);
    }));
  }
  document.getElementById("download").disabled = plan.launches.length === 0;
  document.getElementById("copy-list").disabled = plan.launches.length === 0;
}

// The applications as text, to paste wherever they'll be entered.
function listed() {
  const fullDate = (date) => new Date(`${date}T00:00:00Z`).toLocaleString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric", timeZone: "UTC" });
  const people = [...applicantsOf(plan.launches)];
  const blocks = people.map(([name, launches]) => [
    ...(mode() === "team" && people.length > 1 ? [name] : []),
    ...lotteries(launches).flatMap((group) => [riversOf(group).join(" and "),
      ...group.map((launch) => `${launch.choice}. ${fullDate(launch.date)}${riversOf(group).length > 1 ? `, ${launch.river}` : ""}`)]),
  ].join("\n"));
  return `${blocks.join("\n\n")}\n`;
}

async function copyList() {
  const button = document.getElementById("copy-list");
  try {
    await navigator.clipboard.writeText(listed());
    button.textContent = "Copied";
  } catch {
    button.textContent = "Couldn't copy";
  }
  setTimeout(() => { button.textContent = "Copy"; }, 1600);
}

// While the dates are a draft: each launch, by date. Pointing at one previews its
// past years, and choosing one shows them in full below. The first choice with
// the best odds shows to start with.
let sampled = null;
function sample() {
  const root = document.getElementById("sample");
  const launches = together(plan.launches).sort((a, b) => a.date.localeCompare(b.date) || a.river.localeCompare(b.river));
  root.hidden = launches.length === 0 || isLocked() || !team;
  if (root.hidden) return;
  const id = (launch) => `${launch.river} ${launch.date}`;
  const first = plan.launches.filter((launch) => launch.choice === 1).sort((a, b) => b.odds - a.odds)[0] ?? launches[0];
  const shown = launches.find((launch) => id(launch) === sampled) ?? launches.find((launch) => id(launch) === id(first));
  sampled = id(shown);
  document.getElementById("sample-title").textContent = `${shown.weekday} ${dateName(shown.date)} on the ${shown.river}`;
  document.getElementById("sample-years").replaceChildren(years(shown.history));
  const preview = document.getElementById("preview");
  preview.hidden = true;
  document.getElementById("drafts").replaceChildren(...launches.map((launch) => {
    const button = el("button", { type: "button", "aria-pressed": id(launch) === sampled });
    button.innerHTML = PADLOCK.open;
    button.append(`${launch.code} ${dateName(launch.date)}`);
    button.style.setProperty("--river", colorOf(launch.river));
    button.setAttribute("aria-label", `${launch.weekday} ${dateName(launch.date)} on the ${launch.river}`);
    button.addEventListener("click", () => { sampled = id(launch); sample(); });
    button.addEventListener("pointerenter", (event) => {
      if (event.pointerType !== "mouse" || id(launch) === sampled) return;
      preview.replaceChildren(el("strong", { class: "title" }, `${launch.weekday} ${dateName(launch.date)} on the ${launch.river}`), years(launch.history));
      preview.hidden = false;
      preview.style.left = "8px";
      preview.style.top = `${button.offsetTop + button.offsetHeight + 6}px`;
    });
    button.addEventListener("pointerleave", () => { preview.hidden = true; });
    return button;
  }));
}

// The odds of at least one permit with the plan, against the most common dates.
function headline() {
  const total = plan.odds.find((row) => row.river === null);
  const root = document.getElementById("headline");
  root.hidden = !total;
  if (total) root.replaceChildren(el("strong", {}, percent(total.recommended)), `against ${percent(total.common)} with the most common dates`,
    el("span", { class: "overlap" }, `${total.in_common} of these ${total.launches} launches ${total.in_common === 1 ? "is" : "are"} among them`));
}

const COLUMNS = ["river", "code", "date", "weekday", "applicant", "choice", "odds", "party_odds", "flow_typical", "temperature_typical", "widened"];

function download() {
  const cell = (value) => (/[",\n]/.test(String(value)) ? `"${String(value).replaceAll('"', '""')}"` : String(value));
  const lines = [COLUMNS.join(","), ...plan.launches.map((launch) => COLUMNS.map((column) => cell(launch[column])).join(","))];
  const link = el("a", { href: URL.createObjectURL(new Blob([`${lines.join("\n")}\n`], { type: "text/csv" })), download: "max-float-applications.csv" });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href));
}

const times = (ratio) => `${ratio >= 10 ? ratio.toFixed(0) : ratio.toFixed(1)}×`;

// The odds with the recommended launches and with launches at random, each as a
// multiple of the odds with the most common launches, for all rivers then each.
function oddsChart() {
  const root = document.getElementById("odds");
  const rows = plan.odds.filter((row) => row.common > 0).map((row) => ({
    ...row,
    name: row.river ?? "All rivers",
    lift: { recommended: row.recommended / row.common, random: row.random / row.common },
  }));
  if (rows.length === 0) { root.replaceChildren(); return; }
  const width = Math.max(root.clientWidth, 300);
  const labels = Math.min(190, width * 0.38), right = 44, top = 26, rowHeight = 30, axis = 44;
  const ratios = rows.flatMap((row) => [row.lift.recommended, row.lift.random]).filter((ratio) => ratio > 0);
  const low = Math.min(-1, Math.floor(Math.log2(Math.min(...ratios)))), high = Math.max(1, Math.ceil(Math.log2(Math.max(...ratios))));
  const step = (width - labels - right) / (high - low) < 36 ? 2 : 1;
  const x = (ratio) => labels + ((Math.log2(Math.max(ratio, 2 ** low)) - low) / (high - low)) * (width - labels - right);
  const height = top + rows.length * rowHeight + axis;
  const chart = svg("svg", { viewBox: `0 0 ${width} ${height}`, height, role: "img",
    "aria-label": rows.map((row) => `${row.name}: recommended ${times(row.lift.recommended)}, random ${times(row.lift.random)} the most common dates`).join("; ") });
  for (let power = low; power <= high; power += 1) {
    if (power % step !== 0) continue;
    const at = x(2 ** power);
    chart.append(
      svg("line", { x1: at, x2: at, y1: top, y2: height - axis + 4, stroke: "#e6e5df" }),
      svg("text", { x: at, y: height - axis + 20, "text-anchor": "middle", class: "tick" }, power >= 0 ? `${2 ** power}×` : `1/${2 ** -power}×`),
    );
  }
  chart.append(svg("text", { x: (labels + width - right) / 2, y: height - 6, "text-anchor": "middle", class: "tick" }, "× the odds with the most common dates"));
  const tip = el("div", { class: "tip", hidden: true });
  rows.forEach((row, index) => {
    const y = top + index * rowHeight + rowHeight / 2;
    const rowNode = svg("g", { class: "row" },
      svg("rect", { class: "band", x: 0, y: y - rowHeight / 2, width, height: rowHeight, fill: "transparent", rx: 4 }),
      svg("text", { x: 8, y: y + 4, class: row.river === null ? "total" : "" }, row.name),
      svg("line", { x1: x(Math.min(row.lift.random, row.lift.recommended)), x2: x(Math.max(row.lift.random, row.lift.recommended)), y1: y, y2: y, stroke: "#a9a8a2", "stroke-width": 2 }),
      svg("circle", { cx: x(row.lift.random), cy: y, r: 6, fill: SERIES.random, stroke: "var(--surface)", "stroke-width": 2 }),
      svg("circle", { cx: x(row.lift.recommended), cy: y, r: 6, fill: SERIES.recommended, stroke: "var(--surface)", "stroke-width": 2 }));
    if (row.river === null) {
      rowNode.append(svg("text", { x: x(row.lift.recommended) + 11, y: y + 4, class: "total" }, times(row.lift.recommended)));
      if (rows.length > 1) chart.append(svg("line", { x1: 0, x2: width, y1: y + rowHeight / 2, y2: y + rowHeight / 2, stroke: "var(--line)" }));
    }
    rowNode.addEventListener("pointermove", (event) => {
      const line = (name, value, color, ratio) => {
        const swatch = el("span", { class: "dot" });
        if (color) swatch.style.background = color;
        return el("div", { class: "legend" }, el("span", {}, color ? swatch : "", name), el("span", { class: "value" }, `${percent(value)}${ratio ? ` · ${times(ratio)}` : ""}`));
      };
      tip.replaceChildren(el("strong", {}, row.name),
        line("Recommended", row.recommended, SERIES.recommended, row.lift.recommended),
        line("Random", row.random, SERIES.random, row.lift.random),
        line("Most common", row.common));
      tip.hidden = false;
      const box = root.getBoundingClientRect();
      const left = Math.min(event.clientX - box.left + 14, box.width - tip.offsetWidth);
      tip.style.left = `${Math.max(0, left)}px`;
      tip.style.top = `${event.clientY - box.top + 14}px`;
    });
    rowNode.addEventListener("pointerleave", () => { tip.hidden = true; });
    chart.append(rowNode);
  });
  const baseline = x(1);
  chart.append(
    svg("line", { x1: baseline, x2: baseline, y1: top - 6, y2: height - axis + 4, stroke: "var(--ink)", "stroke-width": 2 }),
    svg("text", { x: baseline, y: top - 12, "text-anchor": "middle" }, "Most common dates"),
  );
  const legend = (name, color) => {
    const dot = el("span", { class: "dot" });
    dot.style.background = color;
    return el("span", {}, dot, name);
  };
  root.replaceChildren(el("div", { class: "legend" }, legend("Recommended", SERIES.recommended), legend("Random", SERIES.random)), chart, tip);
}

function limitLines() {

// A team name from what was typed or pasted: the words, however they're joined,
// or the end of a link. Null if it isn't one.
function teamName(text) {
  const last = text.trim().toLowerCase().split(/[#?]/)[0].split("/").filter(Boolean).pop() ?? "";
  const name = last.replace(/[\s_,]+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "");
  return KEY.test(name) ? name : null;
}

// The first team this browser opened that still exists, with its applicants'
// names, or null.
async function suggestion() {
  for (const key of remembered()) {
    const response = await fetch(`/api/party/${key}`).catch(() => null);
    if (response?.ok) return { key, names: Object.keys((await response.json()).applicants) };
    if (response?.status === 404) forget(key);
    else return null;
  }
  return null;
}
