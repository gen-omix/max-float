<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>max-float</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --surface: #fcfcfb; --page: #f4f3ef; --ink: #0b0b0b; --muted: #52514e;
    --line: #d9d8d1; --accent: #1c5cab; --accent-soft: #cde2fb; --critical: #b3261e;
    --away: #52514e;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  fieldset { border: 0; margin: 0 0 14px; padding: 0; min-width: 0; }
  legend { font-weight: 600; padding: 0; margin-bottom: 4px; }
  .layout {
    display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px;
    padding: 16px; max-width: 1500px; margin: auto;
  }
  @media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px; margin-bottom: 16px;
  }
  .checks { display: flex; flex-wrap: wrap; gap: 2px 12px; }
  .checks label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .checks label.added { color: var(--critical); font-weight: 600; }
  .slider { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
  .slider input { width: 100%; accent-color: var(--accent); }
  .value { font-variant-numeric: tabular-nums; }
  details.river { border-top: 1px solid var(--line); padding: 5px 0; }
  details.river > summary { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  details.river > summary::after { content: "\25B8"; margin-left: auto; color: var(--muted); }
  details.river[open] > summary::after { content: "\25BE"; }
  details.river .own { padding: 8px 0 4px 2px; }
  .days input { width: 56px; font: inherit; }
  #banner { background: var(--critical); color: #fff; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-weight: 600; }
  #banner p { margin: 0; }
  #banner p + p { margin-top: 4px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
  .toolbar .fill { flex: 1; }
  .picker { position: relative; }
  .picker summary {
    list-style: none; cursor: pointer; border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 12px; min-width: 220px; display: flex; justify-content: space-between; gap: 12px;
    background: #fff;
  }
  .picker summary::-webkit-details-marker { display: none; }
  .picker summary::after { content: "\25BE"; color: var(--muted); }
  .picker .menu {
    position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; min-width: 280px;
    background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px;
    box-shadow: 0 4px 14px rgba(11, 11, 11, 0.14);
  }
  .picker label { display: flex; align-items: center; gap: 7px; padding: 4px 0; cursor: pointer; }
  .picker label.all { border-bottom: 1px solid var(--line); padding-bottom: 7px; margin-bottom: 3px; font-weight: 600; }
  #submit {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 9px 26px;
    font: inherit; font-weight: 700; cursor: pointer;
  }
  #submit:hover:not(:disabled) { background: #184f95; }
  #submit:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #submit:disabled { background: #a9a8a2; cursor: not-allowed; }
  .months { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 18px; }
  .month h3 { font-size: 14px; margin: 0 0 4px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .weekday { text-align: center; font-size: 11px; color: var(--muted); }
  .day {
    min-height: 34px; border: 0; border-radius: 4px; background: #eceae4; color: var(--ink);
    font: inherit; font-size: 12px; line-height: 1; padding: 3px 1px; cursor: pointer;
    display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 2px;
  }
  .day:hover { outline: 2px solid var(--ink); }
  .day:focus-visible { outline: 2px solid var(--ink); }
  .day.off { background: transparent; color: #8b8a84; }
  .day.away { background: var(--away); color: #fff; text-decoration: line-through; }
  .chip {
    display: block; border-radius: 3px; padding: 2px 0; font-size: 9px; font-weight: 700;
    letter-spacing: 0.02em; text-align: center; text-decoration: none;
  }
  .key { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 14px; font-size: 13px; }
  .key span.river { display: inline-flex; align-items: center; gap: 6px; }
  .key .chip { width: 30px; }
  #launches.stale { opacity: 0.5; }
  .river-launches { border-top: 1px solid var(--line); padding: 8px 0; overflow-x: auto; }
  .river-launches > summary { cursor: pointer; font-weight: 600; }
  .river-launches.widened > summary { color: var(--critical); }
  .river-launches .count { font-weight: 400; color: var(--muted); margin-left: 6px; }
  table { border-collapse: collapse; width: 100%; margin-top: 6px; }
  th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; }
  th, td { padding: 5px 12px 5px 0; border-bottom: 1px solid var(--line); }
  td.number, th.number { text-align: right; font-variant-numeric: tabular-nums; }
  tr.recommended td { font-weight: 700; }
  tr.recommended td:first-child { box-shadow: inset 4px 0 0 var(--river); padding-left: 10px; }
  td:first-child, th:first-child { padding-left: 10px; }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="panel">
      <h1>max-float</h1>
    </div>
    <div class="panel" id="preferences"></div>
    <div class="panel"><h2>Rivers</h2><div id="rivers"></div></div>
  </aside>
  <main>
    <div id="banner" role="alert" hidden></div>
    <section class="panel">
      <h2>Unavailable dates</h2>
      <div class="toolbar">
        <details class="picker" id="picker"></details>
        <div class="fill"></div>
        <button type="button" id="submit">Submit</button>
      </div>
      <div class="months" id="calendar"></div>
      <div class="key" id="key" hidden></div>
    </section>
    <section class="panel" id="launches" hidden>
      <h2>Launches</h2>
      <div id="results"></div>
    </section>
  </main>
</div>
<script>
const state = { flow: new Set(), temperature: new Set(), priority: 5, rivers: {}, away: new Set() };
const empty = { launches: [], widened: {}, unavailable: [] };
let scales = {}, rivers = [], latest = 0, plan = empty;
const syncs = [];
// Each river keeps its color whichever rivers are chosen, in the order of `rivers`.
const COLORS = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#9c2f7e", "#8a8a84", "#8a5a2b"];

function el(tag, attributes = {}, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attributes)) {
    if (name === "class") node.className = value;
    else if (name in node) node[name] = value;
    else node.setAttribute(name, value);
  }
  node.append(...children);
  return node;
}

const same = (a, b) => a.size === b.size && [...a].every((step) => b.has(step));
const percent = (odds) => `${(odds * 100).toFixed(1)}%`;
const chosen = () => rivers.filter((river) => state.rivers[river.name].on);

// Something changed that the shown launches don't reflect until Submit.
function edited() {
  sync();
  document.getElementById("launches").classList.add("stale");
}

// A row of checkboxes for one scale. `get` gives the checked steps, `set` stores
// new ones, and `added` gives any steps widening added.
function scale(title, names, get, set, added = () => []) {
  const boxes = names.map((name, step) => {
    const box = el("input", { type: "checkbox" });
    const label = el("label", {}, box, name);
    box.addEventListener("change", () => {
      const next = new Set(get());
      box.checked ? next.add(step) : next.delete(step);
      if (next.size === 0) { box.checked = true; return; }
      set(next);
      edited();
    });
    return { box, label, step };
  });
  syncs.push(() => {
    const checked = get(), widened = added();
    for (const { box, label, step } of boxes) {
      box.checked = checked.has(step);
      label.classList.toggle("added", widened.includes(step));
    }
  });
  return el("fieldset", {}, el("legend", {}, title), el("div", { class: "checks" }, ...boxes.map(({ label }) => label)));
}

function slider(get, set) {
  const input = el("input", { type: "range", min: 0, max: 10, step: 1 });
  input.setAttribute("aria-label", "priority");
  const value = el("span", { class: "value" });
  input.addEventListener("input", () => { set(Number(input.value)); edited(); });
  syncs.push(() => { input.value = get(); value.textContent = get(); });
  return el("fieldset", {}, el("legend", {}, "Priority ", value),
    el("div", { class: "slider" }, el("span", {}, "odds"), input, el("span", {}, "conditions")));
}

function preferencesPanel() {
  document.getElementById("preferences").append(
    scale("Flow", scales.flow, () => state.flow, (next) => { state.flow = next; }),
    scale("Temperature", scales.temperature, () => state.temperature, (next) => { state.temperature = next; }),
    slider(() => state.priority, (next) => { state.priority = next; }),
  );
}

function hasOwn(river) {
  return river.flow !== null || river.temperature !== null || river.priority !== null || river.days !== null;
}

function riverRow(river) {
  const own = state.rivers[river.name];
  const days = el("input", { type: "number", min: 1, max: river.max_trip_days, value: river.max_trip_days });
  days.addEventListener("change", () => {
    const value = Math.min(river.max_trip_days, Math.max(1, Number(days.value) || river.max_trip_days));
    days.value = value;
    own.days = value === river.max_trip_days ? null : value;
    settle();
    edited();
  });
  const details = el("details", { class: "river" },
    el("summary", {}, river.name),
    el("div", { class: "own" },
      el("fieldset", { class: "days" }, el("legend", {}, "Days"), days),
      scale("Flow", scales.flow, () => own.flow ?? state.flow, (next) => {
        own.flow = same(next, state.flow) ? null : next; settle();
      }, () => plan.widened[river.name]?.flow ?? []),
      scale("Temperature", scales.temperature, () => own.temperature ?? state.temperature, (next) => {
        own.temperature = same(next, state.temperature) ? null : next; settle();
      }, () => plan.widened[river.name]?.temperature ?? []),
      slider(() => own.priority ?? state.priority, (next) => {
        own.priority = next === state.priority ? null : next; settle();
      }),
    ));
  // A river with preferences of its own, or widened, stays open. Once it's neither,
  // it closes again.
  let held = false;
  function settle() {
    const now = hasOwn(own) || Boolean(plan.widened[river.name]);
    if (now) details.open = true;
    else if (held) details.open = false;
    held = now;
  }
  details.addEventListener("toggle", () => {
    if (!details.open && (hasOwn(own) || plan.widened[river.name])) details.open = true;
  });
  syncs.push(settle);
  syncs.push(() => { details.hidden = !own.on; });
  return details;
}

// The dropdown of rivers: any number of them, or all.
function picker() {
  const root = document.getElementById("picker");
  const label = el("span");
  const all = el("input", { type: "checkbox" });
  all.addEventListener("change", () => {
    for (const river of rivers) state.rivers[river.name].on = all.checked;
    edited();
  });
  const boxes = rivers.map((river) => {
    const box = el("input", { type: "checkbox" });
    box.addEventListener("change", () => { state.rivers[river.name].on = box.checked; edited(); });
    return { box, river, label: el("label", {}, box, river.name) };
  });
  root.append(
    el("summary", {}, label),
    el("div", { class: "menu" }, el("label", { class: "all" }, all, "All rivers"), ...boxes.map((item) => item.label)),
  );
  document.addEventListener("click", (event) => { if (!root.contains(event.target)) root.open = false; });
  document.addEventListener("keydown", (event) => { if (event.key === "Escape") root.open = false; });
  syncs.push(() => {
    const on = chosen();
    for (const { box, river } of boxes) box.checked = state.rivers[river.name].on;
    all.checked = on.length === rivers.length;
    all.indeterminate = on.length > 0 && on.length < rivers.length;
    label.textContent = on.length === rivers.length ? "All rivers"
      : on.length === 0 ? "No rivers"
      : on.length <= 2 ? on.map((river) => river.name).join(", ")
      : `${on.length} rivers`;
    document.getElementById("submit").disabled = on.length === 0;
  });
}

function colorOf(riverName) {
  return COLORS[rivers.findIndex((river) => river.name === riverName) % COLORS.length];
}

// Ink or white, whichever is easier to read on a color.
function inkOn(color) {
  const channel = (start) => {
    const value = parseInt(color.slice(start, start + 2), 16) / 255;
    return value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4;
  };
  const light = 0.2126 * channel(1) + 0.7152 * channel(3) + 0.0722 * channel(5);
  return (light + 0.05) ** 2 > 1.05 * 0.05 ? "#0b0b0b" : "#ffffff";
}

function chip(river) {
  const node = el("span", { class: "chip" }, river.code);
  const color = colorOf(river.name);
  node.style.background = color;
  node.style.color = inkOn(color);
  return node;
}

function calendar() {
  const starts = rivers.map((river) => river.season_start), ends = rivers.map((river) => river.season_end);
  const first = starts.reduce((a, b) => (a < b ? a : b)), last = ends.reduce((a, b) => (a > b ? a : b));
  const year = Number(first.slice(0, 4));
  const root = document.getElementById("calendar");
  const cells = [];
  for (let month = Number(first.slice(5, 7)); month <= Number(last.slice(5, 7)); month += 1) {
    const grid = el("div", { class: "grid" });
    for (const name of ["M", "T", "W", "T", "F", "S", "S"]) grid.append(el("div", { class: "weekday" }, name));
    const pad = (new Date(Date.UTC(year, month - 1, 1)).getUTCDay() + 6) % 7;
    for (let i = 0; i < pad; i += 1) grid.append(el("div"));
    const count = new Date(Date.UTC(year, month, 0)).getUTCDate();
    for (let day = 1; day <= count; day += 1) {
      const date = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const button = el("button", { type: "button", class: "day" }, String(day));
      button.addEventListener("click", () => {
        state.away.has(date) ? state.away.delete(date) : state.away.add(date);
        edited();
      });
      cells.push({ button, date, day });
      grid.append(button);
    }
    const title = new Date(Date.UTC(year, month - 1, 1)).toLocaleString("en-US", { month: "long", year: "numeric", timeZone: "UTC" });
    root.append(el("div", { class: "month" }, el("h3", {}, title), grid));
  }
  syncs.push(() => {
    const byDate = {};
    for (const launch of plan.launches) (byDate[launch.date] ??= []).push(launch);
    const on = chosen();
    for (const { button, date, day } of cells) {
      const away = state.away.has(date);
      const found = (byDate[date] ?? []).sort((a, b) => b.odds - a.odds);
      const picks = found.filter((launch) => launch.recommended);
      button.className = "day";
      if (away) button.classList.add("away");
      else if (!on.some((river) => river.season_start <= date && date <= river.season_end)) button.classList.add("off");
      button.replaceChildren(String(day));
      if (!away) {
        for (const launch of picks) button.append(chip({ name: launch.river, code: launch.code }));
      }
      button.setAttribute("aria-pressed", away);
      const lines = found.map((launch) => `${launch.river} ${percent(launch.odds)}${launch.recommended ? " recommended" : ""}`);
      button.title = lines.join("\n");
      button.setAttribute("aria-label", [date, away ? "unavailable" : null, ...lines].filter(Boolean).join(", "));
    }
  });
}

function key() {
  const root = document.getElementById("key");
  const items = rivers.map((river) => ({ river, node: el("span", { class: "river" }, chip(river), river.name) }));
  root.append(el("strong", {}, "Recommended"), ...items.map(({ node }) => node));
  syncs.push(() => {
    const shown = new Set(plan.launches.filter((launch) => launch.recommended).map((launch) => launch.river));
    for (const { river, node } of items) node.hidden = !shown.has(river.name);
    root.hidden = shown.size === 0;
  });
}

function results() {
  const byRiver = new Map();
  for (const launch of plan.launches) {
    if (!byRiver.has(launch.river)) byRiver.set(launch.river, []);
    byRiver.get(launch.river).push(launch);
  }
  document.getElementById("results").replaceChildren(...[...byRiver].map(([river, launches]) => {
    const widened = launches[0].widened;
    const rows = launches.map((launch) => {
      const date = new Date(`${launch.date}T00:00:00Z`).toLocaleString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
      const row = el("tr", { class: launch.recommended ? "recommended" : "" },
        el("td", {}, `${launch.weekday.slice(0, 3)} ${date}`),
        el("td", { class: "number" }, percent(launch.odds)),
        el("td", { class: "number" }, `${Math.round(launch.m * 100)}%`),
        el("td", {}, launch.flow_typical),
        el("td", {}, launch.temperature_typical),
        el("td", {}, launch.recommended ? "Recommended" : ""));
      row.style.setProperty("--river", colorOf(river));
      return row;
    });
    return el("details", { class: `river-launches${widened ? " widened" : ""}`, open: true },
      el("summary", {}, `${river}${widened ? " (widened)" : ""}`, el("span", { class: "count" }, `${launches.length} launches`)),
      el("table", {},
        el("thead", {}, el("tr", {}, el("th", {}, "Date"), el("th", { class: "number" }, "Odds"), el("th", { class: "number" }, "Match"), el("th", {}, "Typical flow"), el("th", {}, "Typical temperature"), el("th", {}, ""))),
        el("tbody", {}, ...rows)));
  }));
}

function banner(lines) {
  const node = document.getElementById("banner");
  node.hidden = lines.length === 0;
  node.replaceChildren(...lines.map((line) => el("p", {}, line)));
}

function warnings() {
  const lines = [];
  for (const [river, added] of Object.entries(plan.widened)) {
    const parts = [];
    if (added.flow.length) parts.push(`flow to include ${added.flow.map((step) => scales.flow[step]).join(", ")}`);
    if (added.temperature.length) parts.push(`temperature to include ${added.temperature.map((step) => scales.temperature[step]).join(", ")}`);
    lines.push(`${river}: no launches matched. Widened ${parts.join(" and ")}.`);
  }
  for (const river of plan.unavailable) lines.push(`${river}: no launches when you're free.`);
  return lines;
}

function sync() {
  for (const run of syncs) run();
}

async function submit() {
  const button = document.getElementById("submit");
  const request = (latest += 1);
  const considered = {};
  for (const river of chosen()) {
    const own = state.rivers[river.name];
    considered[river.name] = {
      days: own.days,
      flow: own.flow && [...own.flow],
      temperature: own.temperature && [...own.temperature],
      priority: own.priority,
    };
  }
  button.disabled = true;
  try {
    const response = await fetch("/api/plan", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        flow: [...state.flow], temperature: [...state.temperature], priority: state.priority,
        rivers: considered, away: [...state.away],
      }),
    });
    if (!response.ok) throw new Error(response.status);
    const found = await response.json();
    if (request !== latest) return;
    plan = found;
    results();
    const launches = document.getElementById("launches");
    launches.hidden = false;
    launches.classList.remove("stale");
    banner(warnings());
  } catch {
    if (request === latest) banner(["Can't reach the plan."]);
  } finally {
    if (request === latest) { button.disabled = false; sync(); }
  }
}

async function start() {
  try {
    const response = await fetch("/api/rivers");
    if (!response.ok) throw new Error(response.status);
    const found = await response.json();
    rivers = found.rivers;
    scales = { flow: found.flow, temperature: found.temperature };
    state.flow = new Set(found.preferences.flow);
    state.temperature = new Set(found.preferences.temperature);
    state.priority = found.preferences.priority;
    for (const river of rivers) {
      state.rivers[river.name] = { on: true, days: null, flow: null, temperature: null, priority: null };
    }
    preferencesPanel();
    document.getElementById("rivers").append(...rivers.map(riverRow));
    picker();
    calendar();
    key();
    document.getElementById("submit").addEventListener("click", submit);
    sync();
  } catch {
    banner(["Can't reach the rivers."]);
  }
}

start();
</script>
</body>
</html>
