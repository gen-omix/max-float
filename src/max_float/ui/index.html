<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>max-float</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --surface: #fcfcfb; --page: #f4f3ef; --ink: #0b0b0b; --muted: #52514e;
    --line: #d9d8d1; --accent: #1c5cab; --accent-soft: #cde2fb; --critical: #b3261e;
    --away: #52514e; --good: #0ca30c; --good-ink: #0a5c0a; --good-soft: #e6f4e6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  fieldset { border: 0; margin: 0 0 14px; padding: 0; min-width: 0; }
  legend { font-weight: 600; padding: 0; margin-bottom: 4px; }
  .page { max-width: 1500px; margin: auto; padding: 16px 16px 96px; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .top a { margin-left: auto; color: var(--accent); font-weight: 600; }
  /* Everything the open tab sets sits on one sheet in that tab's color, joined to
     its tab. */
  .sheet {
    background: var(--sheet, #e6e4dc); border: 2px solid var(--edge, #8a8a84);
    border-radius: 0 12px 12px 12px; padding: 16px;
  }
  .layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 16px; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .page { padding: 12px 8px 96px; }
    .sheet { padding: 10px; }
  }
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px; margin-bottom: 16px;
  }
  .tabs { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px; }
  .tab {
    font: inherit; font-weight: 600; color: var(--ink); background: var(--surface);
    border: 2px solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0;
    padding: 8px 18px 9px; cursor: pointer; box-shadow: inset 0 4px 0 var(--tab-ink, transparent);
    position: relative;
  }
  .tab:hover { background: var(--tab-tint, #fff); }
  .tab[aria-selected="true"] {
    background: var(--tab-tint); border-color: var(--tab-ink); padding-bottom: 11px; top: 2px; z-index: 1;
    box-shadow: inset 0 4px 0 var(--tab-ink), 0 2px 0 var(--tab-tint);
  }
  .tab:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .tab.add { font-weight: 700; padding: 8px 14px 9px; color: var(--accent); border-style: dashed; }
  .tab .check { display: inline-flex; vertical-align: -3px; margin-left: 6px; color: var(--good-ink); }
  .check svg { width: 16px; height: 16px; }
  .tab:disabled { color: #a9a8a2; cursor: not-allowed; }
  input.tab { width: 160px; cursor: text; font-weight: 400; }
  .status {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 16px;
    background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--accent);
    border-radius: 8px; padding: 10px 14px;
  }
  .status .state { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--accent); }
  .status .state svg { width: 20px; height: 20px; flex: none; }
  .status .when { color: var(--muted); }
  .status .fill { flex: 1; }
  .locked .status { border-left-color: var(--good); background: var(--good-soft); }
  .locked .status .state { color: var(--good-ink); }
  .locked .sheet { border-color: var(--good); }
  .notice {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 16px;
    background: var(--accent-soft); border-radius: 8px; padding: 10px 14px;
  }
  .notice p { margin: 0; flex: 1 1 260px; }
  .notice .lines { flex: 1 1 260px; display: grid; gap: 6px; }
  .notice a, .cover a { color: var(--accent); font-weight: 700; word-break: break-all; }
  .status .address { word-break: break-all; }
  .status .address strong { font-weight: 700; }
  /* Before there's a team: the page shows through a cover that asks who's here. */
  .cover {
    position: fixed; inset: 0; z-index: 30; overflow: auto; padding: 24px 16px;
    display: flex; align-items: flex-start; justify-content: center;
    background: rgba(244, 243, 239, 0.5); backdrop-filter: blur(1px);
  }
  .cover .card {
    width: min(560px, 100%); margin-top: 8vh; background: var(--surface); border: 2px solid var(--accent);
    border-radius: 12px; padding: 22px 24px; box-shadow: 0 10px 40px rgba(11, 11, 11, 0.25);
  }
  .cover h2 { font-size: 20px; margin: 0 0 4px; }
  .cover p { margin: 0 0 10px; }
  .cover form { display: flex; flex-wrap: wrap; gap: 8px; }
  .cover input { font: inherit; padding: 9px 12px; border: 2px solid var(--line); border-radius: 6px; flex: 1 1 220px; min-width: 0; }
  .cover input:focus { border-color: var(--accent); outline: none; }
  .cover .or { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: var(--muted); font-weight: 600; }
  .cover .or::before, .cover .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .cover .said { margin-top: 16px; padding: 10px 14px; border-radius: 8px; background: var(--accent-soft); display: grid; gap: 6px; }
  .cover .said p { margin: 0; }
  .cover .plans { margin: 16px 0 0; display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); }
  .cover .suggested { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px; border-radius: 8px; background: var(--accent-soft); }
  .cover .suggested .team { flex: 1 1 220px; min-width: 0; }
  .cover .suggested strong { display: block; word-break: break-all; }
  .cover .suggested a.primary { text-decoration: none; display: inline-block; color: #fff; word-break: normal; }
  .cover .suggested a.primary:hover { background: #184f95; }
  .cover .suggested a.primary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .cover .suggested span { color: var(--muted); font-size: 14px; }
  /* Who has submitted, on the Group tab. */
  .people h2 { margin-bottom: 10px; }
  .people .options { display: flex; flex-wrap: wrap; gap: 8px; }
  .person {
    font: inherit; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--ink);
    background: #fff; border: 2px dashed var(--line); border-radius: 999px; padding: 5px 14px 5px 10px;
  }
  .person .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--person); flex: none; }
  .person strong { font-weight: 600; }
  .person .state { color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
  .person.done { border-style: solid; border-color: var(--person); background: var(--person-tint); }
  .person.done .state { color: var(--good-ink); font-weight: 600; }
  .person:hover { border-color: var(--ink); }
  .person:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* While a submit is working out the dates. */
  .busy {
    position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 20;
    display: flex; align-items: center; gap: 12px; background: var(--ink); color: #fff;
    border-radius: 999px; padding: 14px 26px; font-weight: 700; box-shadow: 0 6px 24px rgba(11, 11, 11, 0.35);
  }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.35);
    border-top-color: #fff; animation: spin 0.8s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
  .loading main { opacity: 0.45; pointer-events: none; transition: opacity 0.15s; }
  #submit .spinner { display: none; }
  .loading #submit { display: inline-flex; align-items: center; gap: 10px; }
  .loading #submit .spinner { display: inline-block; }
  .notice .link { font-weight: 700; word-break: break-all; }
  .notice .close { font: inherit; font-size: 20px; line-height: 1; background: none; border: 0; cursor: pointer; padding: 2px 6px; color: var(--ink); }
  .votes legend { display: flex; width: 100%; }
  .votes legend .value { font-weight: 400; color: var(--muted); margin-left: auto; }
  legend .hint { font-weight: 400; font-size: 13px; color: var(--accent); margin-left: 8px; }
  .mode-group legend .hint, .locked legend .hint { display: none; }
  .votes .row {
    display: grid; grid-template-columns: 118px auto; align-items: center; gap: 6px;
    padding: 1px 4px; margin: 0 -4px; border-radius: 4px; outline: none;
  }
  .votes.ranged .row { grid-template-columns: 118px 62px auto; }
  .votes .range { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .votes .row:focus-visible { box-shadow: inset 0 0 0 2px var(--ink); }
  .votes .row.none .name { color: #8b8a84; }
  .votes .row.added .name { color: var(--critical); font-weight: 600; }
  .votes .dots { display: flex; gap: 2px; }
  .votes .dots span {
    width: 11px; height: 11px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line);
    cursor: pointer;
  }
  .votes .dots span:hover { box-shadow: inset 0 0 0 2px var(--ink); }
  .mode-group .votes .dots span, .mode-group .pie svg { cursor: default; }
  .mode-group .votes .dots span:hover { box-shadow: inset 0 0 0 1.5px var(--line); }
  .mode-applicant .days { display: none; }
  .pie { display: flex; align-items: center; gap: 14px; }
  .pie svg { width: 124px; height: 124px; flex: none; touch-action: none; cursor: pointer; }
  .pie path { stroke: var(--surface); stroke-width: 2; outline: none; }
  .pie path:focus-visible { stroke: var(--ink); }
  .brushes { display: grid; gap: 4px; }
  .brush {
    display: flex; align-items: center; gap: 7px; font: inherit; color: var(--ink); background: none;
    border: 1px solid transparent; border-radius: 6px; padding: 3px 8px 3px 5px; cursor: pointer; text-align: left;
  }
  .brush[aria-pressed="true"] { border-color: var(--ink); font-weight: 600; }
  .mode-group .brush { cursor: default; }
  .brush:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .value { font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 8px; }
  /* A river's own settings, edged in its river's color like its button above. */
  details.river { border: 1px solid var(--line); border-left: 6px solid var(--river); border-radius: 6px; padding: 6px 10px; margin-top: 6px; }
  details.river > summary { display: flex; align-items: center; gap: 7px; cursor: pointer; font-weight: 600; }
  details.river > summary::after { content: "\25B8"; margin-left: auto; color: var(--muted); }
  details.river[open] > summary::after { content: "\25BE"; }
  details.river .own { padding: 8px 0 4px 2px; }
  .days input { width: 56px; font: inherit; }
  #banner { background: var(--critical); color: #fff; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-weight: 600; }
  #banner p { margin: 0; }
  #banner p + p { margin-top: 4px; }
  /* The rivers a tab applies for, each a button in its river's color once chosen. */
  .choose h2 { margin-bottom: 10px; }
  .choose.none { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .choose .options { display: flex; flex-wrap: wrap; gap: 8px; }
  .option {
    font: inherit; font-weight: 600; color: var(--ink); background: #fff; border: 2px solid var(--line);
    border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .option:hover:not(:disabled) { border-color: var(--ink); }
  .option:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .option[aria-pressed="true"] { background: var(--river); border-color: var(--river); color: var(--river-ink); }
  .option:disabled { cursor: default; }
  .primary {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 9px 22px;
    font: inherit; font-weight: 700; cursor: pointer;
  }
  .primary:hover:not(:disabled) { background: #184f95; }
  .primary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .primary:disabled { background: #a9a8a2; cursor: not-allowed; }
  /* Submit floats at the lower right, on every tab, and glows while the results
     don't show the latest edits. */
  #submit {
    position: fixed; right: 24px; bottom: 24px; z-index: 10;
    background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 16px 40px;
    font: inherit; font-size: 18px; font-weight: 800; letter-spacing: 0.01em; cursor: pointer;
    box-shadow: 0 6px 20px rgba(11, 11, 11, 0.28);
  }
  #submit:hover:not(:disabled) { background: #184f95; }
  #submit:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  #submit:disabled { background: #a9a8a2; cursor: not-allowed; box-shadow: none; }
  #submit.pending:not(:disabled), #lock-here.pending:not(:disabled) { animation: glow 1.8s ease-in-out infinite; }
  @keyframes glow {
    0%, 100% { box-shadow: 0 6px 20px rgba(11, 11, 11, 0.28), 0 0 0 0 rgba(28, 92, 171, 0.45); }
    50% { box-shadow: 0 6px 20px rgba(11, 11, 11, 0.28), 0 0 0 10px rgba(28, 92, 171, 0); }
  }
  @media (prefers-reduced-motion: reduce) { #submit.pending:not(:disabled), #lock-here.pending:not(:disabled) { animation: none; outline: 3px solid var(--accent-soft); } }
  @media (max-width: 860px) { #submit { right: 12px; bottom: 12px; padding: 14px 30px; } }
  .months { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 18px; }
  .month h3 { font-size: 14px; margin: 0 0 4px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .weekday { text-align: center; font-size: 11px; color: var(--muted); }
  .day {
    min-height: 34px; border: 0; border-radius: 4px; background: #eceae4; color: var(--ink);
    font: inherit; font-size: 12px; line-height: 1; padding: 3px 1px; cursor: pointer;
    display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 2px;
  }
  .day:hover { outline: 2px solid var(--ink); }
  .day:focus-visible { outline: 2px solid var(--ink); }
  .mode-group .day, .locked .day { cursor: default; }
  .mode-group .day:hover, .locked .day:hover { outline: 0; }
  .locked .votes .dots span, .locked .pie svg, .locked .brush { cursor: default; }
  .locked .votes .dots span:hover { box-shadow: inset 0 0 0 1.5px var(--line); }
  .day.off { background: transparent; color: #8b8a84; }
  .day.away { background: var(--away); color: #fff; text-decoration: line-through; }
  .day.some { background: #c9c7bf; }
  .day .count {
    display: block; font-size: 9px; font-weight: 700; color: #fff; background: var(--away);
    border-radius: 3px; padding: 2px 0; text-align: center; text-decoration: none;
  }
  .day.away .count { background: #fff; color: var(--ink); }
  .chip {
    display: block; border-radius: 3px; padding: 2px 0; font-size: 9px; font-weight: 700;
    letter-spacing: 0.02em; text-align: center; text-decoration: none;
  }
  .key { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 14px; font-size: 13px; }
  .key span.river { display: inline-flex; align-items: center; gap: 6px; }
  .key .chip { width: 30px; }
  #out.stale { opacity: 0.5; }
  .heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .heading h2 { margin: 0; }
  .heading .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .secondary {
    font: inherit; font-weight: 600; color: var(--accent); background: #fff; border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 14px; cursor: pointer;
  }
  .secondary:hover { border-color: var(--accent); }
  .secondary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .river-launches { border-top: 1px solid var(--line); padding: 8px 0; overflow-x: auto; }
  .river-launches > summary { cursor: pointer; font-weight: 600; }
  .river-launches > summary .swatch { display: inline-block; margin: 0 8px -1px 0; }
  .river-launches.widened > summary { color: var(--critical); }
  .river-launches tr.launch { cursor: pointer; }
  .river-launches tr.launch:hover td, .river-launches tr.launch:focus-visible td { background: #f1f0ec; }
  .river-launches tr.launch td:first-child::before { content: "\25B8"; display: inline-block; width: 14px; color: var(--muted); }
  .river-launches tr.launch[aria-expanded="true"] td:first-child::before { content: "\25BE"; }
  /* A launch's past years, one column each, like a forecast: the trip's low to
     high on one scale, and its mean flow on another. */
  .years { display: flex; gap: 2px; overflow-x: auto; padding: 6px 0 4px; font-variant-numeric: tabular-nums; }
  .years .year { flex: 1 0 54px; display: flex; flex-direction: column; align-items: center; font-size: 12px; }
  .years .captions { flex: 0 0 auto; align-items: flex-start; position: sticky; left: 0; background: var(--surface); padding-right: 10px; color: var(--muted); z-index: 1; }
  .years strong { font-size: 13px; height: 20px; }
  .years .track { position: relative; width: 100%; height: 92px; }
  .years .track.flow { height: 76px; }
  .years .bar { position: absolute; left: 50%; width: 8px; margin-left: -4px; border-radius: 4px; min-height: 8px; }
  .years .track.flow .bar { width: 18px; margin-left: -9px; border-radius: 4px 4px 0 0; min-height: 2px; bottom: 0; }
  .years .value { position: absolute; left: 0; right: 0; text-align: center; line-height: 14px; }
  .years .value.none { top: 50%; margin-top: -7px; color: var(--muted); }
  .years .category { height: 28px; color: var(--muted); text-align: center; line-height: 14px; margin-bottom: 6px; }
  .years .captions .track, .years .captions .category, .years .captions strong { width: auto; display: flex; align-items: center; }
  .river-launches .count { font-weight: 400; color: var(--muted); margin-left: 6px; }
  table { border-collapse: collapse; width: 100%; margin-top: 6px; }
  th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; }
  th, td { padding: 5px 12px 5px 0; border-bottom: 1px solid var(--line); }
  td.number, th.number { text-align: right; font-variant-numeric: tabular-nums; }
  td:first-child { box-shadow: inset 4px 0 0 var(--river); }
  td:first-child, th:first-child { padding-left: 10px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart text { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .chart .tick { fill: var(--muted); font-size: 12px; }
  .chart .total { font-weight: 700; }
  .chart .row:hover .band { fill: #eceae4; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; margin-bottom: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .tip {
    position: absolute; z-index: 4; pointer-events: none; background: #fff; border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 10px; font-size: 13px; box-shadow: 0 4px 14px rgba(11, 11, 11, 0.14);
    white-space: nowrap;
  }
  .tip strong { display: block; margin-bottom: 2px; }
  .tip .value { margin-left: 0; padding-left: 12px; float: right; }
</style>
</head>
<body>
<div class="page">
  <header class="top"><h1>max-float</h1><a href="/">Change team</a></header>
  <nav class="tabs" id="tabs" aria-label="Applicants"></nav>
  <div class="sheet" id="sheet">
    <div class="status" id="status" hidden>
      <span class="state" id="state"></span>
      <span class="when" id="when"></span>
      <span class="fill"></span>
      <span class="address" id="address"></span>
      <button type="button" class="secondary" id="copy">Copy link</button>
      <button type="button" class="primary" id="lock">Lock in dates for group</button>
    </div>
    <div class="notice" id="notice" role="status" hidden></div>
    <div id="banner" role="alert" hidden></div>
    <section class="panel people" id="people" hidden>
      <h2 id="people-title"></h2>
      <div class="options" id="people-list"></div>
    </section>
    <section class="panel choose" id="choose">
      <h2 id="choose-title"></h2>
      <div class="options" id="options"></div>
    </section>
    <div class="layout">
      <aside>
        <div class="panel" id="preferences"></div>
        <div class="panel" id="rivers-panel"><h2>Rivers</h2><div id="rivers"></div></div>
      </aside>
      <main>
        <section class="panel">
          <h2>Unavailable dates</h2>
          <div class="months" id="calendar"></div>
          <div class="key" id="key" hidden></div>
        </section>
        <div id="out" hidden>
          <section class="panel">
            <div class="heading">
              <h2>Odds of at least one permit</h2>
              <div class="actions">
                <button type="button" class="primary" id="lock-here" hidden>Lock in dates to list them</button>
              </div>
            </div>
            <div class="chart" id="odds"></div>
          </section>
          <section class="panel" id="listed" hidden>
            <div class="heading">
              <h2>Recommended launches</h2>
              <div class="actions">
                <button type="button" class="secondary" id="download">Download CSV</button>
              </div>
            </div>
            <div id="results"></div>
          </section>
        </div>
      </main>
    </div>
  </div>
</div>
<button type="button" id="submit"><span class="spinner"></span><span id="submit-label">Submit</span></button>
<div class="cover" id="cover" role="dialog" aria-modal="true" aria-labelledby="cover-title" hidden></div>
<div class="busy" id="busy" role="status" hidden><span class="spinner"></span>Updating dates…</div>
<script>
// The settings on screen: the party's before it has a name, then the tab's.
const state = { flow: [], temperature: [], priority: null, rivers: {}, away: new Set(), awayBy: null, minimum: null };
const empty = { launches: [], odds: [], widened: {}, unavailable: [] };
let scales = {}, rivers = [], latest = 0, plan = empty, start = null;
// The party, once there is one, as the API gives it, and the tab that's open:
// "group" or an applicant's name.
const KEY = /^[a-z]+(-[a-z]+){3}$/;
const partyKey = KEY.test(location.pathname.slice(1)) ? location.pathname.slice(1) : "";
let group = null, tab = "group", loading = false;
// The plans this browser has opened, latest first, so their links can be offered
// again. Only a convenience: the address is what opens a plan.
const PLANS = "max-float-plans";
function remembered() {
  try {
    const found = JSON.parse(localStorage.getItem(PLANS) ?? "[]");
    return Array.isArray(found) ? found.filter((key) => typeof key === "string" && KEY.test(key)) : [];
  } catch { return []; }
}
function remember(key) {
  try { localStorage.setItem(PLANS, JSON.stringify([key, ...remembered().filter((other) => other !== key)].slice(0, 10))); } catch { /* no storage */ }
}
function forget(key) {
  try { localStorage.setItem(PLANS, JSON.stringify(remembered().filter((other) => other !== key))); } catch { /* no storage */ }
}
const planLink = (key) => el("a", { href: `/${key}` }, `${location.host}/${key}`);
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const mode = () => (group ? (tab === "group" ? "group" : "applicant") : "solo");
// An applicant's tab sets their preferences and days. The Group tab sets the
// rivers, trip lengths and minimum. Before the party has a name, one tab sets all.
// Once the group's dates are locked in, nothing can be changed until it unlocks.
const isLocked = () => Boolean(group?.locked);
const prefsEditable = () => mode() !== "group" && !isLocked();
const groupEditable = () => mode() !== "applicant" && !isLocked();
// Each tab's colors: the ink of its tab's stripe and edge, and the tint of its
// sheet. Applicants take theirs in the order they joined.
const GROUP_COLORS = { ink: "#8a8a84", tint: "#e6e4dc" };
const PEOPLE_COLORS = [
  { ink: "#2a78d6", tint: "#e2ecf9" },
  { ink: "#1baf7a", tint: "#ddf3ea" },
  { ink: "#6250d6", tint: "#e8e5f9" },
  { ink: "#eb6834", tint: "#fbe9e0" },
  { ink: "#e87ba4", tint: "#fae6ee" },
  { ink: "#eda100", tint: "#faf0d5" },
];
const colorsOf = (id) => {
  if (id === "group" || !group) return GROUP_COLORS;
  const index = Object.keys(group.applicants).indexOf(id);
  return PEOPLE_COLORS[Math.max(0, index) % PEOPLE_COLORS.length];
};
// Padlocks, open for planning and closed for locked in.
const PADLOCK = {
  open: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.9-.9"/></svg>',
  closed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
};
// Each river's launch dates. A day with none for a chosen river is shaded off.
const launchDates = {};
const syncs = [];
const opened = new Set();
// What a priority's slices can go to, in the order the pie shows them.
const PARTS = [
  { name: "odds", label: "Odds", color: "#1baf7a" },
  { name: "flow", label: "Flow", color: "#2a78d6" },
  { name: "temperature", label: "Temperature", color: "#eb6834" },
];
const SERIES = { recommended: "#2a78d6", random: "#eb6834" };
// Each river keeps its color whichever rivers are chosen, in the order of `rivers`.
const COLORS = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#9c2f7e", "#8a8a84", "#8a5a2b"];
const JSON_HEADERS = { "content-type": "application/json" };

function el(tag, attributes = {}, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attributes)) {
    if (name === "class") node.className = value;
    else if (name in node) node[name] = value;
    else node.setAttribute(name, value);
  }
  node.append(...children);
  return node;
}

const same = (a, b) => a.every((count, step) => count === b[step]);
// How many votes each scale has to give, and each scale's dot color.
let VOTES = 10;
const DOTS = { flow: "#2a78d6", temperature: "#eb6834" };
const percent = (odds) => `${(odds * 100).toFixed(1)}%`;
const chosen = () => rivers.filter((river) => state.rivers[river.name].on);
const partyUrl = (rest = "") => `/api/party/${partyKey}${rest}`;
const applicantUrl = (name) => partyUrl(`/applicants/${encodeURIComponent(name)}`);

// Something changed that the shown launches don't reflect until Submit. With a
// party, it's stored on the tab and saved soon after.
let autoTimer = null;
function edited() {
  document.getElementById("out").classList.add("stale");
  sync();
  store();
  // The Group tab has no Submit: its plan follows its settings.
  clearTimeout(autoTimer);
  if (mode() === "group") autoTimer = setTimeout(submit, 800);
}

// One scale's votes as a dot plot: a row of dots for each category. Click a dot to
// give its category that many votes, or click its last one to take one back, or
// use the arrow keys on a row. A category with no votes leaves out every launch
// typically in it. `added` gives any categories widening added. The Group tab
// shows the applicants' means, which can fill part of a dot.
function scale(title, names, color, get, set, added = () => [], ranges = null, hint = "") {
  const left = el("span", { class: "value" });
  function give(step, count) {
    if (!prefsEditable()) return;
    const counts = [...get()];
    const others = counts.reduce((sum, n) => sum + n, 0) - counts[step];
    counts[step] = Math.max(0, Math.min(count, VOTES - others));
    if (counts.every((n) => n === 0) || same(counts, get())) return;
    set(counts);
    edited();
  }
  const rows = names.map((name, step) => {
    const dots = Array.from({ length: VOTES }, (_, index) => {
      const dot = el("span");
      dot.addEventListener("click", () => give(step, get()[step] === index + 1 ? index : index + 1));
      return dot;
    });
    const row = el("div", { class: "row", tabindex: 0, role: "slider", "aria-label": name, "aria-valuemin": 0, "aria-valuemax": VOTES },
      el("span", { class: "name" }, name), ...(ranges ? [el("span", { class: "range" }, ranges[step])] : []), el("span", { class: "dots" }, ...dots));
    row.addEventListener("keydown", (event) => {
      const change = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[event.key];
      if (!change) return;
      event.preventDefault();
      give(step, get()[step] + change);
    });
    return { row, dots, step };
  });
  syncs.push(() => {
    const counts = get(), widened = added();
    const spent = counts.reduce((sum, n) => sum + n, 0);
    left.textContent = prefsEditable() ? `${VOTES - spent} of ${VOTES} left` : "";
    for (const { row, dots, step } of rows) {
      row.setAttribute("aria-valuenow", Math.round(counts[step] * 10) / 10);
      row.tabIndex = prefsEditable() ? 0 : -1;
      row.classList.toggle("none", counts[step] === 0);
      row.classList.toggle("added", widened.includes(step));
      dots.forEach((dot, index) => {
        const fill = Math.min(1, Math.max(0, counts[step] - index));
        dot.style.background = fill >= 1 ? color : fill > 0 ? `linear-gradient(90deg, ${color} ${fill * 100}%, transparent ${fill * 100}%)` : "";
      });
    }
  });
  return el("fieldset", { class: ranges ? "votes ranged" : "votes" }, el("legend", {}, title, ...(hint ? [el("span", { class: "hint" }, hint)] : []), left), ...rows.map(({ row }) => row));
}

// Each category's range on a scale, from where each category after the first
// starts. Temperatures are whole degrees, "60–69", and flows run to the next
// category's start, in thousands from 1,000 cfs, "1.5k–5k".
function ranges(starts, whole) {
  const number = (value) => (value >= 1000 ? `${+(value / 1000).toFixed(1)}k` : String(value));
  const end = (index) => number(whole ? starts[index + 1] - 1 : starts[index + 1]);
  return [`< ${number(starts[0])}`, ...starts.slice(0, -1).map((start, index) => `${number(start)}–${end(index)}`), `${number(starts.at(-1))}+`];
}

const samePriority = (a, b) => PARTS.every(({ name }) => a[name] === b[name]);
const SVG = "http://www.w3.org/2000/svg";

function svg(tag, attributes = {}, ...children) {
  const node = document.createElementNS(SVG, tag);
  for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
  node.append(...children);
  return node;
}

// The priority as a pie of slices. Pick odds, flow or temperature, then click or
// drag across slices, or press Enter on them, to give them to it. The slices
// regroup when a drag ends or focus leaves the pie. The Group tab's pie shows the
// applicants' means as three parts.
function pie(get, set, hint = "") {
  const total = () => PARTS.reduce((sum, { name }) => sum + get()[name], 0);
  const slices = Math.round(total());
  let brush = PARTS[0].name, painting = null;
  const wedges = [];
  const radius = 58;
  const point = (angle) => [radius * Math.sin(angle), -radius * Math.cos(angle)];
  const chart = svg("svg", { viewBox: "-60 -60 120 120", role: "group", "aria-label": "priority" });
  for (let slice = 0; slice < slices; slice += 1) {
    const [x1, y1] = point((2 * Math.PI * slice) / slices);
    const [x2, y2] = point((2 * Math.PI * (slice + 1)) / slices);
    const wedge = svg("path", { d: `M0 0L${x1} ${y1}A${radius} ${radius} 0 0 1 ${x2} ${y2}Z`, tabindex: 0, role: "button" });
    wedge.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      paint(slice);
    });
    wedges.push(wedge);
    chart.append(wedge);
  }
  const arcs = PARTS.map((part) => svg("path", { fill: part.color, hidden: true }));
  chart.append(...arcs);
  const whole = () => PARTS.every(({ name }) => Number.isInteger(get()[name]));
  const grouped = () => PARTS.flatMap(({ name }) => Array(get()[name]).fill(name));
  function paint(slice) {
    if (!prefsEditable() || !whole()) return;
    painting ??= grouped();
    if (painting[slice] === brush) return;
    painting[slice] = brush;
    const next = Object.fromEntries(PARTS.map(({ name }) => [name, painting.filter((part) => part === name).length]));
    set(next);
    edited();
  }
  function at(event) {
    const box = chart.getBoundingClientRect();
    const x = event.clientX - box.left - box.width / 2, y = event.clientY - box.top - box.height / 2;
    if (Math.hypot(x, y) > box.width / 2) return null;
    const angle = (Math.atan2(x, -y) + 2 * Math.PI) % (2 * Math.PI);
    return Math.min(slices - 1, Math.floor((angle / (2 * Math.PI)) * slices));
  }
  chart.addEventListener("pointerdown", (event) => {
    const slice = at(event);
    if (slice === null || !prefsEditable()) return;
    chart.setPointerCapture(event.pointerId);
    paint(slice);
  });
  chart.addEventListener("pointermove", (event) => {
    if (painting === null || !chart.hasPointerCapture(event.pointerId)) return;
    const slice = at(event);
    if (slice !== null) paint(slice);
  });
  const done = () => { if (painting) { painting = null; sync(); } };
  chart.addEventListener("pointerup", done);
  chart.addEventListener("pointercancel", done);
  chart.addEventListener("focusout", (event) => { if (!chart.contains(event.relatedTarget)) done(); });
  const brushes = PARTS.map((part) => {
    const count = el("span", { class: "value" });
    const button = el("button", { type: "button", class: "brush" }, el("span", { class: "swatch" }), part.label, count);
    button.firstChild.style.background = part.color;
    button.addEventListener("click", () => { if (prefsEditable()) { brush = part.name; sync(); } });
    return { part, button, count };
  });
  // Three arcs sized by each part's share, for means that aren't whole slices.
  function drawArcs() {
    let angle = 0;
    const sum = total();
    PARTS.forEach((part, index) => {
      const share = get()[part.name] / sum;
      const arc = arcs[index];
      arc.toggleAttribute("hidden", share <= 0);
      if (share >= 0.9999) { arc.setAttribute("d", `M0 -${radius}A${radius} ${radius} 0 1 1 0 ${radius}A${radius} ${radius} 0 1 1 0 -${radius}Z`); return; }
      const [x1, y1] = point(angle), [x2, y2] = point(angle + 2 * Math.PI * share);
      arc.setAttribute("d", `M0 0L${x1} ${y1}A${radius} ${radius} 0 ${share > 0.5 ? 1 : 0} 1 ${x2} ${y2}Z`);
      angle += 2 * Math.PI * share;
    });
  }
  syncs.push(() => {
    const exact = whole() && prefsEditable();
    for (const wedge of wedges) { wedge.toggleAttribute("hidden", !exact); wedge.tabIndex = exact ? 0 : -1; }
    for (const arc of arcs) arc.toggleAttribute("hidden", exact);
    if (exact) {
      const parts = painting ?? grouped();
      wedges.forEach((wedge, slice) => {
        const part = PARTS.find(({ name }) => name === parts[slice]);
        wedge.setAttribute("fill", part.color);
        wedge.setAttribute("aria-label", `slice ${slice + 1} of ${slices}: ${part.label}`);
      });
    } else {
      drawArcs();
    }
    for (const { part, button, count } of brushes) {
      count.textContent = Math.round(get()[part.name] * 10) / 10;
      button.setAttribute("aria-pressed", exact && brush === part.name);
      button.tabIndex = prefsEditable() ? 0 : -1;
    }
  });
  return el("fieldset", {}, el("legend", {}, "Priority", ...(hint ? [el("span", { class: "hint" }, hint)] : [])),
    el("div", { class: "pie" }, chart, el("div", { class: "brushes" }, ...brushes.map(({ button }) => button))));
}

// How many of a river's applicants must be free for a launch: one unless set higher.
function minimumControl() {
  const input = el("input", { type: "number", min: 1 });
  input.setAttribute("aria-label", "minimum");
  const people = () => Object.keys(group?.applicants ?? {}).length;
  input.addEventListener("change", () => {
    const count = people();
    const value = Math.min(count, Math.max(1, Number(input.value) || 1));
    input.value = value;
    state.minimum = value === 1 ? null : value;
    edited();
  });
  const field = el("fieldset", { class: "days" }, el("legend", {}, "Minimum"), input);
  syncs.push(() => {
    field.hidden = mode() !== "group";
    input.disabled = !groupEditable();
    const count = people();
    input.max = count;
    input.value = Math.min(state.minimum ?? 1, Math.max(count, 1));
  });
  return field;
}

// The preferences for every river, titled by whose they are, with what to do
// beside each part while it can be set.
function preferencesPanel() {
  const title = el("h2");
  document.getElementById("preferences").append(
    title,
    // Flow categories differ by river in cfs, so the party's have no ranges, only
    // the column, to line up with temperature's dots.
    scale("Flow", scales.flow, DOTS.flow, () => state.flow, (next) => { state.flow = next; }, undefined, scales.flow.map(() => ""), "click dots to vote"),
    scale("Temperature (°F)", scales.temperature, DOTS.temperature, () => state.temperature, (next) => { state.temperature = next; }, undefined, ranges(scales.temperatureStarts, true), "click dots to vote"),
    pie(() => state.priority, (next) => { state.priority = next; }, "pick one, then paint slices"),
    minimumControl(),
  );
  syncs.push(() => {
    title.textContent = mode() === "group" ? "The group's ideal conditions, averaged"
      : `${group ? `${tab}'s` : "Your"} ideal conditions, on every river`;
  });
}

function hasOwn(river) {
  return river.flow !== null || river.temperature !== null || river.priority !== null || river.days !== null;
}

function riverRow(river) {
  const own = () => state.rivers[river.name];
  const days = el("input", { type: "number", min: 1, max: river.max_trip_days, value: river.max_trip_days });
  days.addEventListener("change", () => {
    if (!groupEditable()) return;
    const value = Math.min(river.max_trip_days, Math.max(1, Number(days.value) || river.max_trip_days));
    days.value = value;
    own().days = value === river.max_trip_days ? null : value;
    settle();
    edited();
  });
  const details = el("details", { class: "river" },
    el("summary", {}, river.name),
    el("div", { class: "own" },
      el("fieldset", { class: "days" }, el("legend", {}, "Days"), days),
      scale("Flow (cfs)", scales.flow, DOTS.flow, () => own().flow ?? state.flow, (next) => {
        own().flow = same(next, state.flow) ? null : next; settle();
      }, () => plan.widened[river.name]?.flow ?? [], ranges(river.flow_starts, false)),
      scale("Temperature (°F)", scales.temperature, DOTS.temperature, () => own().temperature ?? state.temperature, (next) => {
        own().temperature = same(next, state.temperature) ? null : next; settle();
      }, () => plan.widened[river.name]?.temperature ?? [], ranges(scales.temperatureStarts, true)),
      pie(() => own().priority ?? state.priority, (next) => {
        own().priority = samePriority(next, state.priority) ? null : next; settle();
      }),
    ));
  details.style.setProperty("--river", colorOf(river.name));
  // A river with preferences of its own, or widened, stays open. Once it's neither,
  // it closes again.
  let held = false;
  function settle() {
    const now = hasOwn(own()) || Boolean(plan.widened[river.name]);
    if (now) details.open = true;
    else if (held) details.open = false;
    held = now;
  }
  details.addEventListener("toggle", () => {
    if (!details.open && (hasOwn(own()) || plan.widened[river.name])) details.open = true;
  });
  syncs.push(settle);
  syncs.push(() => {
    details.hidden = !own().on;
    days.value = own().days ?? river.max_trip_days;
    days.disabled = !groupEditable();
  });
  return details;
}

// The rivers to apply for, at the top of the tab: a button for each, in its river's
// color once chosen. Each applicant chooses their own. The Group tab shows the
// rivers any of them chose, and can't change which.
function chooser() {
  const root = document.getElementById("choose");
  const title = document.getElementById("choose-title");
  const options = rivers.map((river) => {
    const button = el("button", { type: "button", class: "option" }, river.name);
    const color = colorOf(river.name);
    button.style.setProperty("--river", color);
    button.style.setProperty("--river-ink", inkOn(color));
    button.addEventListener("click", () => { state.rivers[river.name].on = !state.rivers[river.name].on; edited(); });
    return { button, river };
  });
  document.getElementById("options").append(...options.map(({ button }) => button));
  syncs.push(() => {
    const on = chosen(), shared = mode() === "group";
    title.textContent = shared
      ? (on.length ? "Rivers the group will apply for:" : "No one has selected rivers yet. Each applicant selects their own on their tab.")
      : `Select which rivers ${group ? tab : "you"} will apply for:`;
    root.classList.toggle("none", on.length === 0 && prefsEditable());
    for (const { button, river } of options) {
      const pressed = state.rivers[river.name].on;
      button.hidden = shared && !pressed;
      button.disabled = !prefsEditable();
      button.setAttribute("aria-pressed", pressed);
    }
    document.getElementById("rivers-panel").hidden = on.length === 0;
    document.getElementById("submit").disabled = on.length === 0 || loading;
  });
}

// On the Group tab: who has submitted their rivers, preferences and dates, and who
// hasn't yet. A person opens their tab.
function people() {
  const root = document.getElementById("people");
  syncs.push(() => {
    root.hidden = mode() !== "group" || Object.keys(group.applicants).length === 0;
    if (root.hidden) return;
    const names = Object.keys(group.applicants);
    const done = names.filter((name) => group.applicants[name].submitted);
    document.getElementById("people-title").textContent = `${done.length} of ${names.length} submitted`;
    document.getElementById("people-list").replaceChildren(...names.map((name) => {
      const submitted = done.includes(name), colors = colorsOf(name);
      const state = el("span", { class: "state" });
      if (submitted) state.innerHTML = `<span class="check">${CHECK}</span>`;
      state.append(submitted ? "submitted" : "not yet");
      const node = el("button", { type: "button", class: `person${submitted ? " done" : ""}` }, el("span", { class: "dot" }), el("strong", {}, name), state);
      node.style.setProperty("--person", colors.ink);
      node.style.setProperty("--person-tint", colors.tint);
      node.addEventListener("click", () => show(name));
      return node;
    }));
  });
}

function colorOf(riverName) {
  return COLORS[rivers.findIndex((river) => river.name === riverName) % COLORS.length];
}

// Ink or white, whichever is easier to read on a color.
function inkOn(color) {
  const channel = (start) => {
    const value = parseInt(color.slice(start, start + 2), 16) / 255;
    return value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4;
  };
  const light = 0.2126 * channel(1) + 0.7152 * channel(3) + 0.0722 * channel(5);
  return (light + 0.05) ** 2 > 1.05 * 0.05 ? "#0b0b0b" : "#ffffff";
}

function chip(river) {
  const node = el("span", { class: "chip" }, river.code);
  const color = colorOf(river.name);
  node.style.background = color;
  node.style.color = inkOn(color);
  return node;
}

// The calendar of unavailable dates. An applicant's tab marks their own. The Group
// tab shows everyone's, with how many are away on a day not everyone is.
function calendar() {
  const starts = rivers.map((river) => river.season_start), ends = rivers.map((river) => river.season_end);
  const first = starts.reduce((a, b) => (a < b ? a : b)), last = ends.reduce((a, b) => (a > b ? a : b));
  const year = Number(first.slice(0, 4));
  const root = document.getElementById("calendar");
  const cells = [];
  for (let month = Number(first.slice(5, 7)); month <= Number(last.slice(5, 7)); month += 1) {
    const grid = el("div", { class: "grid" });
    for (const name of ["M", "T", "W", "T", "F", "S", "S"]) grid.append(el("div", { class: "weekday" }, name));
    const pad = (new Date(Date.UTC(year, month - 1, 1)).getUTCDay() + 6) % 7;
    for (let i = 0; i < pad; i += 1) grid.append(el("div"));
    const count = new Date(Date.UTC(year, month, 0)).getUTCDate();
    for (let day = 1; day <= count; day += 1) {
      const date = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const button = el("button", { type: "button", class: "day" }, String(day));
      button.addEventListener("click", () => {
        if (!prefsEditable()) return;  // the Group tab, or locked in
        state.away.has(date) ? state.away.delete(date) : state.away.add(date);
        edited();
      });
      cells.push({ button, date, day });
      grid.append(button);
    }
    const title = new Date(Date.UTC(year, month - 1, 1)).toLocaleString("en-US", { month: "long", year: "numeric", timeZone: "UTC" });
    root.append(el("div", { class: "month" }, el("h3", {}, title), grid));
  }
  syncs.push(() => {
    const byDate = {};
    for (const launch of together(plan.launches)) (byDate[launch.date] ??= []).push(launch);
    const on = chosen();
    const people = mode() === "group" ? Object.keys(group.applicants).length : 1;
    for (const { button, date, day } of cells) {
      const names = state.awayBy?.[date] ?? [];
      const away = state.away.has(date);
      const everyone = away && (mode() !== "group" || names.length === people);
      const found = (byDate[date] ?? []).sort((a, b) => b.party_odds - a.party_odds);
      button.className = "day";
      if (everyone) button.classList.add("away");
      else if (away) button.classList.add("some");
      else if (!on.some((river) => launchDates[river.name].has(date))) button.classList.add("off");
      button.replaceChildren(String(day));
      if (away && mode() === "group") button.append(el("span", { class: "count" }, `${names.length}/${people}`));
      if (!everyone) {
        for (const launch of found) button.append(chip({ name: launch.river, code: launch.code }));
      }
      button.setAttribute("aria-pressed", away);
      const lines = found.map((launch) => `${launch.river} ${percent(shownOdds(launch))}${mode() === "group" ? ` ${launch.applicants.join(", ")}` : ""}`);
      const who = names.length ? [`away: ${names.join(", ")}`] : [];
      button.title = [...who, ...lines].join("\n");
      button.setAttribute("aria-label", [date, away ? "unavailable" : null, ...who, ...lines].filter(Boolean).join(", "));
    }
  });
}

function key() {
  const root = document.getElementById("key");
  const items = rivers.map((river) => ({ river, node: el("span", { class: "river" }, chip(river), river.name) }));
  root.append(el("strong", {}, "Recommended"), ...items.map(({ node }) => node));
  syncs.push(() => {
    const shown = new Set(plan.launches.map((launch) => launch.river));
    for (const { river, node } of items) node.hidden = !shown.has(river.name);
    root.hidden = shown.size === 0;
  });
}

const dateName = (date) => new Date(`${date}T00:00:00Z`).toLocaleString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });

// The plan's launches, once each, with everyone applying for each.
function together(launches) {
  const found = new Map();
  for (const launch of launches) {
    const id = `${launch.river} ${launch.date}`;
    if (!found.has(id)) found.set(id, { ...launch, applicants: [] });
    if (launch.applicant) found.get(id).applicants.push(launch.applicant);
  }
  return [...found.values()];
}

// The Group tab shows the party's odds of winning a launch, and an applicant's
// tab the odds of their own application for it.
const shownOdds = (launch) => (mode() === "group" ? launch.party_odds : launch.odds);

// A launch's past years, like a forecast: a column for each year with the trip's
// lowest low to its mean high on one scale, its mean flow on another, and the categories those were.
const shown = new Set();
const cfs = (value) => (value >= 10000 ? `${(value / 1000).toFixed(0)}k` : value >= 1000 ? `${(value / 1000).toFixed(1)}k` : String(Math.round(value)));
function years(history) {
  const highs = history.map((year) => year.high_f).filter((value) => value !== null);
  const lows = history.map((year) => year.low_f ?? year.high_f).filter((value) => value !== null);
  const top = Math.max(...highs, ...lows), bottom = Math.min(...highs, ...lows);
  const most = Math.max(...history.map((year) => year.flow_cfs ?? 0));
  // Each track keeps a line of text above and below its bar.
  const place = (value, height) => 16 + (1 - (value - bottom) / Math.max(top - bottom, 1)) * (height - 40);
  const none = () => el("span", { class: "value none" }, "—");
  const captions = el("div", { class: "year captions" }, el("strong"),
    el("div", { class: "track" }, "High and low (°F)"), el("span", { class: "category" }),
    el("div", { class: "track flow" }, "Flow (cfs)"), el("span", { class: "category" }));
  return el("div", { class: "years" }, captions, ...history.map((year) => {
    const temperature = el("div", { class: "track" });
    if (year.high_f === null) temperature.append(none());
    else {
      const high = place(year.high_f, 92), low = place(year.low_f ?? year.high_f, 92);
      const bar = el("span", { class: "bar" });
      bar.style.cssText = `top: ${high}px; height: ${low - high + 8}px; background: ${DOTS.temperature};`;
      const above = el("span", { class: "value" }, `${Math.round(year.high_f)}°`);
      above.style.top = `${high - 15}px`;
      temperature.append(above, bar);
      if (year.low_f !== null) {
        const below = el("span", { class: "value" }, `${Math.round(year.low_f)}°`);
        below.style.top = `${low + 9}px`;
        temperature.append(below);
      }
    }
    const flow = el("div", { class: "track flow" });
    if (year.flow_cfs === null) flow.append(none());
    else {
      const height = most ? (year.flow_cfs / most) * 58 : 0;
      const bar = el("span", { class: "bar" });
      bar.style.cssText = `height: ${height}px; background: ${DOTS.flow};`;
      const above = el("span", { class: "value" }, cfs(year.flow_cfs));
      above.style.bottom = `${Math.max(height, 2) + 2}px`;
      flow.append(above, bar);
    }
    const column = el("div", { class: "year" }, el("strong", {}, String(year.year)),
      temperature, el("span", { class: "category" }, year.temperature ?? ""),
      flow, el("span", { class: "category" }, year.flow ?? ""));
    column.setAttribute("aria-label", `${year.year}: ${year.high_f === null ? "no temperature" : `high ${Math.round(year.high_f)}°F${year.low_f === null ? "" : `, low ${Math.round(year.low_f)}°F`}, ${year.temperature}`}; ${year.flow_cfs === null ? "no flow" : `${Math.round(year.flow_cfs)} cfs, ${year.flow}`}`);
    return column;
  }));
}

// Each river's recommended launches, closed until opened. A river stays open
// across submits. The Group tab's rows name who applies for each, and a row
// opens its launch's past years.
function results() {
  const byRiver = new Map();
  for (const launch of together(plan.launches)) {
    if (!byRiver.has(launch.river)) byRiver.set(launch.river, []);
    byRiver.get(launch.river).push(launch);
  }
  const named = mode() === "group";
  document.getElementById("results").replaceChildren(...[...byRiver].map(([river, launches]) => {
    const widened = launches[0].widened;
    const columns = named ? 5 : 4;
    const rows = launches.flatMap((launch) => {
      const id = `${river} ${launch.date}`;
      const past = el("tr", { class: "past", hidden: !shown.has(id) }, el("td", { colSpan: columns }, years(launch.history)));
      const row = el("tr", { class: "launch", tabIndex: 0, role: "button", "aria-expanded": shown.has(id) },
        el("td", {}, `${launch.weekday.slice(0, 3)} ${dateName(launch.date)}`),
        ...(named ? [el("td", {}, launch.applicants.join(", "))] : []),
        el("td", { class: "number" }, percent(shownOdds(launch))),
        el("td", {}, launch.flow_typical),
        el("td", {}, launch.temperature_typical));
      row.style.setProperty("--river", colorOf(river));
      const toggle = () => {
        shown.has(id) ? shown.delete(id) : shown.add(id);
        past.hidden = !shown.has(id);
        row.setAttribute("aria-expanded", shown.has(id));
      };
      row.addEventListener("click", toggle);
      row.addEventListener("keydown", (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); toggle(); } });
      return [row, past];
    });
    const swatch = el("span", { class: "swatch" });
    swatch.style.background = colorOf(river);
    const details = el("details", { class: `river-launches${widened ? " widened" : ""}`, open: opened.has(river) },
      el("summary", {}, swatch, `${river}${widened ? " (widened)" : ""}`,
        el("span", { class: "count" }, `${launches.length} launch${launches.length === 1 ? "" : "es"}`)),
      el("table", {},
        el("thead", {}, el("tr", {}, el("th", {}, "Date"), ...(named ? [el("th", {}, "Applicants")] : []), el("th", { class: "number" }, "Odds"), el("th", {}, "Typical flow"), el("th", {}, "Typical temperature"))),
        el("tbody", {}, ...rows)));
    details.addEventListener("toggle", () => { details.open ? opened.add(river) : opened.delete(river); });
    return details;
  }));
  document.getElementById("download").disabled = plan.launches.length === 0;
}

const COLUMNS = ["river", "code", "date", "weekday", "applicant", "choice", "odds", "party_odds", "flow_typical", "temperature_typical", "widened"];

function download() {
  const cell = (value) => (/[",\n]/.test(String(value)) ? `"${String(value).replaceAll('"', '""')}"` : String(value));
  const lines = [COLUMNS.join(","), ...plan.launches.map((launch) => COLUMNS.map((column) => cell(launch[column])).join(","))];
  const link = el("a", { href: URL.createObjectURL(new Blob([`${lines.join("\n")}\n`], { type: "text/csv" })), download: "max-float-recommended.csv" });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href));
}

const times = (ratio) => `${ratio >= 10 ? ratio.toFixed(0) : ratio.toFixed(1)}×`;

// The odds with the recommended launches and with launches at random, each as a
// multiple of the odds with the most common launches, for all rivers then each.
function oddsChart() {
  const root = document.getElementById("odds");
  const rows = plan.odds.filter((row) => row.common > 0).map((row) => ({
    ...row,
    name: row.river ?? "All rivers",
    lift: { recommended: row.recommended / row.common, random: row.random / row.common },
  }));
  if (rows.length === 0) { root.replaceChildren(); return; }
  const width = Math.max(root.clientWidth, 300);
  const labels = Math.min(190, width * 0.38), right = 44, top = 26, rowHeight = 30, axis = 44;
  const ratios = rows.flatMap((row) => [row.lift.recommended, row.lift.random]).filter((ratio) => ratio > 0);
  const low = Math.min(-1, Math.floor(Math.log2(Math.min(...ratios)))), high = Math.max(1, Math.ceil(Math.log2(Math.max(...ratios))));
  const step = (width - labels - right) / (high - low) < 36 ? 2 : 1;
  const x = (ratio) => labels + ((Math.log2(Math.max(ratio, 2 ** low)) - low) / (high - low)) * (width - labels - right);
  const height = top + rows.length * rowHeight + axis;
  const chart = svg("svg", { viewBox: `0 0 ${width} ${height}`, height, role: "img",
    "aria-label": rows.map((row) => `${row.name}: recommended ${times(row.lift.recommended)}, random ${times(row.lift.random)} the most common dates`).join("; ") });
  for (let power = low; power <= high; power += 1) {
    if (power % step !== 0) continue;
    const at = x(2 ** power);
    chart.append(
      svg("line", { x1: at, x2: at, y1: top, y2: height - axis + 4, stroke: "#e6e5df" }),
      svg("text", { x: at, y: height - axis + 20, "text-anchor": "middle", class: "tick" }, power >= 0 ? `${2 ** power}×` : `1/${2 ** -power}×`),
    );
  }
  chart.append(svg("text", { x: (labels + width - right) / 2, y: height - 6, "text-anchor": "middle", class: "tick" }, "× the odds with the most common dates"));
  const tip = el("div", { class: "tip", hidden: true });
  rows.forEach((row, index) => {
    const y = top + index * rowHeight + rowHeight / 2;
    const group_ = svg("g", { class: "row" },
      svg("rect", { class: "band", x: 0, y: y - rowHeight / 2, width, height: rowHeight, fill: "transparent", rx: 4 }),
      svg("text", { x: 8, y: y + 4, class: row.river === null ? "total" : "" }, row.name),
      svg("line", { x1: x(Math.min(row.lift.random, row.lift.recommended)), x2: x(Math.max(row.lift.random, row.lift.recommended)), y1: y, y2: y, stroke: "#a9a8a2", "stroke-width": 2 }),
      svg("circle", { cx: x(row.lift.random), cy: y, r: 6, fill: SERIES.random, stroke: "var(--surface)", "stroke-width": 2 }),
      svg("circle", { cx: x(row.lift.recommended), cy: y, r: 6, fill: SERIES.recommended, stroke: "var(--surface)", "stroke-width": 2 }));
    if (row.river === null) {
      group_.append(svg("text", { x: x(row.lift.recommended) + 11, y: y + 4, class: "total" }, times(row.lift.recommended)));
      if (rows.length > 1) chart.append(svg("line", { x1: 0, x2: width, y1: y + rowHeight / 2, y2: y + rowHeight / 2, stroke: "var(--line)" }));
    }
    group_.addEventListener("pointermove", (event) => {
      const line = (name, value, color, ratio) => {
        const swatch = el("span", { class: "dot" });
        if (color) swatch.style.background = color;
        return el("div", { class: "legend" }, el("span", {}, color ? swatch : "", name), el("span", { class: "value" }, `${percent(value)}${ratio ? ` · ${times(ratio)}` : ""}`));
      };
      tip.replaceChildren(el("strong", {}, row.name),
        line("Recommended", row.recommended, SERIES.recommended, row.lift.recommended),
        line("Random", row.random, SERIES.random, row.lift.random),
        line("Most common", row.common));
      tip.hidden = false;
      const box = root.getBoundingClientRect();
      const left = Math.min(event.clientX - box.left + 14, box.width - tip.offsetWidth);
      tip.style.left = `${Math.max(0, left)}px`;
      tip.style.top = `${event.clientY - box.top + 14}px`;
    });
    group_.addEventListener("pointerleave", () => { tip.hidden = true; });
    chart.append(group_);
  });
  const baseline = x(1);
  chart.append(
    svg("line", { x1: baseline, x2: baseline, y1: top - 6, y2: height - axis + 4, stroke: "var(--ink)", "stroke-width": 2 }),
    svg("text", { x: baseline, y: top - 12, "text-anchor": "middle" }, "Most common dates"),
  );
  const legend = (name, color) => {
    const dot = el("span", { class: "dot" });
    dot.style.background = color;
    return el("span", {}, dot, name);
  };
  root.replaceChildren(el("div", { class: "legend" }, legend("Recommended", SERIES.recommended), legend("Random", SERIES.random)), chart, tip);
}

// The group's link, once it's made: copy it, or close the notice.
function copier(link) {
  const copy = el("button", { type: "button", class: "secondary" }, "Copy link");
  copy.addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(link); copy.textContent = "Copied"; } catch { copy.textContent = "Copy failed"; }
  });
  return copy;
}

function notice(...children) {
  const node = document.getElementById("notice");
  const close = el("button", { type: "button", class: "close", "aria-label": "Close" }, "×");
  close.addEventListener("click", () => { node.hidden = true; });
  node.replaceChildren(...children, close);
  node.hidden = false;
}

function linkNotice() {
  const link = `${location.origin}/${partyKey}`;
  notice(
    el("p", {}, "Your team name is ", el("span", { class: "link" }, partyKey), ". Share it so others can add their own tab, and enter it at ", location.host, " to come back. Or keep this link: ", el("span", { class: "link" }, link)),
    copier(link));
}

// An address that has made its week's teams: the plans this browser has opened,
// and who can reset them. The server never stores a team name, so it can't list
// them.
function limitLines() {
  const lines = [el("p", {}, "This internet address has already started the most plans allowed in one week, so a new one can't be started from here yet.")];
  const found = remembered();
  if (found.length) lines.push(el("p", {}, "Plans opened in this browser:"), ...found.map((key) => el("p", {}, planLink(key))));
  lines.push(el("p", {}, "Need your plans reset? Email ", el("a", { href: "mailto:gen@gen-omix.com" }, "gen@gen-omix.com"), "."));
  return lines;
}

// A team name from what was typed or pasted: the words, however they're joined,
// or the end of a link. Null if it isn't one.
function teamName(text) {
  const last = text.trim().toLowerCase().split(/[#?]/)[0].split("/").filter(Boolean).pop() ?? "";
  const name = last.replace(/[\s_,]+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "");
  return KEY.test(name) ? name : null;
}

// The first team this browser opened that still exists, with its applicants'
// names, or null.
async function suggestion() {
  for (const key of remembered()) {
    const response = await fetch(`/api/party/${key}`).catch(() => null);
    if (response?.ok) return { key, names: Object.keys((await response.json()).applicants) };
    if (response?.status === 404) forget(key);
    else return null;
  }
  return null;
}

// Outside a team, the page shows through a cover that asks which plan: the team
// this browser opened last, if there is one, another team by its team name, or
// a new plan, started by someone planning alone or leading a group.
async function cover(...said) {
  const root = document.getElementById("cover");
  const last = await suggestion();
  const told = el("div", { class: "said", role: "alert", hidden: said.length === 0 }, ...said.map((line) => (typeof line === "string" ? el("p", {}, line) : line)));
  const say = (...lines) => { told.replaceChildren(...lines.map((line) => (typeof line === "string" ? el("p", {}, line) : line))); told.hidden = false; };
  const name = el("input", { type: "text", maxLength: 40, placeholder: "Your name", autocomplete: "off" });
  name.setAttribute("aria-label", "Your name");
  const begun = el("form", {}, name, el("button", { type: "submit", class: last ? "secondary" : "primary" }, "Start planning"));
  begun.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (!name.value.trim()) { name.focus(); return; }
    const response = await fetch("/api/party", {
      method: "POST",
      headers: JSON_HEADERS,
      body: JSON.stringify({ name: name.value.trim(), minimum: null, rivers: {}, applicant: applicantBody() }),
    }).catch(() => null);
    if (response?.status === 429) { say(...limitLines()); return; }
    if (!response?.ok) { say("Couldn't start the plan."); return; }
    location.replace(`/${(await response.json()).key}#created`);
  });
  const team = el("input", { type: "text", maxLength: 120, placeholder: "otter-canyon-cobble-ferry", autocomplete: "off", spellcheck: false });
  team.setAttribute("aria-label", "Team name");
  const joined = el("form", {}, team, el("button", { type: "submit", class: "secondary" }, "Open plan"));
  joined.addEventListener("submit", async (event) => {
    event.preventDefault();
    const found = teamName(team.value);
    if (!found) { say("A team name is four words, like otter-canyon-cobble-ferry."); return; }
    const response = await fetch(`/api/party/${found}`).catch(() => null);
    if (response?.ok) { location.assign(`/${found}`); return; }
    say(response?.status === 404 ? "No team by that name." : "Can't reach the team.");
  });
  const starting = [
    el("h2", { id: last ? "" : "cover-title" }, last ? "Start a new plan" : "Start planning"),
    el("p", {}, "Solo, or leading your group's plan? Enter your name."),
    begun,
  ];
  const joining = [
    el("h2", {}, last ? "Open another team" : "Join your group"),
    el("p", {}, "Enter your group's team name."),
    joined,
  ];
  const card = el("div", { class: "card" });
  let open = null;
  if (last) {
    open = el("a", { class: "primary", href: `/${last.key}` }, "Open this team");
    card.append(
      el("h2", { id: "cover-title" }, "Do you want this team?"),
      el("div", { class: "suggested" },
        el("div", { class: "team" }, el("strong", {}, last.key), el("span", {}, last.names.join(", ") || "No one has a tab yet")),
        open),
      el("div", { class: "or" }, "or"), ...joining,
      el("div", { class: "or" }, "or"), ...starting);
  } else {
    card.append(...starting, el("div", { class: "or" }, "or"), ...joining);
  }
  const others = remembered().filter((key) => key !== last?.key);
  card.append(told, ...(others.length ? [el("p", { class: "plans" }, "Also opened in this browser:", ...others.map(planLink))] : []));
  root.replaceChildren(card);
  root.hidden = false;
  document.querySelector(".page").inert = true;
  document.getElementById("submit").hidden = true;
  (open ?? name).focus();
}

function banner(lines) {
  const node = document.getElementById("banner");
  node.hidden = lines.length === 0;
  node.replaceChildren(...lines.map((line) => el("p", {}, line)));
}

function warnings() {
  const lines = [];
  for (const [river, added] of Object.entries(plan.widened)) {
    const parts = [];
    if (added.flow.length) parts.push(`flow to include ${added.flow.map((step) => scales.flow[step]).join(", ")}`);
    if (added.temperature.length) parts.push(`temperature to include ${added.temperature.map((step) => scales.temperature[step]).join(", ")}`);
    lines.push(`${river}: no launches matched. Widened ${parts.join(" and ")}.`);
  }
  for (const river of plan.unavailable) lines.push(`${river}: no launches when ${mode() === "group" ? "everyone's" : "you're"} free.`);
  return lines;
}

const whenName = (moment) => new Date(moment).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

function sync() {
  document.body.className = `mode-${mode()}${isLocked() ? " locked" : ""}${loading ? " loading" : ""}`;
  const colors = colorsOf(tab);
  document.body.style.setProperty("--sheet", colors.tint);
  document.body.style.setProperty("--edge", colors.ink);
  for (const run of syncs) run();
  // Planning or locked in, on every tab of a group. Only the Group tab locks; any
  // tab unlocks.
  const status = document.getElementById("status");
  status.hidden = !group;
  if (group) {
    document.getElementById("address").replaceChildren("Team name ", el("strong", {}, partyKey));
    document.getElementById("state").innerHTML = `${isLocked() ? PADLOCK.closed : PADLOCK.open}<span>${isLocked() ? "Locked in" : "Planning"}</span>`;
    document.getElementById("when").textContent = isLocked() ? whenName(group.locked) : "Dates not locked in";
    const lockButton = document.getElementById("lock");
    lockButton.hidden = !isLocked() && mode() !== "group";
    lockButton.className = isLocked() ? "secondary" : "primary";
    lockButton.textContent = isLocked() ? "Unlock" : "Lock in dates for group";
  }
  // There are dates to lock in once the Group tab's plan is fresh and has launches.
  const lockable = () => !document.getElementById("out").hidden && !document.getElementById("out").classList.contains("stale") && plan.launches.length > 0;
  document.getElementById("lock").disabled = Boolean(group) && !isLocked() && !lockable();
  // The list of launches, with its download, comes once the dates are locked in.
  // Until then the odds show what the plan is worth, with the way to lock beside
  // them: naming yourself before there's a group, then the Group tab's lock,
  // glowing once the results are fresh.
  const out = document.getElementById("out");
  const stale = out.hidden || out.classList.contains("stale");
  document.getElementById("listed").hidden = !isLocked();
  const lockHere = document.getElementById("lock-here");
  lockHere.hidden = isLocked() || mode() !== "group";
  document.getElementById("submit").hidden = mode() !== "applicant";
  document.getElementById("submit-label").textContent = loading ? "Updating…" : "Submit";
  document.getElementById("busy").hidden = !loading;
  lockHere.disabled = !lockable();
  lockHere.classList.toggle("pending", !stale);
  document.getElementById("submit").classList.toggle("pending", stale);
}

// --- The party: tabs, loading, storing and saving ---

// The settings on screen as the API takes an applicant.
function applicantBody() {
  const own = {};
  for (const river of rivers) {
    const found = state.rivers[river.name];
    if (found.on) own[river.name] = { flow: found.flow, temperature: found.temperature, priority: found.priority };
  }
  return { flow: state.flow, temperature: state.temperature, priority: state.priority, rivers: own, away: [...state.away].sort() };
}

const riversBody = () => Object.fromEntries(chosen().map((river) => [river.name, state.rivers[river.name].days]));

// Put the open tab's settings on screen: the group's means, or an applicant's own.
function load() {
  if (!group) return;
  // An applicant's rivers are the ones they apply for, and the group's are the
  // ones any applicant does.
  const source = tab === "group" ? group.preferences : group.applicants[tab];
  const on = (name) => name in source.rivers;
  state.flow = [...source.flow];
  state.temperature = [...source.temperature];
  state.priority = { ...source.priority };
  for (const river of rivers) {
    const own = source.rivers[river.name] ?? {};
    state.rivers[river.name] = { on: on(river.name), days: group.rivers[river.name] ?? null, flow: own.flow ?? null, temperature: own.temperature ?? null, priority: own.priority ?? null };
  }
  if (tab === "group") {
    state.minimum = group.minimum;
    state.awayBy = {};
    for (const [name, person] of Object.entries(group.applicants)) for (const date of person.away) (state.awayBy[date] ??= []).push(name);
    state.away = new Set(Object.keys(state.awayBy));
  } else {
    state.awayBy = null;
    state.away = new Set(source.away);
  }
}

// Keep what the open tab changed, and save it soon.
let dirty = null, saveTimer = null;
function store() {
  if (!group) return;
  if (tab === "group") {
    group.rivers = riversBody();
    group.minimum = state.minimum;
    dirty = "group";
  } else {
    const was = group.applicants[tab]?.submitted;
    group.applicants[tab] = applicantBody();
    dirty = tab;
    if (was) tabs();
  }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 2000);
}

// Save whatever is waiting: the group's settings, or one applicant's.
async function flush(keepalive = false) {
  if (!group || dirty === null) return;
  const what = dirty;
  dirty = null;
  clearTimeout(saveTimer);
  const url = what === "group" ? partyUrl() : applicantUrl(what);
  const body = what === "group" ? { minimum: group.minimum, rivers: group.rivers } : group.applicants[what];
  try {
    const response = await fetch(url, { method: "PUT", keepalive, headers: JSON_HEADERS, body: JSON.stringify(body) });
    if (!response.ok) throw new Error(response.status);
  } catch {
    dirty ??= what;
    banner(["Couldn't save."]);
  }
}
window.addEventListener("pagehide", () => { flush(true); });

// Read the party again, for what others have changed.
async function refresh() {
  const response = await fetch(partyUrl());
  if (!response.ok) throw new Error(response.status);
  const before = marks(group);
  group = await response.json();
  if (tab !== "group" && !(tab in group.applicants)) tab = "group";
  load();
  // Someone joined or submitted: their tab and its check.
  if (marks(group) !== before) tabs();
}

// Open a tab at once, from what's on hand, so a click right after lands on it and
// not on the tab before. Then save what that one changed, and for the Group tab
// read the group again and work out its plan, as it has no Submit of its own.
async function show(next) {
  const saving = flush();
  clearTimeout(autoTimer);
  latest += 1;  // a plan still on its way is for the tab before
  loading = false;
  tab = next;
  load();
  plan = empty;
  document.getElementById("out").hidden = true;
  banner([]);
  tabs();
  sync();
  await saving;
  if (group && next === "group" && tab === "group") await submit();
}

// While the Group tab is open, look for anyone who has submitted, joined, or
// locked or unlocked the dates since, and work the plan out again when they have.
const WATCH_MS = 10000;
const marks = (party) => JSON.stringify([party.locked, Object.entries(party.applicants).map(([name, person]) => [name, person.submitted ?? null])]);
async function watch() {
  // Not while a name is being typed in the tabs, which an update would redraw.
  const idle = () => group && tab === "group" && !loading && dirty === null && document.visibilityState === "visible"
    && !document.querySelector("#tabs input:not([hidden])");
  if (!idle()) return;
  try {
    const response = await fetch(partyUrl());
    if (!response.ok) return;
    const found = await response.json();
    if (idle() && marks(found) !== marks(group)) submit();
  } catch { /* look again next time */ }
}

// Name yourself to join the group. A name already in it opens that tab.
async function join(name) {
  if (!name || !group) return;
  if (!(name in group.applicants)) {
    group.applicants[name] = { flow: [...start.flow], temperature: [...start.temperature], priority: { ...start.priority }, rivers: {}, away: [] };
    dirty = name;
    await flush();
  }
  await show(name);
}

function tabs() {
  const root = document.getElementById("tabs");
  const names = group ? Object.keys(group.applicants) : [];
  const button = (label, id) => {
    const node = el("button", { type: "button", class: "tab", role: "tab", "aria-selected": tab === id }, label);
    if (group?.applicants[id]?.submitted) {
      node.insertAdjacentHTML("beforeend", `<span class="check" title="submitted">${CHECK}</span>`);
      node.setAttribute("aria-label", `${label}, submitted`);
    }
    const colors = colorsOf(id);
    node.style.setProperty("--tab-ink", colors.ink);
    node.style.setProperty("--tab-tint", colors.tint);
    node.addEventListener("click", () => { if (id !== tab) show(id); });
    return node;
  };
  const add = el("button", { type: "button", class: "tab add", disabled: isLocked() });
  const field = el("input", { type: "text", class: "tab", maxLength: 40, hidden: true, placeholder: "Your name" });
  field.setAttribute("aria-label", "Name");
  add.addEventListener("click", () => { add.hidden = true; field.hidden = false; field.focus(); });
  const close = () => { field.value = ""; field.hidden = true; add.hidden = false; };
  field.addEventListener("keydown", (event) => {
    if (event.key === "Enter") { const name = field.value.trim(); close(); join(name); }
    if (event.key === "Escape") close();
  });
  field.addEventListener("blur", () => { const name = field.value.trim(); close(); join(name); });
  add.append("+ Add your name");
  root.replaceChildren(button("Group", "group"), ...names.map((name) => button(name, name)), add, field);
}

async function toggleLock() {
  const buttons = [document.getElementById("lock"), document.getElementById("lock-here")];
  for (const button of buttons) button.disabled = true;
  try {
    if (group.locked) {
      const response = await fetch(partyUrl("/unlock"), { method: "POST" });
      if (!response.ok) throw new Error(response.status);
      group.locked = null;
      document.getElementById("out").classList.add("stale");
      tabs();
    } else {
      await flush();
      const response = await fetch(partyUrl("/lock"), { method: "POST" });
      if (response.status === 409) { banner(["There are no launches to lock in."]); return; }
      if (!response.ok) throw new Error(response.status);
      group.locked = (await response.json()).locked;
      tabs();
      if (tab === "group") await submit();
    }
  } catch {
    banner(["Couldn't change the lock."]);
  } finally {
    for (const button of buttons) button.disabled = false;
    sync();
  }
}

// Work out the plan. While it's on its way the page says so, for long enough to
// be seen, and an applicant's own tab is marked as submitted once it's back.
const SHOWN_MS = 600;
async function submit() {
  const request = (latest += 1), who = tab, began = Date.now();
  loading = true;
  sync();
  try {
    await flush();
    if (request !== latest) return;
    if (who === "group") {
      await refresh();
      if (request !== latest) return;
      if (chosen().length === 0) {
        plan = empty;
        document.getElementById("out").hidden = true;
        return;
      }
    }
    const query = who === "group" ? "" : `?applicant=${encodeURIComponent(who)}`;
    const response = await fetch(partyUrl(`/plan${query}`), { method: "POST" });
    if (!response.ok) throw new Error(response.status);
    const found = await response.json();
    await new Promise((done) => { setTimeout(done, Math.max(0, SHOWN_MS - (Date.now() - began))); });
    if (request !== latest) return;
    if (who !== "group" && !isLocked() && group.applicants[who]) {
      group.applicants[who].submitted = new Date().toISOString();
      tabs();
    }
    plan = found;
    const out = document.getElementById("out");
    out.hidden = false;
    out.classList.remove("stale");
    results();
    oddsChart();
    banner(warnings());
  } catch {
    if (request === latest) banner(["Can't reach the plan."]);
  } finally {
    if (request === latest) { loading = false; sync(); }
  }
}

async function begin() {
  try {
    const response = await fetch("/api/rivers");
    if (!response.ok) throw new Error(response.status);
    const found = await response.json();
    rivers = found.rivers;
    for (const river of rivers) launchDates[river.name] = new Set(river.launches);
    scales = { flow: found.flow, temperature: found.temperature, temperatureStarts: found.temperature_starts };
    VOTES = found.votes;
    start = found.preferences;
    state.flow = [...start.flow];
    state.temperature = [...start.temperature];
    state.priority = { ...start.priority };
    for (const river of rivers) {
      state.rivers[river.name] = { on: false, days: null, flow: null, temperature: null, priority: null };
    }
    preferencesPanel();
    document.getElementById("rivers").append(...rivers.map(riverRow));
    chooser();
    people();
    calendar();
    key();
    document.getElementById("submit").addEventListener("click", submit);
    document.getElementById("download").addEventListener("click", download);
    document.getElementById("lock").addEventListener("click", toggleLock);
    document.getElementById("lock-here").addEventListener("click", toggleLock);
    let width = 0;
    new ResizeObserver(([entry]) => {
      if (entry.contentRect.width !== width && plan.odds.length) oddsChart();
      width = entry.contentRect.width;
    }).observe(document.getElementById("odds"));
    let unreachable = false;
    if (partyKey) {
      const party = await fetch(partyUrl());
      if (party.ok) {
        group = await party.json();
        remember(partyKey);
        // Whoever just made the plan starts on their own tab.
        if (location.hash === "#created") tab = Object.keys(group.applicants)[0] ?? "group";
        load();
        document.getElementById("copy").replaceWith(Object.assign(copier(`${location.origin}/${partyKey}`), { id: "copy" }));
        if (location.hash === "#created") {
          linkNotice();
          history.replaceState(null, "", location.pathname);
        }
      }
      else if (party.status === 404) forget(partyKey);
      else { banner(["Can't reach the team."]); unreachable = true; }
    } else {
    }
    tabs();
    sync();
    // With no team, the page shows through a cover that starts or opens one.
    if (!group && !unreachable) cover(...(partyKey ? ["No team by that name."] : []));
    if (group && tab === "group") submit();
    setInterval(watch, WATCH_MS);
  } catch {
    banner(["Can't reach the rivers."]);
  }
}

begin();
</script>
</body>
