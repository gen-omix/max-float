// Ask before doing something that can't be taken back: the button gives way to
// the question, a button that does it, and one that keeps things as they are.
const asking = new Set();
function ask(button, question, yes, act) {
  button.addEventListener("click", () => {
    const close = () => { line.remove(); delete button.dataset.asking; asking.delete(close); sync(); };
    const go = el("button", { type: "button", class: "secondary yes" }, yes);
    const keep = el("button", { type: "button", class: "secondary" }, "Cancel");
    const line = el("span", { class: "asking", role: "group", "aria-label": question }, question, go, keep);
    go.addEventListener("click", () => { close(); act(); });
    keep.addEventListener("click", () => { close(); button.focus(); });
    button.dataset.asking = "";
    button.stopAsking = close;
    button.hidden = true;
    button.after(line);
    asking.add(close);
    keep.focus();
  });
}
const closeAsking = () => { for (const close of [...asking]) close(); };

// Delete an applicant's tab, with their settings and days away, then open the
// Team tab. Not while the dates are locked in.
async function removeTab(name) {
  if (dirty === name) { dirty = null; clearTimeout(saveTimer); }
  const response = await fetch(applicantUrl(name), { method: "DELETE" }).catch(() => null);
  if (response?.status === 409) { banner(["The dates are locked in, so tabs can't be deleted until the team unlocks them."]); return; }
  if (!response?.ok) { banner(["Couldn't delete the tab."]); return; }
  delete team.applicants[name];
  await show("team");
}

function banner(lines) {
  const node = document.getElementById("banner");
  node.hidden = lines.length === 0;
  node.replaceChildren(...lines.map((line) => el("p", {}, line)));
}

function warnings() {
  const lines = [];
  for (const [river, added] of Object.entries(plan.widened)) {
    const parts = [];
    if (added.flow.length) parts.push(`flow to include ${added.flow.map((step) => scales.flow[step]).join(", ")}`);
    if (added.temperature.length) parts.push(`temperature to include ${added.temperature.map((step) => scales.temperature[step]).join(", ")}`);
    lines.push(`${river}: no launches matched. Widened ${parts.join(" and ")}.`);
  }
  for (const river of plan.unavailable) lines.push(`${river}: no launches when ${mode() === "team" ? "everyone's" : "you're"} free.`);
  return lines;
}

const whenName = (moment) => new Date(moment).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

function sync() {
  document.body.className = `mode-${mode()}${isLocked() ? " locked" : ""}${loading ? " loading" : ""}`;
  const colors = colorsOf(tab);
  document.body.style.setProperty("--sheet", colors.tint);
  document.body.style.setProperty("--edge", colors.ink);
  for (const run of syncs) run();
  // Planning or locked in, on every tab of a team, with Unlock on every tab while
  // locked in.
  const status = document.getElementById("status");
  status.hidden = !team;
  if (team) {
    document.getElementById("address").replaceChildren("Team name ", el("strong", {}, partyKey));
    document.getElementById("state").innerHTML = `${isLocked() ? PADLOCK.closed : PADLOCK.open}<span>${isLocked() ? "Locked in" : "Planning"}</span>`;
    document.getElementById("when").textContent = isLocked() ? `${whenName(team.locked)} · Your submitted availability and preferences now count in the team's plan` : "Dates not locked in";
    const unlock = document.getElementById("unlock");
    unlock.hidden = !isLocked() || "asking" in unlock.dataset;
  }
  const shared = mode() === "team", who = shared ? "" : team ? tab : "you";
  document.getElementById("rivers-title").replaceChildren(...(shared
    ? ["Individual river trip lengths and preferences"] : [named(tab, "'s"), " individual river preferences"]));
  document.getElementById("calendar-title").replaceChildren(...(shared
    ? ["Team availability and team-optimized launch dates"] : [named(tab, "'s"), " availability"]));
  const hint = document.getElementById("calendar-sub");
  hint.hidden = shared;
  hint.replaceChildren(...(shared ? [] : ["Select the dates ", named(who), " ", el("strong", {}, "is not"), " available this season."]));
  // The team's odds on the Team tab, and an applicant's own on theirs.
  document.getElementById("odds-title").replaceChildren(...(shared
    ? ["The team's odds of at least one permit"] : [named(tab, "'s"), " odds of at least one permit"]));
  // The notice that the team is ready goes once it isn't.
  if (readyShown && !ready()) { document.getElementById("notice").hidden = true; readyShown = false; }
  // An applicant's own tab can be deleted, and their days cleared, until the
  // dates are locked in.
  const own = mode() === "applicant";
  const clear = document.getElementById("clear-dates");
  // A question closes once what it asks about can't be done.
  for (const [button, gone] of [[clear, !own || isLocked()], [document.getElementById("unlock"), !isLocked()]]) {
    if (gone && "asking" in button.dataset) button.stopAsking();
  }
  clear.hidden = !own || "asking" in clear.dataset;
  clear.disabled = !prefsEditable() || state.away.size === 0;
  // The list of launches, with its download, comes once the dates are locked in.
  const out = document.getElementById("out");
  const stale = out.hidden || out.classList.contains("stale");
  document.getElementById("listed").hidden = !isLocked() || out.hidden;
  document.getElementById("busy").hidden = !loading;
  // Along the bottom while the dates can change: Done on an applicant's tab, and
  // once they're done, or on the Team tab, the lock. It says who the team is
  // waiting for, and locks once everyone is done and the plan is up to date.
  const names = team ? Object.keys(team.applicants) : [];
  const waiting = names.filter((name) => !team.applicants[name].done);
  const finished = own && Boolean(team.applicants[tab]?.done);
  document.getElementById("next").hidden = !team || isLocked() || names.length === 0 || (!own && mode() !== "team");
  const doneButton = document.getElementById("done");
  doneButton.hidden = !own;
  doneButton.className = finished ? "secondary finished" : "primary";
  doneButton.disabled = finished;
  doneButton.innerHTML = finished ? `<span class="check">${CHECK}</span>Done` : "Done";
  doneButton.setAttribute("aria-label", finished ? `${tab} is done` : `Mark ${tab} done`);
  const lock = document.getElementById("lock");
  lock.hidden = own && !finished;
  lock.disabled = waiting.length > 0 || stale || loading || (mode() === "team" && plan.launches.length === 0);
  lock.textContent = waiting.length
    ? `Lock in once ${listOf(waiting)} ${waiting.length === 1 ? "is" : "are"} done`
    : `Lock in and get ${names.length === 1 ? "my" : "our"} applications`;
}

// An applicant's name as the page says it, in their color.
function named(name, after = "") {
  const node = el("span", { class: "who" }, `${name}${after}`);
  const colors = colorsOf(name);
  node.style.setProperty("--person", colors.ink);
  node.style.setProperty("--person-tint", colors.tint);
  return node;
}

// Names as a list: "Sam", "Sam and Kit", "Sam, Kit and Ada".
const listOf = (names) => (names.length < 2 ? names.join("") : `${names.slice(0, -1).join(", ")} and ${names.at(-1)}`);

// --- The party: tabs, loading, storing and saving ---

// The settings on screen as the API takes an applicant.
function applicantBody() {
  const own = {};
  for (const river of rivers) {
    const found = state.rivers[river.name];
    if (found.on) own[river.name] = { flow: found.flow, temperature: found.temperature, priority: found.priority, slots: found.slots ?? null };
  }
  return { flow: state.flow, temperature: state.temperature, priority: state.priority, rivers: own, away: [...state.away].sort() };
}

const riversBody = () => Object.fromEntries(chosen().map((river) => [river.name, state.rivers[river.name].days]));

// Put the open tab's settings on screen: the team's means, or an applicant's own.
function load() {
  if (!team) return;
  // An applicant's rivers are the ones they apply for, and the team's are the
  // ones any applicant does. The Team tab shows the team's shares, not ratings.
  const source = tab === "team" ? null : team.applicants[tab];
  const start = source ?? blankPreferences();
  const on = (name) => (source ? name in source.rivers : Object.values(team.applicants).some((person) => name in person.rivers));
  state.flow = [...start.flow];
  state.temperature = [...start.temperature];
  state.priority = { ...start.priority };
  for (const river of rivers) {
    const own = source?.rivers[river.name] ?? {};
    state.rivers[river.name] = { on: on(river.name), days: team.rivers[river.name] ?? null, flow: own.flow ?? null, temperature: own.temperature ?? null, priority: own.priority ?? null, slots: own.slots ?? null };
  }
  if (tab === "team") {
    state.minimum = team.minimum;
    state.awayBy = {};
    for (const [name, person] of Object.entries(team.applicants)) for (const date of person.away) (state.awayBy[date] ??= []).push(name);
    state.away = new Set(Object.keys(state.awayBy));
  } else {
    state.awayBy = null;
    state.away = new Set(source.away);
  }
}

// Keep what the open tab changed, and save it soon.
let dirty = null, saveTimer = null;
function store() {
  if (!team) return;
  if (tab === "team") {
    team.rivers = riversBody();
    team.minimum = state.minimum;
    dirty = "team";
  } else {
    const was = team.applicants[tab]?.done;
    team.applicants[tab] = applicantBody();
    dirty = tab;
    if (was) tabs();
  }
  saved("Saving…");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 2000);
}

// Whether the open tab's changes are saved, quietly, in the status bar.
const saved = (text) => { document.getElementById("saved").textContent = text; };

// Save whatever is waiting: the team's settings, or one applicant's.
async function flush(keepalive = false) {
  if (!team || dirty === null) return;
  const what = dirty;
  dirty = null;
  clearTimeout(saveTimer);
  const url = what === "team" ? partyUrl() : applicantUrl(what);
  const body = what === "team" ? { minimum: team.minimum, rivers: team.rivers } : team.applicants[what];
  try {
    const response = await fetch(url, { method: "PUT", keepalive, headers: JSON_HEADERS, body: JSON.stringify(body) });
    if (!response.ok) throw new Error(response.status);
    if (dirty === null) saved("Saved");
  } catch {
    dirty ??= what;
    saved("");
    banner(["Couldn't save."]);
  }
}
window.addEventListener("pagehide", () => { flush(true); });

// Read the party again, for what others have changed.
async function refresh() {
  const response = await fetch(partyUrl());
  if (!response.ok) throw new Error(response.status);
  adopt(await response.json());
}

// Take the party as read, with the open tab's settings from it. Someone joined,
// left, or said they were done: their tab and its check.
function adopt(found) {
  const before = marks(team), was = ready();
  team = found;
  if (tab !== "team" && !(tab in team.applicants)) tab = "team";
  load();
  if (marks(team) !== before) tabs();
  if (!was && ready()) readyNotice();
}

// Open a tab at once, from what's on hand, so a click right after lands on it and
// not on the tab before. Then save what that one changed, and work out the plan
// for the one that's open.
async function show(next) {
  closeAsking();
  const saving = flush();
  clearTimeout(autoTimer);
  latest += 1;  // a plan still on its way is for the tab before
  loading = false;
  tab = next;
  load();
  plan = empty;
  document.getElementById("out").hidden = true;
  banner([]);
  tabs();
  sync();
  saved("");
  await saving;
  if (team && tab === next) await replan();
}

// On any tab, look for anyone who has said they're done, joined, left, or
// locked or unlocked the dates since, and work the plan out again when they have.
const WATCH_MS = 10000;
const marks = (party) => JSON.stringify([party.locked, Object.entries(party.applicants).map(([name, person]) => [name, person.done ?? null])]);
async function watch() {
  // Not while anything is waiting to be saved, or a name is being typed in the
  // tabs, which an update would redraw.
  const idle = () => team && !loading && dirty === null && document.visibilityState === "visible"
    && !document.querySelector("#tabs input:not([hidden])");
  if (!idle()) return;
  try {
    const response = await fetch(partyUrl());
    if (!response.ok) return;
    const found = await response.json();
    if (idle() && marks(found) !== marks(team)) {
      adopt(found);
      sync();
      replan();
    }
  } catch { /* look again next time */ }
}

// Name yourself to join the team. A name already in it opens that tab.
const badName = (name) => name.includes("/") || /^\.+$/.test(name);
async function join(name) {
  if (!name || !team) return;
  if (badName(name)) { banner(["A name can't include a slash."]); return; }
  if (!(name in team.applicants)) {
    team.applicants[name] = { ...blankPreferences(), rivers: {}, away: [] };
    dirty = name;
    await flush();
  }
  iAm(partyKey, name);
  await show(name);
}

function tabs() {
  const root = document.getElementById("tabs");
  const names = team ? Object.keys(team.applicants) : [];
  const button = (label, id) => {
    const node = el("button", { type: "button", class: "tab", role: "tab", "aria-selected": tab === id }, label);
    if (team?.applicants[id]?.done) {
      node.insertAdjacentHTML("beforeend", `<span class="check" title="done">${CHECK}</span>`);
      node.setAttribute("aria-label", `${label}, done`);
    }
    const colors = colorsOf(id);
    node.style.setProperty("--tab-ink", colors.ink);
    node.style.setProperty("--tab-tint", colors.tint);
    node.addEventListener("click", () => { if (id !== tab) show(id); });
    // An applicant's tab can be deleted from its trash can, until the dates are
    // locked in.
    if (id !== "team" && !isLocked()) {
      const remove = el("button", { type: "button", class: "tab-x", "aria-label": `Delete ${label}'s tab`, title: `Delete ${label}'s tab` });
      remove.innerHTML = TRASH;
      ask(remove, `Delete ${label}'s tab, with their settings and dates?`, "Delete", () => removeTab(id));
      return el("span", { class: `tabwrap${id === tab ? " open" : ""}` }, node, remove);
    }
    return node;
  };
  const add = el("button", { type: "button", class: "tab add", disabled: isLocked() });
  const field = el("input", { type: "text", class: "tab", maxLength: 40, hidden: true, placeholder: "Your name" });
  field.setAttribute("aria-label", "Name");
  add.addEventListener("click", () => { add.hidden = true; field.hidden = false; field.focus(); });
  const close = () => { field.value = ""; field.hidden = true; add.hidden = false; };
  field.addEventListener("keydown", (event) => {
    if (event.key === "Enter") { const name = field.value.trim(); close(); join(name); }
    if (event.key === "Escape") close();
  });
  field.addEventListener("blur", () => { const name = field.value.trim(); close(); join(name); });
  add.append(isLocked() ? "Unlock to add a name" : "+ Add your name");
  root.replaceChildren(button("Team", "team"), ...names.map((name) => button(name, name)), add, field);
}

// Lock in the team's dates, then go to the applications that gives.
async function lockIn() {
  const button = document.getElementById("lock");
  button.disabled = true;
  try {
    await flush();
    const response = await fetch(partyUrl("/lock"), { method: "POST" });
    if (response.status === 409) {
      banner([(await response.json()).detail]);
      await refresh();
      return;
    }
    if (!response.ok) throw new Error(response.status);
    team.locked = (await response.json()).locked;
    tabs();
    await replan();
    document.getElementById("listed").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch {
    banner(["Couldn't lock in the dates."]);
  } finally {
    sync();
  }
}

// Unlock the team's dates, which takes its applications out of other teams' odds.
async function unlock() {
  try {
    const response = await fetch(partyUrl("/unlock"), { method: "POST" });
    if (!response.ok) throw new Error(response.status);
    team.locked = null;
    tabs();
    await replan();
  } catch {
    banner(["Couldn't unlock the dates."]);
  } finally {
    sync();
  }
}

// Work out the plan for the open tab: the team's, or the launches one applicant
// applies for in it. While it's on its way the page says so, for long enough to
// be seen. An applicant with no rivers has no plan to work out.
const SHOWN_MS = 600;
async function replan() {
  const request = (latest += 1), who = tab, began = Date.now();
  const out = document.getElementById("out");
  // An applicant's draft comes once they've chosen a river and rated every row,
  // and the team's once anyone has.
  if (mode() === "applicant" && (chosen().length === 0 || !ratedAll())) {
    plan = empty;
    out.hidden = true;
    sync();
    return;
  }
  loading = true;
  sync();
  try {
    await flush();
    if (request !== latest) return;
    if (who === "team") {
      await refresh();
      if (request !== latest) return;
      if (chosen().length === 0 || (!team.preferences && !isLocked())) {
        plan = empty;
        out.hidden = true;
        return;
      }
    }
    const query = who === "team" ? "" : `?applicant=${encodeURIComponent(who)}`;
    const response = await fetch(partyUrl(`/plan${query}`), { method: "POST" });
    if (response.status === 409) {
      if (request === latest) { plan = empty; out.hidden = true; }
      return;
    }
    if (!response.ok) throw new Error(response.status);
    const found = await response.json();
    await new Promise((done) => { setTimeout(done, Math.max(0, SHOWN_MS - (Date.now() - began))); });
    if (request !== latest) return;
    plan = found;
    out.hidden = false;
    out.classList.remove("stale");
    results();
    oddsChart();
    headline();
    sample();
    banner(warnings());
  } catch {
    if (request === latest) banner(["Can't reach the plan."]);
  } finally {
    if (request === latest) { loading = false; sync(); }
  }
}

// An applicant says they're done with their rivers, preferences and days, which
// holds until they change something. Not before they've chosen a river.
let finishing = false;
async function finish() {
  if (finishing) return;
  if (chosen().length === 0) { noRivers(); return; }
  if (!ratedAll()) { unrated(); return; }
  if (!splitAll()) { unsplit(); return; }
  const who = tab;
  finishing = true;
  try {
    await flush();
    const response = await fetch(`${applicantUrl(who)}/done`, { method: "POST" });
    if (response.status === 409) {
      const reason = (await response.json()).detail;
      if (tab === who) /shared application/.test(reason) ? unsplit() : /river/.test(reason) ? noRivers(reason) : /[Rr]ate/.test(reason) ? unrated() : banner([reason]);
      return;
    }
    if (!response.ok) throw new Error(response.status);
    const was = ready();
    if (team.applicants[who] && dirty !== who) team.applicants[who].done = (await response.json()).done;
    tabs();
    if (!was && ready()) readyNotice();
  } catch {
    banner(["Couldn't save."]);
  } finally {
    finishing = false;
    sync();
  }
}

let created = false;
async function begin() {
  try {
    const response = await fetch("/api/rivers");
    if (!response.ok) throw new Error(response.status);
    const found = await response.json();
    rivers = found.rivers;
    for (const river of rivers) launchDates[river.name] = new Set(river.launches);
    scales = { flow: found.flow, temperature: found.temperature, temperatureStarts: found.temperature_starts };
    scales.ratings = found.ratings;
    scales.priorityRatings = found.priority_ratings;
    Object.assign(state, blankPreferences());
    for (const river of rivers) {
      state.rivers[river.name] = { on: false, days: null, flow: null, temperature: null, priority: null, slots: null };
    }
    preferencesPanel();
    document.getElementById("rivers").append(...rivers.map(riverRow));
    chooser();
    people();
    calendar();
    key();
    document.getElementById("done").addEventListener("click", finish);
    document.getElementById("download").addEventListener("click", download);
    document.getElementById("copy-list").addEventListener("click", copyList);
    document.getElementById("lock").addEventListener("click", lockIn);
    ask(document.getElementById("unlock"), "Unlock to make changes? Until the team locks in again, its applications won't count in other teams' odds.", "Unlock", unlock);
    ask(document.getElementById("clear-dates"), "Clear every date on this calendar?", "Clear", () => { state.away.clear(); edited(); });
    let width = 0;
    new ResizeObserver(([entry]) => {
      if (entry.contentRect.width !== width && plan.odds.length) oddsChart();
      width = entry.contentRect.width;
    }).observe(document.getElementById("odds"));
    let unreachable = false;
    if (partyKey) {
      const party = await fetch(partyUrl());
      if (party.ok) {
        team = await party.json();
        remember(partyKey);
        // Whoever just made the plan starts on their own tab, and anyone this
        // browser knows is in the team on theirs.
        created = location.hash === "#created";
        const me = created ? Object.keys(team.applicants)[0] : whoAmI(partyKey);
        if (me && me in team.applicants) {
          tab = me;
          iAm(partyKey, me);
        }
        load();
        document.getElementById("copy").replaceWith(Object.assign(copier(`${location.origin}/${partyKey}`), { id: "copy" }));
        if (created) {
          linkNotice();
          history.replaceState(null, "", location.pathname);
        } else if (ready()) readyNotice();
      }
      else if (party.status === 404) forget(partyKey);
      else { banner(["Can't reach the team."]); unreachable = true; }
    } else {
    }
    tabs();
    sync();
    // With no team, the page shows through a cover that starts or opens one. A
    // team's link, from someone it doesn't know, asks who they are.
    if (!team && !unreachable) cover(...(partyKey ? ["No team by that name."] : []));
    if (team && tab === "team" && !created && Object.keys(team.applicants).length) whoCover();
    if (team) replan();
    setInterval(watch, WATCH_MS);
  } catch {
    banner(["Can't reach the rivers."]);
  }
}

begin();
</script>
