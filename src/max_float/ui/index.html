<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>max-float</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --surface: #fcfcfb; --page: #f4f3ef; --ink: #0b0b0b; --muted: #52514e;
    --line: #d9d8d1; --accent: #1c5cab; --accent-soft: #cde2fb; --critical: #b3261e;
    --away: #c0392b; --good: #0ca30c; --good-ink: #0a5c0a; --good-soft: #e6f4e6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  fieldset { border: 0; margin: 0 0 14px; padding: 0; min-width: 0; }
  legend { font-weight: 600; padding: 0; margin-bottom: 4px; }
  .page { max-width: 1500px; margin: auto; padding: 16px 16px 96px; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
  .top a { margin-left: auto; color: var(--accent); font-weight: 600; }
  /* Everything the open tab sets sits on one sheet in that tab's color, joined to
     its tab. */
  .sheet {
    background: var(--sheet, #e6e4dc); border: 2px solid var(--edge, #8a8a84);
    border-radius: 0 12px 12px 12px; padding: 16px;
  }
  .layout { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 16px; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .page { padding: 12px 8px 96px; }
    .sheet { padding: 10px; }
  }
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px; margin-bottom: 16px;
  }
  .tabs { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px; }
  .tab {
    font: inherit; font-weight: 600; color: var(--ink); background: var(--surface);
    border: 2px solid var(--line); border-bottom: 0; border-radius: 10px 10px 0 0;
    padding: 8px 18px 9px; cursor: pointer; box-shadow: inset 0 4px 0 var(--tab-ink, transparent);
    position: relative;
  }
  .tab:hover { background: var(--tab-tint, #fff); }
  .tab[aria-selected="true"] {
    background: var(--tab-tint); border-color: var(--tab-ink); padding-bottom: 11px; top: 2px; z-index: 1;
    box-shadow: inset 0 4px 0 var(--tab-ink), 0 2px 0 var(--tab-tint);
  }
  .tab:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .tab.add { font-weight: 700; padding: 8px 14px 9px; color: var(--accent); border-style: dashed; }
  .tab .check { display: inline-flex; vertical-align: -3px; margin-left: 6px; color: var(--good-ink); }
  .check svg { width: 16px; height: 16px; }
  .tab:disabled { color: #a9a8a2; cursor: not-allowed; }
  /* An applicant's tab shows a trash can to delete it when pointed at or
     focused, and always while it's open on a screen with no pointer to hover. */
  .tabwrap { position: relative; display: inline-flex; align-items: flex-end; gap: 4px; }
  .tabwrap .tab { padding-right: 34px; }
  .tab-x { position: absolute; right: 6px; top: 9px; z-index: 2; display: inline-flex; padding: 3px; border: 1px solid transparent; border-radius: 5px; background: none; color: var(--muted); cursor: pointer; opacity: 0; }
  .tab-x svg { width: 15px; height: 15px; }
  .tabwrap:hover .tab-x, .tabwrap:focus-within .tab-x, .tab-x[data-asking] { opacity: 1; }
  @media (hover: none) { .tabwrap.open .tab-x { opacity: 1; } }
  .tab-x:hover { color: var(--critical); border-color: var(--critical); }
  .tab-x:focus-visible { outline: 2px solid var(--ink); opacity: 1; }
  .tabs .asking { align-self: center; padding: 4px 8px; background: var(--surface); border-radius: 8px; font-size: 14px; }
  details.river .trip { font-weight: 400; color: var(--muted); font-size: 14px; display: inline-flex; align-items: center; gap: 4px; }
  details.river .trip input { width: 52px; font: inherit; }
  .minimum { margin: 6px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .minimum input { width: 56px; font: inherit; }
  .cover .what { font-size: 20px; margin: 0 0 4px; }
  .cover .rivers { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  input.tab { width: 160px; cursor: text; font-weight: 400; }
  .status {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 16px;
    background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--accent);
    border-radius: 8px; padding: 10px 14px;
  }
  .status .state { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--accent); }
  .status .state svg { width: 20px; height: 20px; flex: none; }
  .status .when, .status .saved { color: var(--muted); }
  .status .fill { flex: 1; }
  .locked .status { border-left-color: var(--good); background: var(--good-soft); }
  .locked .status .state { color: var(--good-ink); }
  .locked .sheet { border-color: var(--good); }
  .notice {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 16px;
    background: var(--accent-soft); border-radius: 8px; padding: 10px 14px;
  }
  .notice p { margin: 0; flex: 1 1 260px; }
  .notice .lines { flex: 1 1 260px; display: grid; gap: 6px; }
  .notice a, .cover a { color: var(--accent); font-weight: 700; word-break: break-all; }
  .status .address { word-break: break-all; }
  .status .address strong { font-weight: 700; }
  /* Before there's a team: the page shows through a cover that asks who's here. */
  .cover {
    position: fixed; inset: 0; z-index: 30; overflow: auto; padding: 24px 16px;
    display: flex; align-items: flex-start; justify-content: center;
    background: rgba(244, 243, 239, 0.5); backdrop-filter: blur(1px);
  }
  .cover .card {
    width: min(560px, 100%); margin-top: 8vh; background: var(--surface); border: 2px solid var(--accent);
    border-radius: 12px; padding: 22px 24px; box-shadow: 0 10px 40px rgba(11, 11, 11, 0.25);
  }
  .cover h2 { font-size: 20px; margin: 0 0 4px; }
  .cover p { margin: 0 0 10px; }
  .cover form { display: flex; flex-wrap: wrap; gap: 8px; }
  .cover input { font: inherit; padding: 9px 12px; border: 2px solid var(--line); border-radius: 6px; flex: 1 1 220px; min-width: 0; }
  .cover input:focus { border-color: var(--accent); outline: none; }
  .cover .or { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: var(--muted); font-weight: 600; }
  .cover .or::before, .cover .or::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
  .cover .said { margin-top: 16px; padding: 10px 14px; border-radius: 8px; background: var(--accent-soft); display: grid; gap: 6px; }
  .cover .said p { margin: 0; }
  .cover .plans { margin: 16px 0 0; display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); }
  .cover .suggested { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px; border-radius: 8px; background: var(--accent-soft); }
  .cover .suggested .team { flex: 1 1 220px; min-width: 0; }
  .cover .suggested strong { display: block; word-break: break-all; }
  .cover .suggested a.primary { text-decoration: none; display: inline-block; color: #fff; word-break: normal; }
  .cover .suggested a.primary:hover { background: #184f95; }
  .cover .suggested a.primary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .cover .suggested span { color: var(--muted); font-size: 14px; }
  /* Who is done, on the Team tab. */
  .people h2 { margin-bottom: 10px; }
  .people .options { display: flex; flex-wrap: wrap; gap: 8px; }
  .person {
    font: inherit; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--ink);
    background: #fff; border: 2px dashed var(--line); border-radius: 999px; padding: 5px 14px 5px 10px;
  }
  .person .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--person); flex: none; }
  .person strong { font-weight: 600; }
  .person .state { color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
  .person.done { border-style: solid; border-color: var(--person); background: var(--person-tint); }
  .person.done .state { color: var(--good-ink); font-weight: 600; }
  .person:hover { border-color: var(--ink); }
  .person-item { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .person-item .remove { font: inherit; font-size: 18px; line-height: 1; padding: 4px 8px; border: 1px solid transparent; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
  .person-item .remove:hover { color: var(--critical); border-color: var(--critical); }
  .person-item .remove:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  .person:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  /* While the dates are being worked out again, above the bar along the bottom. */
  .busy {
    position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 20;
    display: flex; align-items: center; gap: 10px; background: var(--ink); color: #fff;
    border-radius: 999px; padding: 9px 20px; font-weight: 700; box-shadow: 0 6px 24px rgba(11, 11, 11, 0.35);
  }
  .spinner {
    width: 18px; height: 18px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.35);
    border-top-color: #fff; animation: spin 0.8s linear infinite; flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
  .loading #out { opacity: 0.45; transition: opacity 0.15s; }
  .notice .link { font-weight: 700; word-break: break-all; }
  .notice .close { font: inherit; font-size: 20px; line-height: 1; background: none; border: 0; cursor: pointer; padding: 2px 6px; color: var(--ink); }
  /* A set of ratings: a row for each category, or for odds, flow and
     temperature, with a button for each rating and a bar of the row's share. */
  .ratings legend { display: flex; width: 100%; align-items: baseline; }
  .ratings .grid { display: grid; grid-template-columns: minmax(0, 1fr) repeat(4, 36px) 44px; align-items: center; column-gap: 2px; }
  .ratings .row { display: contents; }
  .ratings .head { font-size: 11px; color: var(--muted); text-align: center; font-weight: 600; }
  .ratings .name { line-height: 1.15; padding: 3px 0; min-width: 0; overflow-wrap: anywhere; }
  .ratings .range { display: block; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ratings .rate { height: 26px; border: 0; background: none; padding: 0; cursor: pointer; display: grid; place-items: center; }
  .ratings .rate::before { content: ""; width: 15px; height: 15px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px #a9a8a2; }
  .ratings .rate:not(:disabled):hover::before { box-shadow: inset 0 0 0 2px var(--ink); }
  .ratings .rate[aria-checked="true"]::before { background: var(--scale); box-shadow: none; }
  .ratings .rate.no[aria-checked="true"]::before { background: #8b8a84; }
  .ratings .rate:disabled { cursor: default; opacity: 0.55; }
  .ratings .rate:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; border-radius: 6px; }
  .ratings .blank .rate:not(:disabled)::before { box-shadow: inset 0 0 0 1.5px #d9a400; }
  /* The applicant's name, wherever the page says it, in their color. */
  .who { text-decoration: underline 2px var(--person); text-underline-offset: 3px; background: var(--person-tint); border-radius: 3px; padding: 0 3px; }
  /* Rivers that share an application: which river each choice is for. */
  .split { margin-top: 4px; }
  .split .grid { display: grid; grid-template-columns: minmax(0, 1fr) repeat(var(--choices), 36px); align-items: center; row-gap: 2px; }
  .split .head { font-size: 11px; color: var(--muted); text-align: center; font-weight: 600; }
  .split .name { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .split input { width: 18px; height: 18px; justify-self: center; accent-color: var(--river); cursor: pointer; }
  .split.missing legend, .split.missing .name { color: var(--critical); }
  .split.missing { border-radius: 6px; box-shadow: 0 0 0 2px var(--critical); padding: 4px 6px; }
  .missing .ratings .blank .name { color: var(--critical); font-weight: 600; }
  .missing .ratings .blank .rate::before { box-shadow: inset 0 0 0 2px var(--critical); }
  .ratings .no-share .name { color: #8b8a84; }
  .ratings .added .name { color: var(--critical); font-weight: 600; }
  .ratings .bar { height: 8px; background: #efeee9; border-radius: 4px; overflow: hidden; margin-left: 6px; }
  .ratings .bar span { display: block; height: 100%; background: var(--scale); border-radius: 4px; }
  .ratings .strip { display: block; max-width: 150px; margin-top: 3px; }
  .ratings .strip .track { display: block; position: relative; height: 6px; background: #efeee9; border-radius: 3px; overflow: hidden; }
  .ratings .strip .track span { position: absolute; top: 0; bottom: 0; background: var(--scale); min-width: 2px; }
  .ratings .strip .track i { position: absolute; top: 0; bottom: 0; width: 1px; background: #fff; }
  .ratings .strip .months { display: block; position: relative; height: 11px; font-size: 9px; line-height: 11px; color: var(--muted); }
  .ratings .strip .months span { position: absolute; top: 0; }
  .ratings .error { color: var(--critical); font-weight: 600; font-size: 13px; margin: 4px 0 0; }
  /* The Team tab shows the team's shares, not anyone's ratings. */
  .mode-team .ratings .grid { grid-template-columns: minmax(0, 1fr) 150px; }
  .mode-team .ratings .rate, .mode-team .ratings .head { display: none; }
  .mode-team .ratings .bar { height: 10px; }
  /* Until every row is rated, the preferences are the next step. */
  #preferences.unrated { border: 3px solid #d9a400; background: #fff7e0; box-shadow: 0 0 0 4px #fbe9b0; }
  #preferences h2 .step { display: none; }
  #preferences.unrated h2 { display: flex; align-items: center; gap: 10px; }
  #preferences.unrated h2 .step { display: inline-flex; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .value { font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 8px; }
  /* A river's own settings, edged in its river's color like its button above. */
  details.river { border: 1px solid var(--line); border-left: 6px solid var(--river); border-radius: 6px; padding: 6px 10px; margin-top: 6px; }
  details.river > summary { display: flex; align-items: center; gap: 7px; cursor: pointer; font-weight: 600; }
  details.river > summary::after { content: "\25B8"; margin-left: 8px; color: var(--muted); }
  details.river > summary .trip { margin-left: auto; }
  details.river[open] > summary::after { content: "\25BE"; }
  details.river .own { padding: 8px 0 4px; }
  /* A river's box is narrower than the panel, so its rows give each rating less
     room, to keep every button inside the box. */
  details.river .ratings .grid { grid-template-columns: minmax(0, 1fr) repeat(4, 29px) 30px; }
  details.river .ratings .rate::before { width: 13px; height: 13px; }
  .mode-team details.river .ratings .grid { grid-template-columns: minmax(0, 1fr) 110px; }
  .panel > .sub, #preferences .sub { margin: -4px 0 12px; color: var(--muted); font-size: 14px; }
  .days input { width: 56px; font: inherit; }
  #banner { background: var(--critical); color: #fff; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-weight: 600; }
  #banner p { margin: 0; }
  #banner p + p { margin-top: 4px; }
  /* The rivers a tab applies for, each a button in its river's color once chosen. */
  .choose h2 { margin-bottom: 10px; }
  /* With no river chosen, choosing them is the first thing to do, and it shows. */
  .choose.none { border: 3px solid #d9a400; background: #fff7e0; box-shadow: 0 0 0 4px #fbe9b0; }
  .choose.none h2 { font-size: 19px; display: flex; align-items: center; gap: 10px; }
  .choose .step {
    display: none; flex: none; width: 30px; height: 30px; border-radius: 50%; background: #d9a400; color: #fff;
    font-size: 16px; font-weight: 800; align-items: center; justify-content: center;
  }
  .choose.none .step { display: inline-flex; }
  .choose .need { display: none; margin: -2px 0 12px; font-weight: 600; color: #7a5a00; }
  .choose.none .need { display: block; }
  .choose.none .option { border-color: #d9a400; }
  .choose .error { margin: 12px 0 0; padding: 10px 14px; border-radius: 8px; background: #fde7e5; color: var(--critical); font-weight: 700; }
  .choose.wrong { border-color: var(--critical); background: #fdf1f0; box-shadow: 0 0 0 4px #f8cfcb; }
  .choose.wrong .step { background: var(--critical); }
  .choose.wrong .option { border-color: var(--critical); }
  .choose.shake { animation: shake 0.4s ease-in-out 2; }
  @keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  @media (prefers-reduced-motion: reduce) { .choose.shake { animation: none; } }
  .choose .options { display: flex; flex-wrap: wrap; gap: 8px; }
  .option {
    font: inherit; font-weight: 600; color: var(--ink); background: #fff; border: 2px solid var(--line);
    border-radius: 999px; padding: 6px 14px; cursor: pointer;
  }
  .option:hover:not(:disabled) { border-color: var(--ink); }
  .option:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .option[aria-pressed="true"] { background: var(--river); border-color: var(--river); color: var(--river-ink); }
  .option:disabled { cursor: default; }
  .option:disabled:not([aria-pressed="true"]) { opacity: 0.5; }
  .option .mates { display: inline-flex; gap: 3px; margin-left: 8px; vertical-align: 1px; }
  .option .mates span { width: 9px; height: 9px; border-radius: 50%; background: var(--mate); box-shadow: 0 0 0 1.5px #fff; }
  .primary {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 9px 22px;
    font: inherit; font-weight: 700; cursor: pointer;
  }
  .primary:hover:not(:disabled) { background: #184f95; }
  .primary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .primary:disabled { background: #a9a8a2; cursor: not-allowed; }
  /* The next step, in a bar along the bottom that the page scrolls clear of. */
  .next {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: flex-end;
    gap: 10px; padding: 10px 16px; background: var(--surface); border-top: 1px solid var(--line);
    box-shadow: 0 -4px 16px rgba(11, 11, 11, 0.08);
  }
  .next .primary, .next .secondary { font-size: 17px; padding: 11px 34px; display: inline-flex; align-items: center; gap: 8px; }
  .next .finished:disabled { color: var(--good-ink); background: var(--good-soft); border: 2px solid var(--good); cursor: default; }
  #lock:not(:disabled) { animation: glow 1.8s ease-in-out infinite; }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(28, 92, 171, 0.45); }
    50% { box-shadow: 0 0 0 10px rgba(28, 92, 171, 0); }
  }
  @media (prefers-reduced-motion: reduce) { #lock:not(:disabled) { animation: none; outline: 3px solid var(--accent-soft); } }
  @media (max-width: 860px) { .next { padding: 8px; } .next .primary, .next .secondary { padding: 10px 16px; font-size: 16px; } }
  /* How many other teams are locked in for a river, on its button. */
  .option .others:empty { display: none; }
  .option .others { display: inline-flex; align-items: center; gap: 2px; margin-left: 8px; font-size: 13px; font-weight: 700; opacity: 0.8; }
  .option .others svg { width: 13px; height: 13px; }
  .months { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 18px; }
  .month h3 { font-size: 14px; margin: 0 0 4px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .weekday { text-align: center; font-size: 11px; color: var(--muted); }
  .day {
    min-height: 34px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink);
    font: inherit; font-size: 12px; line-height: 1; padding: 3px 1px; cursor: pointer;
    display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 2px;
  }
  .day:hover { outline: 2px solid var(--ink); }
  .day:focus-visible { outline: 2px solid var(--ink); }
  .mode-team .day, .locked .day { cursor: default; }
  .mode-team .day:hover, .locked .day:hover { outline: 0; }
  .day.off { background: transparent; border-color: transparent; color: #b5b4ae; }
  .day.away { background: var(--away); border-color: var(--away); color: #fff; text-decoration: line-through; }
  .day.some { background: #f6d3cf; border-color: #eab2ab; }
  .day .count {
    display: block; font-size: 9px; font-weight: 700; color: #fff; background: var(--away);
    border-radius: 3px; padding: 2px 0; text-align: center; text-decoration: none;
  }
  .day.away .count { background: #fff; color: var(--ink); }
  .chip {
    display: block; border-radius: 3px; padding: 2px 0; font-size: 9px; font-weight: 700;
    letter-spacing: 0.02em; text-align: center; text-decoration: none;
  }
  .chip .others { margin-left: 2px; font-weight: 800; }
  .key { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 14px; font-size: 13px; }
  .key span.river, .key span.shade { display: inline-flex; align-items: center; gap: 6px; }
  .key .day { min-height: 0; width: 18px; height: 14px; padding: 0; cursor: default; }
  .key .day:hover { outline: 0; }
  .key .day.off { border: 1px dashed #c9c7bf; }
  .key .draft { margin-left: 8px; }
  .day-info { margin: 10px 0 0; font-size: 14px; min-height: 1.4em; }
  .day-info strong { margin-right: 6px; }
  .key .chip { width: 30px; }
  #out.stale { opacity: 0.5; }
  .heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .heading h2 { margin: 0; }
  .heading .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
  .secondary {
    font: inherit; font-weight: 600; color: var(--accent); background: #fff; border: 1px solid var(--line);

  .danger { color: var(--critical); }

  /* A question in place of the button that asked it: yes, or keep things. */
  .info { position: relative; display: inline-flex; vertical-align: 1px; margin-left: 6px; }
  .info button {
    width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--accent); background: #fff;
    color: var(--accent); font: inherit; font-size: 13px; font-weight: 700; line-height: 1; padding: 0; cursor: help;
  }

  .asking { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; font-weight: 600; }
  .asking .yes { background: var(--critical); color: #fff; border-color: var(--critical); }
  /* A short definition that opens on hover or focus. */

  .headline .overlap { flex-basis: 100%; font-size: 14px; }
  .headline strong { font-size: 34px; line-height: 1.1; color: var(--ink); font-variant-numeric: tabular-nums; }
  /* Once locked in: each applicant's applications, a lottery at a time, in the

  .applications { border: 2px solid var(--good); }
  .applications tr.apart td { background: #fff4dc; }
  .applications td.applicant { white-space: nowrap; }
  .applications h3 { font-size: 14px; margin: 0; display: flex; align-items: center; gap: 8px; }
  .applications .swatch { display: inline-block; }
  .applications td.choice { font-weight: 700; width: 4em; }
  .applications td.applicant + td.choice { width: 3.5em; }
  .applications td:nth-child(-n+3) { white-space: nowrap; }
  .drafts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .drafts button { font: inherit; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 8px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; box-shadow: inset 3px 0 0 var(--river); }
  .drafts button:hover { border-color: var(--ink); }
  .drafts button svg, .applications td.date svg, .key .draft svg, .chip svg { width: 12px; height: 12px; flex: none; }
  .chip svg { width: 8px; height: 8px; vertical-align: -1px; margin-right: 1px; }
  .key .draft { display: inline-flex; align-items: center; gap: 4px; }
  .applications td.date svg { vertical-align: -1px; margin-right: 5px; color: var(--good-ink); }
  .drafts button[aria-pressed="true"] { border-color: var(--ink); background: #f1f0ec; font-weight: 700; }
  .drafts button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .sample { position: relative; }
  .sample h3 { font-size: 14px; margin: 4px 0 0; }
  .preview { position: absolute; z-index: 15; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; box-shadow: 0 8px 24px rgba(11, 11, 11, 0.2); width: min(560px, calc(100% - 16px)); pointer-events: none; }
  .preview strong.title { display: block; font-size: 13px; margin-bottom: 2px; }
  .preview .years { zoom: 0.7; }
  .cover .who { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .cover .who .person { font-size: 17px; padding: 8px 18px 8px 14px; }
  .cover .why { color: var(--muted); margin: 0 0 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .river-launches { border-top: 1px solid var(--line); padding: 8px 0; overflow-x: auto; }
  .river-launches > summary { cursor: pointer; font-weight: 600; }
  .river-launches > summary .swatch { display: inline-block; margin: 0 8px -1px 0; }
  .river-launches.widened > summary { color: var(--critical); }
  .river-launches tr.launch { cursor: pointer; }
  .river-launches tr.launch:hover td, .river-launches tr.launch:focus-visible td { background: #f1f0ec; }
  .river-launches tr.launch td:first-child::before { content: "\25B8"; display: inline-block; width: 14px; color: var(--muted); }
  .river-launches tr.launch[aria-expanded="true"] td:first-child::before { content: "\25BE"; }

  .years .year { flex: 1 0 54px; display: flex; flex-direction: column; align-items: center; font-size: 12px; }
  .years .captions { flex: 0 0 auto; align-items: flex-start; position: sticky; left: 0; background: var(--surface); padding-right: 10px; color: var(--muted); z-index: 1; }
  .years strong { font-size: 13px; height: 20px; }
  .years .track { position: relative; width: 100%; height: 92px; }
  .years .track.flow { height: 76px; }
  .years .track.odds { height: 72px; }
  .years .dot { position: absolute; left: 50%; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; box-shadow: 0 0 0 1.5px var(--surface); }
  .years .odds-key { flex-direction: column; align-items: flex-start !important; gap: 2px; font-size: 11px; }
  .years .key-item { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .years .key-item .swatch { width: 8px; height: 8px; border-radius: 50%; }
  .years .bar { position: absolute; left: 50%; width: 4px; margin-left: -2px; border-radius: 2px; }
  .years .track.flow .bar { width: 18px; margin-left: -9px; border-radius: 4px 4px 0 0; min-height: 2px; bottom: 0; }
  .years .value { position: absolute; left: 0; right: 0; text-align: center; line-height: 14px; }
  .years .value.none { top: 50%; margin-top: -7px; color: var(--muted); }
  .years .category { height: 28px; color: var(--muted); text-align: center; line-height: 14px; margin-bottom: 6px; }
  .years .captions .track, .years .captions .category, .years .captions strong { width: auto; display: flex; align-items: center; }
  .river-launches .count { font-weight: 400; color: var(--muted); margin-left: 6px; }
  table { border-collapse: collapse; width: 100%; margin-top: 6px; }
  th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; }
  th, td { padding: 5px 12px 5px 0; border-bottom: 1px solid var(--line); }
  td.number, th.number { text-align: right; font-variant-numeric: tabular-nums; }
  td:first-child { box-shadow: inset 4px 0 0 var(--river); }
  td:first-child, th:first-child { padding-left: 10px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart text { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .chart .tick { fill: var(--muted); font-size: 12px; }
  .chart .total { font-weight: 700; }
  .chart .row:hover .band { fill: #eceae4; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; margin-bottom: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }

    position: absolute; z-index: 4; pointer-events: none; background: #fff; border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 10px; font-size: 13px; box-shadow: 0 4px 14px rgba(11, 11, 11, 0.14);

<body>
<div class="page">
  <header class="top"><h1>max-float</h1><a href="/">Change team</a></header>
  <nav class="tabs" id="tabs" aria-label="Applicants"></nav>
  <div class="sheet" id="sheet">
    <div class="status" id="status" hidden>
      <span class="state" id="state"></span>
      <span class="when" id="when"></span>
      <span class="saved" id="saved"></span>
      <span class="fill"></span>
      <span class="address" id="address"></span>
      <button type="button" class="secondary" id="copy">Copy link</button>
      <button type="button" class="secondary" id="unlock">Unlock</button>
    </div>
    <div class="notice" id="notice" role="status" hidden></div>
    <div id="banner" role="alert" hidden></div>
    <section class="panel applications" id="listed" hidden>
      <div class="heading">
        <h2 id="listed-title">Your applications</h2>
        <div class="actions">
          <button type="button" class="secondary" id="copy-list">Copy</button>
          <button type="button" class="secondary" id="download">Download CSV</button>
        </div>
      </div>
      <div id="results"></div>
    </section>
    <section class="panel people" id="people" hidden>
      <h2 id="people-title"></h2>
      <div class="options" id="people-list"></div>
    </section>
    <section class="panel choose" id="choose">
      <h2><span class="step" aria-hidden="true">1</span><span id="choose-title"></span></h2>
      <p class="need" id="choose-need"></p>
      <div class="options" id="options"></div>
      <p class="error" id="choose-error" role="alert" hidden></p>
    </section>
    <div class="layout">
      <aside>
        <div class="panel" id="preferences"></div>
        <div class="panel" id="rivers-panel"><h2 id="rivers-title"></h2><div id="rivers"></div></div>
      </aside>
      <main>
        <section class="panel">
          <div class="heading">
            <h2 id="calendar-title"></h2>
            <div class="actions">
              <button type="button" class="secondary danger" id="clear-dates">Clear dates</button>
            </div>
          </div>
          <p class="sub" id="calendar-sub"></p>
          <div class="months" id="calendar"></div>
          <div class="key" id="key"></div>
          <p class="day-info" id="day-info" aria-live="polite"></p>
        </section>
        <div id="out" hidden>
          <section class="panel">
            <h2 id="odds-title">Odds of at least one permit</h2>
