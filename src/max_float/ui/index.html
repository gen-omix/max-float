<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>max-float</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --surface: #fcfcfb; --page: #f4f3ef; --ink: #0b0b0b; --muted: #52514e;
    --line: #d9d8d1; --accent: #1c5cab; --accent-soft: #cde2fb; --critical: #b3261e;
    --away: #52514e;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  fieldset { border: 0; margin: 0 0 14px; padding: 0; min-width: 0; }
  legend { font-weight: 600; padding: 0; margin-bottom: 4px; }
  .layout {
    display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px;
    padding: 16px; max-width: 1500px; margin: auto;
  }
  @media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .panel {
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
    padding: 14px; margin-bottom: 16px;
  }
  .checks { display: flex; flex-wrap: wrap; gap: 2px 12px; }
  .checks label { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .checks label.added { color: var(--critical); font-weight: 600; }
  .pie { display: flex; align-items: center; gap: 14px; }
  .pie svg { width: 124px; height: 124px; flex: none; touch-action: none; cursor: pointer; }
  .pie path { stroke: var(--surface); stroke-width: 2; outline: none; }
  .pie path:focus-visible { stroke: var(--ink); }
  .brushes { display: grid; gap: 4px; }
  .brush {
    display: flex; align-items: center; gap: 7px; font: inherit; color: var(--ink); background: none;
    border: 1px solid transparent; border-radius: 6px; padding: 3px 8px 3px 5px; cursor: pointer; text-align: left;
  }
  .brush[aria-pressed="true"] { border-color: var(--ink); font-weight: 600; }
  .brush:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .value { font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 8px; }
  details.river { border-top: 1px solid var(--line); padding: 5px 0; }
  details.river > summary { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  details.river > summary::after { content: "\25B8"; margin-left: auto; color: var(--muted); }
  details.river[open] > summary::after { content: "\25BE"; }
  details.river .own { padding: 8px 0 4px 2px; }
  .days input { width: 56px; font: inherit; }
  #banner { background: var(--critical); color: #fff; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; font-weight: 600; }
  #banner p { margin: 0; }
  #banner p + p { margin-top: 4px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 14px; }
  .toolbar .fill { flex: 1; }
  .picker { position: relative; }
  .picker summary {
    list-style: none; cursor: pointer; border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 12px; min-width: 220px; display: flex; justify-content: space-between; gap: 12px;
    background: #fff;
  }
  .picker summary::-webkit-details-marker { display: none; }
  .picker summary::after { content: "\25BE"; color: var(--muted); }
  .picker .menu {
    position: absolute; z-index: 5; top: calc(100% + 4px); left: 0; min-width: 280px;
    background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px;
    box-shadow: 0 4px 14px rgba(11, 11, 11, 0.14);
  }
  .picker label { display: flex; align-items: center; gap: 7px; padding: 4px 0; cursor: pointer; }
  .picker label.all { border-bottom: 1px solid var(--line); padding-bottom: 7px; margin-bottom: 3px; font-weight: 600; }
  #submit {
    background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 9px 26px;
    font: inherit; font-weight: 700; cursor: pointer;
  }
  #submit:hover:not(:disabled) { background: #184f95; }
  #submit:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  #submit:disabled { background: #a9a8a2; cursor: not-allowed; }
  .months { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 18px; }
  .month h3 { font-size: 14px; margin: 0 0 4px; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .weekday { text-align: center; font-size: 11px; color: var(--muted); }
  .day {
    min-height: 34px; border: 0; border-radius: 4px; background: #eceae4; color: var(--ink);
    font: inherit; font-size: 12px; line-height: 1; padding: 3px 1px; cursor: pointer;
    display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 2px;
  }
  .day:hover { outline: 2px solid var(--ink); }
  .day:focus-visible { outline: 2px solid var(--ink); }
  .day.off { background: transparent; color: #8b8a84; }
  .day.away { background: var(--away); color: #fff; text-decoration: line-through; }
  .chip {
    display: block; border-radius: 3px; padding: 2px 0; font-size: 9px; font-weight: 700;
    letter-spacing: 0.02em; text-align: center; text-decoration: none;
  }
  .key { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 14px; font-size: 13px; }
  .key span.river { display: inline-flex; align-items: center; gap: 6px; }
  .key .chip { width: 30px; }
  #out.stale { opacity: 0.5; }
  .heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .heading h2 { margin: 0; }
  .secondary {
    font: inherit; font-weight: 600; color: var(--accent); background: #fff; border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 14px; cursor: pointer;
  }
  .secondary:hover { border-color: var(--accent); }
  .secondary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .river-launches { border-top: 1px solid var(--line); padding: 8px 0; overflow-x: auto; }
  .river-launches > summary { cursor: pointer; font-weight: 600; }
  .river-launches > summary .swatch { display: inline-block; margin: 0 8px -1px 0; }
  .river-launches.widened > summary { color: var(--critical); }
  .river-launches .count { font-weight: 400; color: var(--muted); margin-left: 6px; }
  table { border-collapse: collapse; width: 100%; margin-top: 6px; }
  th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; }
  th, td { padding: 5px 12px 5px 0; border-bottom: 1px solid var(--line); }
  td.number, th.number { text-align: right; font-variant-numeric: tabular-nums; }
  td:first-child { box-shadow: inset 4px 0 0 var(--river); }
  td:first-child, th:first-child { padding-left: 10px; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart text { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .chart .tick { fill: var(--muted); font-size: 12px; }
  .chart .total { font-weight: 700; }
  .chart .row:hover .band { fill: #eceae4; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; margin-bottom: 6px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .tip {
    position: absolute; z-index: 4; pointer-events: none; background: #fff; border: 1px solid var(--line);
    border-radius: 6px; padding: 7px 10px; font-size: 13px; box-shadow: 0 4px 14px rgba(11, 11, 11, 0.14);
    white-space: nowrap;
  }
  .tip strong { display: block; margin-bottom: 2px; }
  .tip .value { margin-left: 0; padding-left: 12px; float: right; }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="panel">
      <h1>max-float</h1>
    </div>
    <div class="panel" id="preferences"></div>
    <div class="panel"><h2>Rivers</h2><div id="rivers"></div></div>
  </aside>
  <main>
    <div id="banner" role="alert" hidden></div>
    <section class="panel">
      <h2>Unavailable dates</h2>
      <div class="toolbar">
        <details class="picker" id="picker"></details>
        <div class="fill"></div>
        <button type="button" id="submit">Submit</button>
      </div>
      <div class="months" id="calendar"></div>
      <div class="key" id="key" hidden></div>
    </section>
    <div id="out" hidden>
      <section class="panel">
        <div class="heading"><h2>Recommended launches</h2><button type="button" class="secondary" id="download">Download CSV</button></div>
        <div id="results"></div>
      </section>
      <section class="panel">
        <h2>Odds of at least one permit</h2>
        <div class="chart" id="odds"></div>
      </section>
    </div>
  </main>
</div>
<script>
const state = { flow: new Set(), temperature: new Set(), priority: null, rivers: {}, away: new Set() };
const empty = { launches: [], odds: [], widened: {}, unavailable: [] };
let scales = {}, rivers = [], latest = 0, plan = empty;
// Each river's launch dates. A day with none for a chosen river is shaded off.
const launchDates = {};
const syncs = [];
const opened = new Set();
// What a priority's slices can go to, in the order the pie shows them.
const PARTS = [
  { name: "odds", label: "Odds", color: "#1baf7a" },
  { name: "flow", label: "Flow", color: "#2a78d6" },
  { name: "temperature", label: "Temperature", color: "#eb6834" },
];
const SERIES = { recommended: "#2a78d6", random: "#eb6834" };
// Each river keeps its color whichever rivers are chosen, in the order of `rivers`.
const COLORS = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#9c2f7e", "#8a8a84", "#8a5a2b"];

function el(tag, attributes = {}, ...children) {
  const node = document.createElement(tag);
  for (const [name, value] of Object.entries(attributes)) {
    if (name === "class") node.className = value;
    else if (name in node) node[name] = value;
    else node.setAttribute(name, value);
  }
  node.append(...children);
  return node;
}

const same = (a, b) => a.size === b.size && [...a].every((step) => b.has(step));
const percent = (odds) => `${(odds * 100).toFixed(1)}%`;
const chosen = () => rivers.filter((river) => state.rivers[river.name].on);

// Something changed that the shown launches don't reflect until Submit.
function edited() {
  sync();
  document.getElementById("out").classList.add("stale");
}

// A row of checkboxes for one scale. `get` gives the checked steps, `set` stores
// new ones, and `added` gives any steps widening added.
function scale(title, names, get, set, added = () => []) {
  const boxes = names.map((name, step) => {
    const box = el("input", { type: "checkbox" });
    const label = el("label", {}, box, name);
    box.addEventListener("change", () => {
      const next = new Set(get());
      box.checked ? next.add(step) : next.delete(step);
      if (next.size === 0) { box.checked = true; return; }
      set(next);
      edited();
    });
    return { box, label, step };
  });
  syncs.push(() => {
    const checked = get(), widened = added();
    for (const { box, label, step } of boxes) {
      box.checked = checked.has(step);
      label.classList.toggle("added", widened.includes(step));
    }
  });
  return el("fieldset", {}, el("legend", {}, title), el("div", { class: "checks" }, ...boxes.map(({ label }) => label)));
}

const samePriority = (a, b) => PARTS.every(({ name }) => a[name] === b[name]);
const SVG = "http://www.w3.org/2000/svg";

function svg(tag, attributes = {}, ...children) {
  const node = document.createElementNS(SVG, tag);
  for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value);
  node.append(...children);
  return node;
}

// The priority as a pie of slices. Pick odds, flow or temperature, then click or
// drag across slices, or press Enter on them, to give them to it. The slices
// regroup when a drag ends or focus leaves the pie.
function pie(get, set) {
  const total = () => PARTS.reduce((sum, { name }) => sum + get()[name], 0);
  const slices = total();
  let brush = PARTS[0].name, painting = null;
  const wedges = [];
  const radius = 58;
  const point = (angle) => [radius * Math.sin(angle), -radius * Math.cos(angle)];
  const chart = svg("svg", { viewBox: "-60 -60 120 120", role: "group", "aria-label": "priority" });
  for (let slice = 0; slice < slices; slice += 1) {
    const [x1, y1] = point((2 * Math.PI * slice) / slices);
    const [x2, y2] = point((2 * Math.PI * (slice + 1)) / slices);
    const wedge = svg("path", { d: `M0 0L${x1} ${y1}A${radius} ${radius} 0 0 1 ${x2} ${y2}Z`, tabindex: 0, role: "button" });
    wedge.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      paint(slice);
    });
    wedges.push(wedge);
    chart.append(wedge);
  }
  const grouped = () => PARTS.flatMap(({ name }) => Array(get()[name]).fill(name));
  function paint(slice) {
    painting ??= grouped();
    if (painting[slice] === brush) return;
    painting[slice] = brush;
    const next = Object.fromEntries(PARTS.map(({ name }) => [name, painting.filter((part) => part === name).length]));
    set(next);
    edited();
  }
  function at(event) {
    const box = chart.getBoundingClientRect();
    const x = event.clientX - box.left - box.width / 2, y = event.clientY - box.top - box.height / 2;
    if (Math.hypot(x, y) > box.width / 2) return null;
    const angle = (Math.atan2(x, -y) + 2 * Math.PI) % (2 * Math.PI);
    return Math.min(slices - 1, Math.floor((angle / (2 * Math.PI)) * slices));
  }
  chart.addEventListener("pointerdown", (event) => {
    const slice = at(event);
    if (slice === null) return;
    chart.setPointerCapture(event.pointerId);
    paint(slice);
  });
  chart.addEventListener("pointermove", (event) => {
    if (painting === null || !chart.hasPointerCapture(event.pointerId)) return;
    const slice = at(event);
    if (slice !== null) paint(slice);
  });
  const done = () => { if (painting) { painting = null; sync(); } };
  chart.addEventListener("pointerup", done);
  chart.addEventListener("pointercancel", done);
  chart.addEventListener("focusout", (event) => { if (!chart.contains(event.relatedTarget)) done(); });
  const brushes = PARTS.map((part) => {
    const count = el("span", { class: "value" });
    const button = el("button", { type: "button", class: "brush" }, el("span", { class: "swatch" }), part.label, count);
    button.firstChild.style.background = part.color;
    button.addEventListener("click", () => { brush = part.name; sync(); });
    return { part, button, count };
  });
  syncs.push(() => {
    const parts = painting ?? grouped();
    wedges.forEach((wedge, slice) => {
      const part = PARTS.find(({ name }) => name === parts[slice]);
      wedge.setAttribute("fill", part.color);
      wedge.setAttribute("aria-label", `slice ${slice + 1} of ${slices}: ${part.label}`);
    });
    for (const { part, button, count } of brushes) {
      count.textContent = get()[part.name];
      button.setAttribute("aria-pressed", brush === part.name);
    }
  });
  return el("fieldset", {}, el("legend", {}, "Priority"),
    el("div", { class: "pie" }, chart, el("div", { class: "brushes" }, ...brushes.map(({ button }) => button))));
}

function preferencesPanel() {
  document.getElementById("preferences").append(
    scale("Flow", scales.flow, () => state.flow, (next) => { state.flow = next; }),
    scale("Temperature", scales.temperature, () => state.temperature, (next) => { state.temperature = next; }),
    pie(() => state.priority, (next) => { state.priority = next; }),
  );
}

function hasOwn(river) {
  return river.flow !== null || river.temperature !== null || river.priority !== null || river.days !== null;
}

function riverRow(river) {
  const own = state.rivers[river.name];
  const days = el("input", { type: "number", min: 1, max: river.max_trip_days, value: river.max_trip_days });
  days.addEventListener("change", () => {
    const value = Math.min(river.max_trip_days, Math.max(1, Number(days.value) || river.max_trip_days));
    days.value = value;
    own.days = value === river.max_trip_days ? null : value;
    settle();
    edited();
  });
  const details = el("details", { class: "river" },
    el("summary", {}, river.name),
    el("div", { class: "own" },
      el("fieldset", { class: "days" }, el("legend", {}, "Days"), days),
      scale("Flow", scales.flow, () => own.flow ?? state.flow, (next) => {
        own.flow = same(next, state.flow) ? null : next; settle();
      }, () => plan.widened[river.name]?.flow ?? []),
      scale("Temperature", scales.temperature, () => own.temperature ?? state.temperature, (next) => {
        own.temperature = same(next, state.temperature) ? null : next; settle();
      }, () => plan.widened[river.name]?.temperature ?? []),
      pie(() => own.priority ?? state.priority, (next) => {
        own.priority = samePriority(next, state.priority) ? null : next; settle();
      }),
    ));
  // A river with preferences of its own, or widened, stays open. Once it's neither,
  // it closes again.
  let held = false;
  function settle() {
    const now = hasOwn(own) || Boolean(plan.widened[river.name]);
    if (now) details.open = true;
    else if (held) details.open = false;
    held = now;
  }
  details.addEventListener("toggle", () => {
    if (!details.open && (hasOwn(own) || plan.widened[river.name])) details.open = true;
  });
  syncs.push(settle);
  syncs.push(() => { details.hidden = !own.on; });
  return details;
}

// The dropdown of rivers: any number of them, or all.
function picker() {
  const root = document.getElementById("picker");
  const label = el("span");
  const all = el("input", { type: "checkbox" });
  all.addEventListener("change", () => {
    for (const river of rivers) state.rivers[river.name].on = all.checked;
    edited();
  });
  const boxes = rivers.map((river) => {
    const box = el("input", { type: "checkbox" });
    box.addEventListener("change", () => { state.rivers[river.name].on = box.checked; edited(); });
    return { box, river, label: el("label", {}, box, river.name) };
  });
  root.append(
    el("summary", {}, label),
    el("div", { class: "menu" }, el("label", { class: "all" }, all, "All rivers"), ...boxes.map((item) => item.label)),
  );
  document.addEventListener("click", (event) => { if (!root.contains(event.target)) root.open = false; });
  document.addEventListener("keydown", (event) => { if (event.key === "Escape") root.open = false; });
  syncs.push(() => {
    const on = chosen();
    for (const { box, river } of boxes) box.checked = state.rivers[river.name].on;
    all.checked = on.length === rivers.length;
    all.indeterminate = on.length > 0 && on.length < rivers.length;
    label.textContent = on.length === rivers.length ? "All rivers"
      : on.length === 0 ? "No rivers"
      : on.length <= 2 ? on.map((river) => river.name).join(", ")
      : `${on.length} rivers`;
    document.getElementById("submit").disabled = on.length === 0;
  });
}

function colorOf(riverName) {
  return COLORS[rivers.findIndex((river) => river.name === riverName) % COLORS.length];
}

// Ink or white, whichever is easier to read on a color.
function inkOn(color) {
  const channel = (start) => {
    const value = parseInt(color.slice(start, start + 2), 16) / 255;
    return value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4;
  };
  const light = 0.2126 * channel(1) + 0.7152 * channel(3) + 0.0722 * channel(5);
  return (light + 0.05) ** 2 > 1.05 * 0.05 ? "#0b0b0b" : "#ffffff";
}

function chip(river) {
  const node = el("span", { class: "chip" }, river.code);
  const color = colorOf(river.name);
  node.style.background = color;
  node.style.color = inkOn(color);
  return node;
}

function calendar() {
  const starts = rivers.map((river) => river.season_start), ends = rivers.map((river) => river.season_end);
  const first = starts.reduce((a, b) => (a < b ? a : b)), last = ends.reduce((a, b) => (a > b ? a : b));
  const year = Number(first.slice(0, 4));
  const root = document.getElementById("calendar");
  const cells = [];
  for (let month = Number(first.slice(5, 7)); month <= Number(last.slice(5, 7)); month += 1) {
    const grid = el("div", { class: "grid" });
    for (const name of ["M", "T", "W", "T", "F", "S", "S"]) grid.append(el("div", { class: "weekday" }, name));
    const pad = (new Date(Date.UTC(year, month - 1, 1)).getUTCDay() + 6) % 7;
    for (let i = 0; i < pad; i += 1) grid.append(el("div"));
    const count = new Date(Date.UTC(year, month, 0)).getUTCDate();
    for (let day = 1; day <= count; day += 1) {
      const date = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      const button = el("button", { type: "button", class: "day" }, String(day));
      button.addEventListener("click", () => {
        state.away.has(date) ? state.away.delete(date) : state.away.add(date);
        edited();
      });
      cells.push({ button, date, day });
      grid.append(button);
    }
    const title = new Date(Date.UTC(year, month - 1, 1)).toLocaleString("en-US", { month: "long", year: "numeric", timeZone: "UTC" });
    root.append(el("div", { class: "month" }, el("h3", {}, title), grid));
  }
  syncs.push(() => {
    const byDate = {};
    for (const launch of plan.launches) (byDate[launch.date] ??= []).push(launch);
    const on = chosen();
    for (const { button, date, day } of cells) {
      const away = state.away.has(date);
      const found = (byDate[date] ?? []).sort((a, b) => b.odds - a.odds);
      button.className = "day";
      if (away) button.classList.add("away");
      else if (!on.some((river) => launchDates[river.name].has(date))) button.classList.add("off");
      button.replaceChildren(String(day));
      if (!away) {
        for (const launch of found) button.append(chip({ name: launch.river, code: launch.code }));
      }
      button.setAttribute("aria-pressed", away);
      const lines = found.map((launch) => `${launch.river} ${percent(launch.odds)}`);
      button.title = lines.join("\n");
      button.setAttribute("aria-label", [date, away ? "unavailable" : null, ...lines].filter(Boolean).join(", "));
    }
  });
}

function key() {
  const root = document.getElementById("key");
  const items = rivers.map((river) => ({ river, node: el("span", { class: "river" }, chip(river), river.name) }));
  root.append(el("strong", {}, "Recommended"), ...items.map(({ node }) => node));
  syncs.push(() => {
    const shown = new Set(plan.launches.map((launch) => launch.river));
    for (const { river, node } of items) node.hidden = !shown.has(river.name);
    root.hidden = shown.size === 0;
  });
}

const dateName = (date) => new Date(`${date}T00:00:00Z`).toLocaleString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });

// Each river's recommended launches, closed until opened. A river stays open
// across submits.
function results() {
  const byRiver = new Map();
  for (const launch of plan.launches) {
    if (!byRiver.has(launch.river)) byRiver.set(launch.river, []);
    byRiver.get(launch.river).push(launch);
  }
  document.getElementById("results").replaceChildren(...[...byRiver].map(([river, launches]) => {
    const widened = launches[0].widened;
    const rows = launches.map((launch) => {
      const row = el("tr", {},
        el("td", {}, `${launch.weekday.slice(0, 3)} ${dateName(launch.date)}`),
        el("td", { class: "number" }, percent(launch.odds)),
        el("td", {}, launch.flow_typical),
        el("td", {}, launch.temperature_typical));
      row.style.setProperty("--river", colorOf(river));
      return row;
    });
    const swatch = el("span", { class: "swatch" });
    swatch.style.background = colorOf(river);
    const details = el("details", { class: `river-launches${widened ? " widened" : ""}`, open: opened.has(river) },
      el("summary", {}, swatch, `${river}${widened ? " (widened)" : ""}`,
        el("span", { class: "count" }, `${launches.length} launch${launches.length === 1 ? "" : "es"}`)),
      el("table", {},
        el("thead", {}, el("tr", {}, el("th", {}, "Date"), el("th", { class: "number" }, "Odds"), el("th", {}, "Typical flow"), el("th", {}, "Typical temperature"))),
        el("tbody", {}, ...rows)));
    details.addEventListener("toggle", () => { details.open ? opened.add(river) : opened.delete(river); });
    return details;
  }));
  document.getElementById("download").disabled = plan.launches.length === 0;
}

const COLUMNS = ["river", "code", "date", "weekday", "odds", "flow_typical", "temperature_typical", "widened"];

function download() {
  const cell = (value) => (/[",\n]/.test(String(value)) ? `"${String(value).replaceAll('"', '""')}"` : String(value));
  const lines = [COLUMNS.join(","), ...plan.launches.map((launch) => COLUMNS.map((column) => cell(launch[column])).join(","))];
  const link = el("a", { href: URL.createObjectURL(new Blob([`${lines.join("\n")}\n`], { type: "text/csv" })), download: "max-float-recommended.csv" });
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(link.href));
}

const times = (ratio) => `${ratio >= 10 ? ratio.toFixed(0) : ratio.toFixed(1)}×`;

// The odds with the recommended launches and with launches at random, each as a
// multiple of the odds with the most common launches, for all rivers then each.
function oddsChart() {
  const root = document.getElementById("odds");
  const rows = plan.odds.filter((row) => row.common > 0).map((row) => ({
    ...row,
    name: row.river ?? "All rivers",
    lift: { recommended: row.recommended / row.common, random: row.random / row.common },
  }));
  if (rows.length === 0) { root.replaceChildren(); return; }
  const width = Math.max(root.clientWidth, 300);
  const labels = Math.min(190, width * 0.38), right = 44, top = 26, rowHeight = 30, axis = 44;
  const ratios = rows.flatMap((row) => [row.lift.recommended, row.lift.random]).filter((ratio) => ratio > 0);
  const low = Math.min(-1, Math.floor(Math.log2(Math.min(...ratios)))), high = Math.max(1, Math.ceil(Math.log2(Math.max(...ratios))));
  const step = (width - labels - right) / (high - low) < 36 ? 2 : 1;
  const x = (ratio) => labels + ((Math.log2(Math.max(ratio, 2 ** low)) - low) / (high - low)) * (width - labels - right);
  const height = top + rows.length * rowHeight + axis;
  const chart = svg("svg", { viewBox: `0 0 ${width} ${height}`, height, role: "img",
    "aria-label": rows.map((row) => `${row.name}: recommended ${times(row.lift.recommended)}, random ${times(row.lift.random)} the most common dates`).join("; ") });
  for (let power = low; power <= high; power += 1) {
    if (power % step !== 0) continue;
    const at = x(2 ** power);
    chart.append(
      svg("line", { x1: at, x2: at, y1: top, y2: height - axis + 4, stroke: "#e6e5df" }),
      svg("text", { x: at, y: height - axis + 20, "text-anchor": "middle", class: "tick" }, power >= 0 ? `${2 ** power}×` : `1/${2 ** -power}×`),
    );
  }
  chart.append(svg("text", { x: (labels + width - right) / 2, y: height - 6, "text-anchor": "middle", class: "tick" }, "× the odds with the most common dates"));
  const tip = el("div", { class: "tip", hidden: true });
  rows.forEach((row, index) => {
    const y = top + index * rowHeight + rowHeight / 2;
    const group = svg("g", { class: "row" },
      svg("rect", { class: "band", x: 0, y: y - rowHeight / 2, width, height: rowHeight, fill: "transparent", rx: 4 }),
      svg("text", { x: 8, y: y + 4, class: row.river === null ? "total" : "" }, row.name),
      svg("line", { x1: x(Math.min(row.lift.random, row.lift.recommended)), x2: x(Math.max(row.lift.random, row.lift.recommended)), y1: y, y2: y, stroke: "#a9a8a2", "stroke-width": 2 }),
      svg("circle", { cx: x(row.lift.random), cy: y, r: 6, fill: SERIES.random, stroke: "var(--surface)", "stroke-width": 2 }),
      svg("circle", { cx: x(row.lift.recommended), cy: y, r: 6, fill: SERIES.recommended, stroke: "var(--surface)", "stroke-width": 2 }));
    if (row.river === null) {
      group.append(svg("text", { x: x(row.lift.recommended) + 11, y: y + 4, class: "total" }, times(row.lift.recommended)));
      if (rows.length > 1) chart.append(svg("line", { x1: 0, x2: width, y1: y + rowHeight / 2, y2: y + rowHeight / 2, stroke: "var(--line)" }));
    }
    group.addEventListener("pointermove", (event) => {
      const line = (name, value, color, ratio) => {
        const swatch = el("span", { class: "dot" });
        if (color) swatch.style.background = color;
        return el("div", { class: "legend" }, el("span", {}, color ? swatch : "", name), el("span", { class: "value" }, `${percent(value)}${ratio ? ` · ${times(ratio)}` : ""}`));
      };
      tip.replaceChildren(el("strong", {}, row.name),
        line("Recommended", row.recommended, SERIES.recommended, row.lift.recommended),
        line("Random", row.random, SERIES.random, row.lift.random),
        line("Most common", row.common));
      tip.hidden = false;
      const box = root.getBoundingClientRect();
      const left = Math.min(event.clientX - box.left + 14, box.width - tip.offsetWidth);
      tip.style.left = `${Math.max(0, left)}px`;
      tip.style.top = `${event.clientY - box.top + 14}px`;
    });
    group.addEventListener("pointerleave", () => { tip.hidden = true; });
    chart.append(group);
  });
  const baseline = x(1);
  chart.append(
    svg("line", { x1: baseline, x2: baseline, y1: top - 6, y2: height - axis + 4, stroke: "var(--ink)", "stroke-width": 2 }),
    svg("text", { x: baseline, y: top - 12, "text-anchor": "middle" }, "Most common dates"),
  );
  const key = (name, color) => {
    const dot = el("span", { class: "dot" });
    dot.style.background = color;
    return el("span", {}, dot, name);
  };
  root.replaceChildren(el("div", { class: "legend" }, key("Recommended", SERIES.recommended), key("Random", SERIES.random)), chart, tip);
}

function banner(lines) {
  const node = document.getElementById("banner");
  node.hidden = lines.length === 0;
  node.replaceChildren(...lines.map((line) => el("p", {}, line)));
}

function warnings() {
  const lines = [];
  for (const [river, added] of Object.entries(plan.widened)) {
    const parts = [];
    if (added.flow.length) parts.push(`flow to include ${added.flow.map((step) => scales.flow[step]).join(", ")}`);
    if (added.temperature.length) parts.push(`temperature to include ${added.temperature.map((step) => scales.temperature[step]).join(", ")}`);
    lines.push(`${river}: no launches matched. Widened ${parts.join(" and ")}.`);
  }
  for (const river of plan.unavailable) lines.push(`${river}: no launches when you're free.`);
  return lines;
}

function sync() {
  for (const run of syncs) run();
}

async function submit() {
  const button = document.getElementById("submit");
  const request = (latest += 1);
  const considered = {};
  for (const river of chosen()) {
    const own = state.rivers[river.name];
    considered[river.name] = {
      days: own.days,
      flow: own.flow && [...own.flow],
      temperature: own.temperature && [...own.temperature],
      priority: own.priority,
    };
  }
  button.disabled = true;
  try {
    const response = await fetch("/api/plan", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        flow: [...state.flow], temperature: [...state.temperature], priority: state.priority,
        rivers: considered, away: [...state.away],
      }),
    });
    if (!response.ok) throw new Error(response.status);
    const found = await response.json();
    if (request !== latest) return;
    plan = found;
    const out = document.getElementById("out");
    out.hidden = false;
    out.classList.remove("stale");
    results();
    oddsChart();
    banner(warnings());
  } catch {
    if (request === latest) banner(["Can't reach the plan."]);
  } finally {
    if (request === latest) { button.disabled = false; sync(); }
  }
}

async function start() {
  try {
    const response = await fetch("/api/rivers");
    if (!response.ok) throw new Error(response.status);
    const found = await response.json();
    rivers = found.rivers;
    for (const river of rivers) launchDates[river.name] = new Set(river.launches);
    scales = { flow: found.flow, temperature: found.temperature };
    state.flow = new Set(found.preferences.flow);
    state.temperature = new Set(found.preferences.temperature);
    state.priority = found.preferences.priority;
    for (const river of rivers) {
      state.rivers[river.name] = { on: true, days: null, flow: null, temperature: null, priority: null };
    }
    preferencesPanel();
    document.getElementById("rivers").append(...rivers.map(riverRow));
    picker();
    calendar();
    key();
    document.getElementById("submit").addEventListener("click", submit);
    document.getElementById("download").addEventListener("click", download);
    let width = 0;
    new ResizeObserver(([entry]) => {
      if (entry.contentRect.width !== width && plan.odds.length) oddsChart();
      width = entry.contentRect.width;
    }).observe(document.getElementById("odds"));
    sync();
  } catch {
    banner(["Can't reach the rivers."]);
  }
}

start();
</script>
